<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Great Throw</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; margin: auto; aspect-ratio: 4 / 3; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; border-radius: 2.5% / 3.3%; }
  #live { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; visibility: hidden;
          filter: saturate(1.5) contrast(1.2) brightness(.92); }
  #yt { position: absolute; top: 50%; left: 50%; width: 214%; height: 120%; transform: translate(-50%, -50%); border: 0; pointer-events: none; visibility: hidden;
        filter: saturate(1.5) contrast(1.2) brightness(.92); }   /* 16:9 YouTube video covering the 4:3 screen */
  #txt { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }   /* sharp text layer, still under the scanlines */
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fx { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.7) 100%);
        box-shadow: inset 0 0 60px rgba(120,200,255,.12); z-index: 6; }
  #qr { position: absolute; right: 2%; bottom: 9%; width: 16%; background: #fff; padding: .8%; display: none; image-rendering: pixelated; z-index: 7; }
  #qr img { width: 100%; height: auto; aspect-ratio: 1; display: block; }

  #qr.pair { right: auto; bottom: auto; left: 33%; top: 47%; width: 26%; transform: translate(-50%, -50%); padding: 1.2%; }
  #pad { position: absolute; inset: 0; display: none; background: #111; }
  #pad canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <video id="live" muted loop playsinline autoplay preload="auto"></video>
  <iframe id="yt" allow="autoplay; encrypted-media" tabindex="-1" title=""></iframe>
  <canvas id="screen" width="320" height="240"></canvas>
  <canvas id="txt" width="1280" height="960"></canvas>
  <div id="qr"></div>
  <audio id="music" src="audio/soundtrack.mp3" loop preload="auto"></audio>
  <div id="fx"></div>
</div>
<div id="pad"><canvas id="padc"></canvas></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   THE GREAT THROW · v5
   Laptop = target screen (index.html) · Phone = controller (?role=phone&id=XXXX)
   ============================================================ */

// video: a free-licence video of the capital (Wikimedia Commons, credits in README), smaller versions first.
// None loading = fallback city. Real time stays: local hour tints the video (night / dusk), real rain is drawn on top.
const NATIONS = {
  italy:      { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a8/Fontaine_de_Trevi.webm/Fontaine_de_Trevi.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a8/Fontaine_de_Trevi.webm/Fontaine_de_Trevi.webm.240p.vp9.webm'], lat: 41.90, lon: 12.50,  tz: 'Europe/Rome' },
  spain:      { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/0/07/Puerta_del_Sol%2C_2012.webm/Puerta_del_Sol%2C_2012.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/0/07/Puerta_del_Sol%2C_2012.webm/Puerta_del_Sol%2C_2012.webm.240p.vp9.webm'], lat: 40.42, lon: -3.70,  tz: 'Europe/Madrid' },
  france:     { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/1/12/Eiffel_tower_141853_1.webm/Eiffel_tower_141853_1.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/1/12/Eiffel_tower_141853_1.webm/Eiffel_tower_141853_1.webm.240p.vp9.webm'], lat: 48.86, lon: 2.35,   tz: 'Europe/Paris' },
  germany:    { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/2/2d/Demo_von_Wikimedia_und_F5_gegen_das_Sicherheitspaket_vor_dem_Brandenburger_Tor_02.webm/Demo_von_Wikimedia_und_F5_gegen_das_Sicherheitspaket_vor_dem_Brandenburger_Tor_02.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/2/2d/Demo_von_Wikimedia_und_F5_gegen_das_Sicherheitspaket_vor_dem_Brandenburger_Tor_02.webm/Demo_von_Wikimedia_und_F5_gegen_das_Sicherheitspaket_vor_dem_Brandenburger_Tor_02.webm.240p.vp9.webm'], lat: 52.52, lon: 13.40,  tz: 'Europe/Berlin' },
  usa:        { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/5/57/2025-12-17_White_House_ballroom_construction_Washington_DC_11-23-28_1.webm/2025-12-17_White_House_ballroom_construction_Washington_DC_11-23-28_1.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/5/57/2025-12-17_White_House_ballroom_construction_Washington_DC_11-23-28_1.webm/2025-12-17_White_House_ballroom_construction_Washington_DC_11-23-28_1.webm.240p.vp9.webm'], lat: 38.89, lon: -77.03, tz: 'America/New_York' },
  russia:     { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/b/be/A_view_of_Red_Square_MVI_6782.ogv/A_view_of_Red_Square_MVI_6782.ogv.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/b/be/A_view_of_Red_Square_MVI_6782.ogv/A_view_of_Red_Square_MVI_6782.ogv.240p.vp9.webm'], lat: 55.75, lon: 37.62,  tz: 'Europe/Moscow' },
  china:      { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/f/fc/%E5%A4%A9%E5%AE%89%E9%97%A8%E7%AD%89%E5%9C%B0%E4%B8%8B%E5%8D%8A%E6%97%97%E6%82%BC%E5%BF%B5%E6%9D%8E%E5%85%8B%E5%BC%BA%E5%90%8C%E5%BF%97.webm/%E5%A4%A9%E5%AE%89%E9%97%A8%E7%AD%89%E5%9C%B0%E4%B8%8B%E5%8D%8A%E6%97%97%E6%82%BC%E5%BF%B5%E6%9D%8E%E5%85%8B%E5%BC%BA%E5%90%8C%E5%BF%97.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/f/fc/%E5%A4%A9%E5%AE%89%E9%97%A8%E7%AD%89%E5%9C%B0%E4%B8%8B%E5%8D%8A%E6%97%97%E6%82%BC%E5%BF%B5%E6%9D%8E%E5%85%8B%E5%BC%BA%E5%90%8C%E5%BF%97.webm/%E5%A4%A9%E5%AE%89%E9%97%A8%E7%AD%89%E5%9C%B0%E4%B8%8B%E5%8D%8A%E6%97%97%E6%82%BC%E5%BF%B5%E6%9D%8E%E5%85%8B%E5%BC%BA%E5%90%8C%E5%BF%97.webm.240p.vp9.webm'], lat: 39.90, lon: 116.40, tz: 'Asia/Shanghai' },
  saudi:      { video: [], yt: { id: 'l9bU24Nu-cc', from: 20, to: 230 }, lat: 24.71, lon: 46.68,  tz: 'Asia/Riyadh' },
  northkorea: { video: ['https://upload.wikimedia.org/wikipedia/commons/transcoded/4/47/Donny_Ferguson_-_360_degree_view_of_Pyongyang%2C_North_Korea%2C_from_atop_the_Juche_Tower.webm/Donny_Ferguson_-_360_degree_view_of_Pyongyang%2C_North_Korea%2C_from_atop_the_Juche_Tower.webm.480p.vp9.webm', 'https://upload.wikimedia.org/wikipedia/commons/transcoded/4/47/Donny_Ferguson_-_360_degree_view_of_Pyongyang%2C_North_Korea%2C_from_atop_the_Juche_Tower.webm/Donny_Ferguson_-_360_degree_view_of_Pyongyang%2C_North_Korea%2C_from_atop_the_Juche_Tower.webm.240p.vp9.webm'], lat: 39.02, lon: 125.75, tz: 'Asia/Pyongyang' },
};
const COUNTRIES = Object.keys(NATIONS);

// Beat X and these two react (see the brief)
const REACTIONS = {
  italy: ['france', 'spain'],      spain: ['italy', 'usa'],         france: ['germany', 'saudi'],
  germany: ['russia', 'china'],    usa: ['china', 'northkorea'],    russia: ['germany', 'china'],
  china: ['usa', 'northkorea'],    saudi: ['usa', 'france'],        northkorea: ['russia', 'china'],
};

const CONFIG = { duels: 5, flags: 3, sectors: 3, radius: 84, camMinPixels: 8, flickSpeed: 1.6, growThrow: 1.45, camTolerance: 90 };
// flickSpeed: sideways speed that counts as a throw (screen-widths per second) · growThrow: how much bigger the phone must get in 0.25 s · camTolerance: colour match after calibration

// Each nation's currency. The coin of the day = how much the currency moved against gold since yesterday.
const CURRENCY = {
  italy: 'eur', spain: 'eur', france: 'eur', germany: 'eur', usa: 'usd',
  russia: 'rub', china: 'cny', saudi: 'sar', northkorea: null, // North Korea: no free market rate → censored coin
};
const SYMBOL = { eur: '€', usd: '$', rub: '₽', cny: '¥', sar: '﷼' };
let GOLD = { eur: 0, usd: 0, rub: 0, cny: 0, sar: 0 }; // % change of gold priced in each currency (fallback: 0)

/* ============================================================
   MUSIC (audio/soundtrack.mp3 + Web Audio for a real visualiser and the tape-stop effect)
   ============================================================ */
const Music = (() => {
  const el = () => document.getElementById('music');
  let ctx = null, analyser = null, data = null, muted = false, stopping = null;
  function start() {
    const a = el(); if (!a) return;
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(a); analyser = ctx.createAnalyser(); analyser.fftSize = 64;
        src.connect(analyser); analyser.connect(ctx.destination); data = new Uint8Array(analyser.frequencyBinCount);
      }
      ctx.resume();
    } catch (e) {}
    clearInterval(stopping); a.playbackRate = 1; a.muted = muted;
    a.play().catch(() => {}); // no file yet: stay silent
  }
  // crash: the song slows down and dies, like a tape that jams
  function crash() {
    const a = el(); if (!a || a.paused) return;
    clearInterval(stopping);
    stopping = setInterval(() => { a.playbackRate = Math.max(.25, a.playbackRate - .08); if (a.playbackRate <= .25) { clearInterval(stopping); a.pause(); } }, 50);
  }
  function toggleMute() { muted = !muted; el().muted = muted; }
  // 5 bar levels (0..1) for the taskbar tray
  function levels() {
    if (!analyser || el().paused || muted) return [0, 0, 0, 0, 0];
    analyser.getByteFrequencyData(data);
    return [1, 3, 6, 10, 16].map(i => data[i] / 255);
  }
  return { start, crash, toggleMute, levels, get muted() { return muted; } };
})();

/* ============================================================
   MODEM: a synthesised dial-up connection (original sound, made with Web Audio)
   ============================================================ */
const Modem = (() => {
  let ctx = null, out = null;
  function unlock() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {} }
  function tone(f, t0, d, type, vol) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    gn.gain.setValueAtTime(vol || .08, t0); gn.gain.setValueAtTime(0, t0 + d);
    o.connect(gn); gn.connect(out); o.start(t0); o.stop(t0 + d + .02); return o;
  }
  function noise(t0, d, freq) {
    const len = Math.floor(ctx.sampleRate * d), buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), gn = ctx.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3; gn.gain.value = .12;
    src.connect(bp); bp.connect(gn); gn.connect(out); src.start(t0);
  }
  function play() {
    if (!ctx) return;
    try {
      out = ctx.createGain(); out.gain.value = .9; out.connect(ctx.destination);
      let t = ctx.currentTime + .05;
      const keys = [[697, 1209], [770, 1336], [852, 1477], [941, 1336], [697, 1336], [770, 1477], [852, 1209]];
      keys.forEach(([a, b]) => { tone(a, t, .08); tone(b, t, .08); t += .13; });             // dialling
      t += .25; tone(2100, t, .6, 'sine', .06); t += .65;                                    // answer tone
      for (let i = 0; i < 6; i++) { const o = tone(980 + i * 120, t, .14, 'square', .03); o.frequency.linearRampToValueAtTime(1650 + i * 90, t + .14); t += .16; } // handshake
      noise(t, .9, 1800); tone(1200, t, .9, 'sawtooth', .02); t += .95;
      noise(t, .6, 2400);
    } catch (e) {}
  }
  function stop() { try { if (out) { out.gain.setValueAtTime(0, ctx.currentTime); out.disconnect(); out = null; } } catch (e) {} }
  return { unlock, play, stop };
})();

const role = new URLSearchParams(location.search).get('role');
if (role === 'phone') startPhone(); else startTarget();

/* ============================================================
   FLAGS (pixel art, no text)
   ============================================================ */
function flag(g, id, x, y, w, h) {
  x = Math.round(x); y = Math.round(y); w = Math.max(3, Math.round(w)); h = Math.max(2, Math.round(h));
  const v = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x + Math.floor(i * w / c.length), y, Math.ceil(w / c.length), h); });
  const o = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x, y + Math.floor(i * h / c.length), w, Math.ceil(h / c.length)); });
  const px = (fx, fy, fw, fh, col) => { g.fillStyle = col; g.fillRect(x + Math.round(fx * w), y + Math.round(fy * h), Math.max(1, Math.round(fw * w)), Math.max(1, Math.round(fh * h))); };
  switch (id) {
    case 'italy': v(['#009246', '#f1f2f1', '#ce2b37']); break;
    case 'france': v(['#0055a4', '#f1f2f1', '#ef4135']); break;
    case 'germany': o(['#111', '#dd0000', '#ffce00']); break;
    case 'russia': o(['#f1f2f1', '#0039a6', '#d52b1e']); break;
    case 'spain': o(['#aa151b', '#f1bf00', '#f1bf00', '#aa151b']); break;
    case 'usa':
      for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? '#f1f2f1' : '#b22234'; g.fillRect(x, y + Math.floor(i * h / 7), w, Math.ceil(h / 7)); }
      px(0, 0, .42, .55, '#3c3b6e'); break;
    case 'china': g.fillStyle = '#de2910'; g.fillRect(x, y, w, h); px(.1, .15, .16, .24, '#ffde00'); break;
    case 'saudi': g.fillStyle = '#006c35'; g.fillRect(x, y, w, h); px(.2, .62, .6, .08, '#f1f2f1'); px(.25, .3, .5, .12, '#f1f2f1'); break;
    case 'northkorea': o(['#024fa2', '#f1f2f1', '#be0000', '#be0000', '#f1f2f1', '#024fa2']); px(.22, .3, .2, .4, '#f1f2f1'); px(.26, .37, .12, .26, '#be0000'); break;
  }
}

/* ============================================================
   LAPTOP · TARGET SCREEN
   ============================================================ */
function startTarget() {
  const cv = document.getElementById('screen'), g = cv.getContext('2d');
  // text is drawn 4x sharper on its own layer: same position, colour and font as on the pixel screen
  const tc = document.getElementById('txt').getContext('2d');
  ['fillText', 'strokeText'].forEach(fn => {
    g[fn] = function (text, x, y, maxW) {
      const m = g.getTransform();
      tc.setTransform(m.a * 4, m.b * 4, m.c * 4, m.d * 4, m.e * 4, m.f * 4);
      tc.font = g.font; tc.textAlign = g.textAlign; tc.textBaseline = g.textBaseline; tc.globalAlpha = g.globalAlpha;
      tc.fillStyle = g.fillStyle; tc.strokeStyle = g.strokeStyle; tc.lineWidth = g.lineWidth; tc.lineJoin = 'round';
      maxW === undefined ? tc[fn](text, x, y) : tc[fn](text, x, y, maxW);
    };
  });
  g.imageSmoothingEnabled = false;
  const W = 320, H = 240, CX = 160, CY = 116;
  const WIN = { x: 44, y: 8, w: 232, h: 212 };

  const S = {
    scene: 'off', t: 0, sel: 0, me: null, rival: null, loaded: 0, dataDone: 0,
    wheel: 0, speed: .7, flights: [], planted: [], left: 0, influence: 0,
    crash: null, weather: {}, phone: false, world: load(),
  };
  window.GT = S; // game state, handy in the browser console for testing
  function load() { try { return JSON.parse(localStorage.getItem('gt-world')) || { conquests: {}, open: [], cards: [] }; } catch (e) { return { conquests: {}, open: [], cards: [] }; } }
  function save() { try { localStorage.setItem('gt-world', JSON.stringify(S.world)); } catch (e) {} }

  // --- sprites + collision masks
  const SPR = {};
  COUNTRIES.forEach(id => {
    const im = new Image(); SPR[id] = { im, ok: false, mask: null };
    im.onerror = () => S.loaded++;
    im.onload = () => {
      SPR[id].ok = true; S.loaded++;
      try { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const cg = c.getContext('2d'); cg.drawImage(im, 0, 0); SPR[id].mask = cg.getImageData(0, 0, im.width, im.height); }
      catch (e) { SPR[id].mask = null; } // opened as a local file: approximate collision
    };
    im.src = 'img/' + id + '.png';
  });

  // --- real-world data
  // gold today vs yesterday, priced in every currency (free currency-api on jsDelivr, no key)
  const iso = d => d.toISOString().slice(0, 10);
  const goldOn = date => fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/xau.json`).then(r => r.json()).then(d => d.xau);
  Promise.all([goldOn('latest'), goldOn(iso(new Date(Date.now() - 864e5))).catch(() => goldOn(iso(new Date(Date.now() - 2 * 864e5))))]).then(([now, before]) => {
    Object.keys(GOLD).forEach(c => { if (now[c] && before[c]) GOLD[c] = (now[c] / before[c] - 1) * 100; });
  }).catch(() => {}).finally(() => S.dataDone++);
  { const a = document.getElementById('music'); let once = false; const ok = () => { if (!once) { once = true; S.loaded++; } }; a.addEventListener('canplaythrough', ok); a.addEventListener('error', ok); setTimeout(ok, 4000); }
  COUNTRIES.forEach(id => {
    const n = NATIONS[id];
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${n.lat}&longitude=${n.lon}&current=cloud_cover,precipitation`)
      .then(r => r.json()).then(d => { if (d.current) S.weather[id] = { clouds: d.current.cloud_cover, rain: d.current.precipitation }; }).catch(() => {}).finally(() => S.dataDone++);
  });
  // strength of a coin: if gold got more expensive in your currency, your coin got weaker
  const strength = id => CURRENCY[id] ? -GOLD[CURRENCY[id]] : null;
  // who starts: the coin that grew most today against gold; same currency or a censored coin → toss a coin
  function decide() {
    const a = strength(S.me), b = strength(S.rival);
    S.toss = a === null || b === null || CURRENCY[S.me] === CURRENCY[S.rival];
    S.meFirst = S.toss ? Math.random() < .5 : a >= b;
  }
  const clock = (id, withMinutes) => {
    const f = new Intl.DateTimeFormat('en-GB', { timeZone: NATIONS[id].tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    return withMinutes ? f : Number(f.slice(0, 2)) % 24;
  };

  // --- live camera of the square
  // --- video of the capital: try each source until one plays; otherwise the drawn city
  const Live = (() => {
    const v = document.getElementById('live'), yt = document.getElementById('yt'); v.muted = true;
    let want = null, list = [], idx = 0, playing = false, timer = 0; const dead = {};
    v.addEventListener('playing', () => { playing = true; clearTimeout(timer); v.style.visibility = 'visible'; });
    v.addEventListener('error', () => next());
    function next() {   // try the next file; if one is not playing within 8 s, skip it
      playing = false; v.style.visibility = 'hidden'; clearTimeout(timer);
      if (idx >= list.length) { if (want) dead[want] = true; v.removeAttribute('src'); return; }
      v.src = list[idx++]; v.play().catch(() => {});
      timer = setTimeout(() => { if (!playing) next(); }, 8000);
    }
    function showYT(c) {   // muted, no controls, loops a stretch with no people
      v.pause(); v.style.visibility = 'hidden';
      const src = `https://www.youtube.com/embed/${c.id}?autoplay=1&mute=1&controls=0&disablekb=1&fs=0&iv_load_policy=3&loop=1&playlist=${c.id}&start=${c.from}&end=${c.to}&playsinline=1&rel=0&cc_load_policy=0&cc_lang_pref=zz`;
      if (yt.src !== src) yt.src = src;
      yt.onload = () => setTimeout(() => { if (want && NATIONS[want].yt) { playing = true; yt.style.visibility = 'visible'; } }, 1800);   // hide YouTube's own title fade-in
    }
    function show(id) {
      if (id === want) return;
      want = id; idx = 0; list = (id && NATIONS[id].video) || []; clearTimeout(timer);
      yt.style.visibility = 'hidden'; playing = false;
      if (id && NATIONS[id].yt) return showYT(NATIONS[id].yt);
      if (yt.src) yt.removeAttribute('src');
      if (!id || !list.length || dead[id]) { v.style.visibility = 'hidden'; v.pause(); return; }
      next();
    }
    // some browsers block autoplay until the first click: try again then
    addEventListener('pointerdown', () => { if (want && !playing && v.src) v.play().catch(() => {}); });
    return { show, isPlaying: id => playing && want === id };
  })();
  const live = id => Live.show(id);


  // --- phone controller (PeerJS)
  const code = String(Math.floor(1000 + Math.random() * 9000));
  try {
    const peer = new Peer('greatthrow-' + code);
    peer.on('open', () => {
      S.peerOk = true; updateQR();
    });
    peer.on('connection', conn => {
      S.conn = conn;
      conn.on('open', () => { S.phone = true; updateQR(); sendFlag(); });
      conn.on('data', d => {
        S.signal = 1; // tray phone icon flashes: a message arrived
        if (d.type === 'tap') { if (S.scene === 'duel') throwAtAim(); else press(); }

    if (S.scene === 'pair') { if (p.x < WIN.x + 30 && p.y > 188 && p.y < 216) go('win'); return; }   // only the mouse icon: play without a phone
    if (S.scene === 'duel') return throwFlag(p.x, p.y);
    if (S.scene === 'draft') {
      const i = Math.floor((p.x - 8) / 34);
      if (i >= 0 && i < 9 && p.y > 60 && p.y < 200) { if (owner(COUNTRIES[i]) !== null) return; if (i === S.sel) press(); else S.sel = i; return; }
    }
    if (S.scene === 'players' && p.y > 60 && p.y < 190) { const i = Math.max(0, Math.min(2, Math.floor((p.x - 40) / 80))); if (i === S.sel) press(); else S.sel = i; return; }
    press();
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === ' ' && S.scene === 'duel') { e.preventDefault(); return throwAtAim(); }
    if (e.key === '[' || e.key === ']') { const k = e.key === ']' ? .8 : 1.25; CONFIG.flickSpeed *= k; CONFIG.growThrow = 1 + (CONFIG.growThrow - 1) * k; S.sensShow = 2; } // ] = more sensitive
    if (e.key === 'Enter' && S.scene === 'pair') return go('win');   // laptop keyboard: play without a phone
    if (e.key === 'Enter' || e.key === ' ') press();
  });
  function move(d) {
    if (S.scene === 'players') S.sel = (S.sel + d + 3) % 3;
    if (S.scene === 'draft') for (let i = 0; i < 9; i++) { S.sel = (S.sel + d + 9) % 9; if (owner(COUNTRIES[S.sel]) === null) break; }
  }

  function go(sc) { S.scene = sc; S.t = 0; if (sc === 'pair') Cam.start(); updateQR(); if (sc === 'crash') Music.crash(); }
  function press() {
    const sc = S.scene;
    if (sc === 'off') { Modem.unlock(); go('splash'); }
    else if (sc === 'splash' || sc === 'dial') { Modem.stop(); Music.start(); go('title'); } // skip the intro
    else if (sc === 'title') { Music.start(); S.sel = 0; go('rules'); }
    else if (sc === 'rules' && S.t > 1.5) go('players');
    else if (sc === 'players') {                       // how many players: 2, 3 or 4
      S.n = S.sel + 2; S.world = { conquests: {}, owner: {}, cards: [] }; S.picker = 0; S.duels = 0; S.sel = 0; S.me = null; go('draft');
    }
    else if (sc === 'draft') {                         // everybody takes a country in turn until they run out; leftovers stay neutral
      const id = COUNTRIES[S.sel]; if (owner(id) !== null) return;
      S.world.owner[id] = S.picker; S.picker = (S.picker + 1) % S.n;
      const taken = Object.keys(S.world.owner).length;
      if (taken >= Math.floor(9 / S.n) * S.n) { S.startOwner = { ...S.world.owner }; S.scenario = scenarioAfter(null); S.last = null; Cam.on === true ? go('win') : go('pair'); }
      else { S.sel = 0; if (owner(COUNTRIES[0]) !== null) move(1); }
    }
    else if (sc === 'win' && S.t > 4) nextDuel();
    else if (sc === 'coins' && S.t > 2.6) duel();
    else if (sc === 'crash' && S.t > 3) endTurn();
    else if (sc === 'switch' && S.t > 1.5) duel();
    else if (sc === 'result' && S.t > 1.5) afterResult();
    else if (sc === 'ending' && S.t > 2) { S.me = null; go('title'); }
  }

  // a duel: the two countries the card picked. Each one throws 3 flags at the other's leader;
  // touching the leader ends your turn with 0. A neutral country does not throw: close the triangle to take it.
  function nextDuel() {
    const c = S.scenario; S.duelists = [c.a, c.b]; S.turn = 0; S.scores = [0, 0]; S.closed = [false, false];
    S.me = c.a; S.rival = c.b; S.world.cards = (S.world.cards || []).concat({ kind: c.kind, from: c.from, open: c.open }); sendFlag(); coins();
  }
  function endTurn() {
    if (S.turn === 0 && owner(S.duelists[1]) !== null) { S.turn = 1; S.me = S.duelists[1]; S.rival = S.duelists[0]; sendFlag(); go('switch'); }
    else go('result');
  }
  function afterResult() {
    const [a, b] = S.duelists, two = owner(b) !== null;
    if (two && S.scores[0] === S.scores[1]) { S.turn = 0; S.me = a; S.rival = b; sendFlag(); duel(); return; }   // tie: play again
    const win = two ? (S.scores[0] > S.scores[1] ? a : b) : (S.closed[0] ? a : null), lose = win === a ? b : a;
    S.duels++;
    if (win) { S.world.owner[lose] = owner(win); S.world.conquests[lose] = flagOf(win); }   // the beaten country flies the winner's flag
    S.last = win;
    const alive = players().filter(p => countOf(p) > 0);
    if (alive.length === 1 && COUNTRIES.every(id => owner(id) === alive[0]) || S.duels >= CONFIG.duels) return finish();
    S.scenario = scenarioAfter(win || b); go('win');
  }
  function finish() {   // most countries wins; the winner's home flag covers the screen
    const best = Math.max(...players().map(countOf)), top = players().filter(p => countOf(p) === best);
    if (top.length > 1 && S.duels < CONFIG.duels + 3) { S.scenario = scenarioAfter(S.last || S.duelists[1]); go('win'); return; }   // draw: one more duel
    S.champ = top[0]; S.me = COUNTRIES.find(id => owner(id) === S.champ && !S.world.conquests[id]) || COUNTRIES.find(id => owner(id) === S.champ); go('ending');
  }

  function coins() {
    decide(); S.adv = S.meFirst ? S.duelists[0] : S.duelists[1];
    if (S.adv === S.duelists[1] && owner(S.duelists[1]) !== null) {   // the winning coin throws first
      S.duelists.reverse(); S.me = S.duelists[0]; S.rival = S.duelists[1]; S.meFirst = true; sendFlag();
    }
    go('coins');
  }

  function duel() {
    go('duel'); Music.start();
    S.flights = []; S.planted = []; S.left = CONFIG.flags; S.influence = 0; S.wheel = 0;
    // the weaker coin gets the advantage: the wheel starts still
    S.hold = S.adv === S.me ? 1.5 : 0;
    S.falling = [];
  }

  // --- throwing
  function throwFlag(tx, ty) {
    if (S.left <= 0) return;
    S.left--;
    S.flights.push({ tx: tx + (Math.random() - .5) * 5, ty: ty + (Math.random() - .5) * 5, t: 0 });
  }
  const leaderScale = () => { const s = SPR[S.rival]; return s && s.ok ? 118 / s.im.height : 1; };
  function toWheel(x, y) { const dx = x - CX, dy = y - CY, c = Math.cos(-S.wheel), s = Math.sin(-S.wheel); return { x: dx * c - dy * s, y: dx * s + dy * c }; }
  function toScreen(l) { const c = Math.cos(S.wheel), s = Math.sin(S.wheel); return { x: CX + l.x * c - l.y * s, y: CY + l.x * s + l.y * c }; }
  function hitsLeader(l) {
    const sp = SPR[S.rival]; if (!sp || !sp.ok) return Math.abs(l.x) < 25 && Math.abs(l.y) < 55;
    const k = leaderScale(), sx = Math.floor(l.x / k + sp.im.width / 2), sy = Math.floor(l.y / k + sp.im.height / 2);
    if (sx < 0 || sy < 0 || sx >= sp.im.width || sy >= sp.im.height) return false;
    if (!sp.mask) return true;
    // 2-pixel margin: grazing is skill, touching is a mistake
    for (let oy = -2; oy <= 2; oy += 2) for (let ox = -2; ox <= 2; ox += 2) {
      const xx = sx + Math.round(ox / k), yy = sy + Math.round(oy / k);
      if (xx >= 0 && yy >= 0 && xx < sp.im.width && yy < sp.im.height && sp.mask.data[(yy * sp.im.width + xx) * 4 + 3] > 40) return true;
    }
    return false;
  }
  function sectors() {
    const cov = new Array(CONFIG.sectors).fill(false);
    S.planted.forEach(p => { const a = (Math.atan2(p.l.y, p.l.x) + Math.PI * 2) % (Math.PI * 2); cov[Math.floor(a / (Math.PI * 2) * CONFIG.sectors)] = true; });
    return cov;
  }

  function update(dt) {
    S.t += dt; S.clock = (S.clock || 0) + dt;
    Cam.tick(dt, S.clock);
    if (S.scene === 'pair') { S.pairOk = S.phone && Cam.seen > 1 ? (S.pairOk || 0) + dt : 0; if (S.pairOk > .8) go('win'); }   // both ticks green, then go
    const sc = S.scene, prog = S.loaded / 10;
    if (sc === 'splash' && ((S.t > 2.2 && prog >= 1) || S.t > 6)) { Modem.play(); go('dial'); }
    else if (sc === 'dial' && ((S.t > 3 && S.dataDone >= 10) || S.t > 7)) { Modem.stop(); Music.start(); go('title'); }
    S.resend = (S.resend || 0) + dt; if (S.resend > 1.2) { S.resend = 0; sendFlag(); }
    const AUTO = { rules: 25, ending: 15, coins: 4.5, crash: 5, switch: 3.5, result: 3.5, win: 7 };   // the card stays long enough to read it          // nobody has to touch the laptop
    if (AUTO[S.scene] && S.t > AUTO[S.scene]) press();
    if (S.scene === 'draft' && Cam.found) {                                         // choose by pointing the phone
      const list = COUNTRIES.filter(id => owner(id) === null); if (list.length) S.sel = COUNTRIES.indexOf(list[Math.min(list.length - 1, Math.floor(Cam.x * list.length))]);
    }
    if (S.scene === 'players' && Cam.found) S.sel = Math.min(2, Math.floor(Cam.x * 3));
    if (S.scene !== 'duel') return;
    if (S.hold > 0) S.hold -= dt;
    else {
      S.speed = .55 + Math.sin(S.t * .45) * .9;
      S.wheel += S.speed * dt;
    }
    for (const f of S.flights) {
      f.t += dt / .42;
      if (f.t < 1 || f.done) continue;
      f.done = true;
      const l = toWheel(f.tx, f.ty);
      if (hitsLeader(l)) {
        S.crash = { x: f.tx, y: f.ty, cracks: Array.from({ length: 14 }, () => ({ a: Math.random() * Math.PI * 2, r: 30 + Math.random() * 140, k: Math.random() })) };
        S.scores[S.turn] = 0; go('crash'); return;
      }
      const d = Math.hypot(l.x, l.y);
      if (d <= CONFIG.radius) { S.planted.push({ l, t: 0 }); S.influence += Math.max(0, Math.round(100 - d)); }
      else { S.falling.push({ x: f.tx, y: f.ty, v: 0 }); }
    }
    S.flights = S.flights.filter(f => !f.done);
    S.planted.forEach(p => p.t += dt);
    if (sectors().every(Boolean)) { S.closed[S.turn] = true; S.scores[S.turn] = S.influence + 200; endTurn(); }   // triangle closed: +200
    else if (S.left === 0 && !S.flights.length && !S.falling.length) { S.scores[S.turn] = S.influence; endTurn(); }
  }

  /* ---------------- drawing ---------------- */
  function background(id) {
    live(id);
    if (id && Live.isPlaying(id)) {
      g.clearRect(0, 0, W, H);
      const hr = clock(id), wx = S.weather[id] || {};
      if (hr < 6 || hr >= 20) { g.fillStyle = 'rgba(8,12,50,.5)'; g.fillRect(0, 0, W, H); }          // it is night there now
      else if (hr < 8 || hr >= 17) { g.fillStyle = 'rgba(255,110,60,.18)'; g.fillRect(0, 0, W, H); } // dawn or dusk there now
      if (wx.rain > 0) { g.fillStyle = 'rgba(190,210,255,.5)'; for (let i = 0; i < 90; i++) g.fillRect((i * 53 + S.t * 30) % W, (i * 31 + S.t * 230) % H, 1, 4); } // it is raining there now
      return;
    }
    const h = clock(id || 'italy'), m = S.weather[id] || { clouds: 30, rain: 0 };
    const day = h >= 7 && h < 18, dusk = (h >= 17 && h < 20) || (h >= 6 && h < 8);
    const a = day ? [70, 130, 220] : dusk ? [210, 110, 90] : [12, 16, 48], b = day ? [170, 210, 240] : dusk ? [245, 180, 110] : [40, 32, 80];
    for (let y = 0; y < H; y += 3) { const k = y / H, d = ((y / 3) % 2) * .04; g.fillStyle = `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * Math.min(1, k + d))).join(',')})`; g.fillRect(0, y, W, 3); }
    g.fillStyle = day ? 'rgba(245,245,255,.85)' : 'rgba(90,90,120,.85)';
    for (let i = 0; i < Math.round(m.clouds / 12); i++) { const x = (i * 83 + S.t * 3) % (W + 80) - 40, y = 14 + (i * 29) % 70; g.fillRect(Math.round(x), y, 40, 9); g.fillRect(Math.round(x) + 10, y - 6, 22, 7); }
    // generic low-poly city
    g.fillStyle = day ? '#6d7f8f' : '#1c1a2e';
    for (let i = 0; i < 18; i++) { const w = 12 + (i * 7) % 14, hh = 20 + (i * 37) % 46; g.fillRect(i * 19 - 4, 196 - hh, w, hh + 30); }
    g.fillStyle = day ? '#59705a' : '#151a18'; g.fillRect(0, 196, W, 44);
    if (!day) { g.fillStyle = '#ffd36b'; for (let i = 0; i < 40; i++) g.fillRect((i * 41) % W, 150 + (i * 17) % 44, 2, 2); }
    if (m.rain > 0) { g.fillStyle = 'rgba(190,210,255,.55)'; for (let i = 0; i < 90; i++) g.fillRect((i * 53 + S.t * 30) % W, (i * 31 + S.t * 230) % H, 1, 4); }
  }

  function desktop(bgOf) {
    background(bgOf);
    // one icon per nation. Once the countries are shared out: teams on the sides
    // (player 1 left, 2 right, 3 left below, 4 right below, neutrals grey below the shorter side); icons glide to their new team
    const teams = S.n && Object.keys(S.world.owner || {}).length;
    const pos = {};
    if (!teams) COUNTRIES.forEach((id, i) => pos[id] = [6, 6 + i * 23]);
    else {
      const groups = players().map(p => ({ p, ids: COUNTRIES.filter(id => owner(id) === p) })), neutral = COUNTRIES.filter(id => owner(id) === null);
      const side = [[], []]; groups.forEach((gr, i) => side[i % 2].push(gr));
      if (neutral.length) { const n = (k) => side[k].reduce((a, gr) => a + gr.ids.length, 0); side[n(0) <= n(1) ? 0 : 1].push({ p: null, ids: neutral }); }
      side.forEach((list, k) => {
        const x = k ? W - 30 : 6, rows = list.reduce((a, gr) => a + gr.ids.length, 0), heads = list.length;
        const step = Math.min(23, (218 - heads * 12) / Math.max(1, rows)); let y = 4;
        list.forEach(gr => {
          if (!gr.ids.length) return;
          badge(gr.p, x + 14, y + 5); y += 12;
          gr.ids.forEach(id => { pos[id] = [x, y]; y += step; });
        });
      });
    }
    S.icon = S.icon || {};
    COUNTRIES.forEach((id, i) => {
      if (!pos[id]) return;
      const cur = S.icon[id] || pos[id]; cur[0] += (pos[id][0] - cur[0]) * .12; cur[1] += (pos[id][1] - cur[1]) * .12; S.icon[id] = cur;
      const x = Math.round(cur[0]), y = Math.round(cur[1]), cq = S.world.conquests[id], re = (S.world.open || []).includes(id);
      if (re && Math.floor(S.t * 3) % 2) { g.fillStyle = 'rgba(80,140,255,.6)'; g.fillRect(x - 2, y - 2, 30, 22); }
      head(id, x + 4, y, 16);
      flag(g, cq || id, x + 14, y + 10, 14, 9);
      if (cq) { g.strokeStyle = '#ffe680'; g.lineWidth = 1; g.strokeRect(x + 13.5, y + 9.5, 15, 10); }
    });
    taskbar();
  }
  function taskbar() {
    (S.world.cards || []).slice(-9).forEach((c, i) => card(c.kind, c.from, 46 + i * 12, 227, 10, 12, undefined, false, c.open));
    // phone icon: green when connected, flashes white when a gesture arrives
    if (S.phone) { S.signal = Math.max(0, (S.signal || 0) - .05); g.fillStyle = S.signal > 0 ? '#ffffff' : '#7dff9a'; g.fillRect(232, 228, 6, 10); g.fillStyle = '#1f4fb8'; g.fillRect(233, 229, 4, 7); }
    g.fillStyle = '#1f4fb8'; g.fillRect(0, 226, W, 14);
    g.fillStyle = '#3c7be0'; g.fillRect(0, 226, W, 2);
    g.fillStyle = '#2f9e3a'; g.fillRect(0, 226, 42, 14); g.fillStyle = '#4ccf58'; g.fillRect(0, 226, 42, 2);
    if (S.me) flag(g, S.me, 8, 229, 13, 9); else { g.fillStyle = '#fff'; g.fillRect(10, 230, 4, 4); g.fillRect(15, 230, 4, 4); g.fillRect(10, 235, 4, 4); g.fillRect(15, 235, 4, 4); }
    g.fillStyle = '#1a8fd8'; g.fillRect(W - 70, 226, 70, 14);
    // tray: speaker + live bars from the real audio (click to mute)
    g.fillStyle = '#fff'; g.fillRect(W - 66, 231, 2, 4); g.beginPath(); g.moveTo(W - 64, 231); g.lineTo(W - 61, 228); g.lineTo(W - 61, 238); g.lineTo(W - 64, 235); g.fill();

    number(clock(S.rival || 'italy', true), W - 20, 236, '#fff');
  }

  function head(id, x, y, h) {
    const sp = SPR[id]; if (!sp.ok) return;
    const k = h * 2.6 / sp.im.height; // top of the sprite only: the head
    g.save(); g.beginPath(); g.rect(x - 8, y, 16, h); g.clip();
    g.drawImage(sp.im, x - sp.im.width * k / 2, y, sp.im.width * k, sp.im.height * k); g.restore();
  }

  function windowFrame(x, y, w, h, flagId) {
    g.fillStyle = '#0a246a'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
    g.fillStyle = '#245edb'; g.fillRect(x, y, w, 12); g.fillStyle = '#3a7bf0'; g.fillRect(x, y, w, 3);
    if (flagId) flag(g, flagId, x + 4, y + 2, 12, 8);
    g.fillStyle = '#d9472b'; g.fillRect(x + w - 12, y + 2, 9, 8);
    g.fillStyle = '#fff'; g.fillRect(x + w - 10, y + 4, 1, 1); g.fillRect(x + w - 9, y + 5, 3, 2); g.fillRect(x + w - 6, y + 4, 1, 1); g.fillRect(x + w - 10, y + 7, 1, 1); g.fillRect(x + w - 6, y + 7, 1, 1);
    g.fillStyle = '#245edb'; g.fillRect(x, y + 12, 2, h - 12); g.fillRect(x + w - 2, y + 12, 2, h - 12); g.fillRect(x, y + h - 2, w, 2);
  }

  function wheel() {
    const R = CONFIG.radius + 6;
    g.save(); g.translate(CX, CY); g.rotate(S.wheel);
    // concentric white and red rings
    for (let i = 7; i >= 0; i--) { g.fillStyle = i % 2 ? '#f4efe6' : '#d32626'; g.beginPath(); g.arc(0, 0, R * (i + 1) / 8, 0, Math.PI * 2); g.fill(); }
    // spokes so the rotation is visible
    g.fillStyle = 'rgba(0,0,0,.08)';
    for (let i = 0; i < 12; i += 2) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, i * Math.PI / 6, (i + 1) * Math.PI / 6); g.fill(); }
    // rim with bulbs
    g.strokeStyle = '#c8a14a'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.stroke();
    for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; g.fillStyle = (Math.floor(S.t * 5) + i) % 2 ? '#fff3a0' : '#8a6a20'; g.fillRect(Math.round(Math.cos(a) * R) - 1, Math.round(Math.sin(a) * R) - 1, 3, 3); }
    const sp = SPR[S.rival];

    if (sp && sp.ok) { const k = leaderScale(), jx = (Math.random() - .5) * .6; g.drawImage(sp.im, -sp.im.width * k / 2 + jx, -sp.im.height * k / 2, sp.im.width * k, sp.im.height * k); }
    g.restore();
    g.fillStyle = '#4a3a20'; g.fillRect(CX - 3, CY + R - 2, 6, 34); // stand
  }

  function pole(x, y, id, scale, t) {
    const s = scale || 1;
    g.fillStyle = '#e8e0c8'; g.fillRect(Math.round(x), Math.round(y - 11 * s), 1, Math.round(12 * s));
    flag(g, id, x + 1, y - 11 * s + Math.round(Math.sin((t || 0) * 6 + x) * 1), 12 * s, 8 * s);
  }

  function number(n, x, y, col) { g.fillStyle = col || '#ffe680'; g.font = '8px monospace'; g.textAlign = 'center'; g.fillText(String(n), x, y); }

  // a big PS1-style coin: size follows today's move against gold
  function coin(x, y, id, r, lit, spin) {
    const sx = spin === undefined ? 1 : Math.abs(Math.cos(spin)); // flattening while it spins
    g.save(); g.translate(x, y); g.scale(Math.max(.08, sx), 1);
    g.fillStyle = lit && Math.floor(S.t * 4) % 2 ? '#fff3a0' : '#c99a2e'; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#8a6418'; g.beginPath(); g.arc(0, 0, r - 3, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#e8c25a'; g.beginPath(); g.arc(-1, -1, r - 5, 0, Math.PI * 2); g.fill();
    const c = CURRENCY[id];
    if (!c) { g.fillStyle = '#000'; g.fillRect(-r + 2, -5, 2 * r - 4, 10); } // censored
    else { g.fillStyle = '#7a5410'; g.font = `900 ${Math.round(r * 1.1)}px "Arial Black", sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(SYMBOL[c], 0, 1); g.textBaseline = 'alphabetic'; }
    g.restore();
  }

  // final screen: the winning team, a globe turning into its colour, its starting flags orbiting around, who it defeated
  function winScreen() {
    const t = S.t, p = S.champ, col = PCOL[p], start = COUNTRIES.filter(id => (S.startOwner || {})[id] === p);
    g.fillStyle = '#060b24'; g.fillRect(0, 0, W, 226);
    for (let i = 0; i < 60; i++) {   // confetti in the team colour and white
      const x = (i * 47 + Math.sin(t * 2 + i) * 12) % W, y = ((i * 23) % 240 + t * (35 + i % 5 * 10)) % 250 - 20;
      g.fillStyle = i % 3 ? col : '#fff'; g.fillRect(Math.round(x), Math.round(y), 3, 2 + i % 3);
    }
    // ring of the team's starting flags, alternating, orbiting the globe

      (S.falling || []).forEach(p => { p.v += .25; p.y += p.v; pole(p.x, p.y, flagOf(S.me), 1, S.t); });
      S.falling = (S.falling || []).filter(p => p.y < 240);
      if (sc === 'duel' && Cam.found) S.aim = camAim(Cam.x, Cam.y);
      if (sc === 'duel') camPreview(W - 54, 6, 48, 36);
      if (sc === 'duel' && S.aim) { const a = S.aim, r = 7 + Math.sin(S.t * 10); g.strokeStyle = '#ff2bd6'; g.lineWidth = 2; g.beginPath(); g.arc(a.x, a.y, r, 0, Math.PI * 2); g.stroke(); g.fillStyle = '#ff2bd6'; g.fillRect(a.x - 1, a.y - r - 4, 2, 4); g.fillRect(a.x - 1, a.y + r, 2, 4); g.fillRect(a.x - r - 4, a.y - 1, 4, 2); g.fillRect(a.x + r, a.y - 1, 4, 2); }
      if (sc === 'duel') hud(); else crash();
      return;
    }
    if (sc === 'crash') { crash(); return; }
    if (sc === 'win') {
      desktop(S.scenario.a);
      const s = Math.min(1, S.t * 1.5), fade = S.last ? Math.max(0, 1 - Math.max(0, S.t - 1) * 2) : 0;
      g.globalAlpha = fade; if (S.last) flag(g, flagOf(S.last), 160 - 60 * s, 118 - 40 * s, 120 * s, 80 * s); g.globalAlpha = 1;
      for (let i = 0; i < CONFIG.duels; i++) { g.fillStyle = i < S.duels ? '#ffe680' : 'rgba(255,255,255,.3)'; g.beginPath(); g.arc(160 - (CONFIG.duels - 1) * 6 + i * 12, 14, 3, 0, Math.PI * 2); g.fill(); }
      const st = S.last ? .9 : 0;
      if (S.t > st) {
        const c = S.scenario, kind = c.kind, t = S.t - st;
        let open = c.open; if (c.rule === 'roulette' || kind === 'roulette') { if (t < 2.2) open = [COUNTRIES[Math.floor(S.t * 12) % 9]]; }
        if (t < 1) card(kind, c.from, 120, 50, 80, 112, Math.cos((1 - t) * Math.PI), false, [c.b]);
        else { card(kind, c.from, 120, 50 + Math.round(Math.sin(t * 6) * 2), 80, 112, undefined, false, kind === 'roulette' && t < 2.2 ? open : [c.b]);
          if (t > 1.2) {   // the news strip: why these two fight
            const [title, line] = headline(c), k = Math.min(1, (t - 1.2) * 3);
            g.fillStyle = 'rgba(10,20,60,.9)'; g.fillRect(10, 168, 300 * k, 54); g.fillStyle = '#d32626'; g.fillRect(10, 168, 300 * k, 13);
            if (k >= 1) { g.textAlign = 'left'; g.fillStyle = '#fff'; g.font = 'bold 9px monospace'; g.fillText(title, 15, 178); g.fillStyle = '#ffe680'; g.font = '8px monospace'; wrap(line, 15, 192, 290, 10); }
          }
          if (t > 1.6) { flag(g, flagOf(c.a), 62, 92, 42, 28); badge(owner(c.a), 83, 132); flag(g, flagOf(c.b), 216, 92, 42, 28); badge(owner(c.b), 237, 132); } }  // the next duel
      }
      return;
    }
    if (sc === 'ending') { live(null); winScreen(); taskbar(); }
  }

  // wireframe globe, rotating, with a flag on each capital (real latitude and longitude)
  function globe(cx = 160, cy = 120, R = 86, tint = null, k = 0) {
    const rot = S.t * .35, tilt = .35;
    const proj = (lat, lon) => {
      const la = lat * Math.PI / 180, lo = lon * Math.PI / 180 + rot;
      let x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
      const y2 = y * Math.cos(tilt) - z * Math.sin(tilt), z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
      return { x: cx + x * R, y: cy - y2 * R, front: z2 > 0 };
    };
    const grad = g.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, R);
    const mix = (a, b) => { const h = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const A = h(a), B = h(b); return `rgb(${A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; };
    const c0 = '#7fd0ff', c1 = '#1f5fd0', c2 = '#0a246a';
    grad.addColorStop(0, tint ? mix(c0, '#ffffff') : c0); grad.addColorStop(.6, tint ? mix(c1, tint) : c1); grad.addColorStop(1, tint ? mix(c2, tint) : c2);
    g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(160,230,255,.55)'; g.lineWidth = 1;
    for (let lon = 0; lon < 360; lon += 20) { g.beginPath(); let on = false; for (let lat = -90; lat <= 90; lat += 6) { const p = proj(lat, lon); if (p.front) { on ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); on = true; } else on = false; } g.stroke(); }
    for (let lat = -60; lat <= 60; lat += 20) { g.beginPath(); let on = false; for (let lon = 0; lon <= 360; lon += 6) { const p = proj(lat, lon); if (p.front) { on ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); on = true; } else on = false; } g.stroke(); }
    COUNTRIES.forEach(id => { const n = NATIONS[id], p = proj(n.lat, n.lon); if (p.front) pole(p.x, p.y, S.world.conquests[id] || id, R / 78, S.t); });
    g.strokeStyle = '#0a246a'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  }

  // the only words in the game: its title
  function logo() {
    const lines = ['THE GREAT', 'THROW'], sizes = [26, 42], ys = [64, 108];
    lines.forEach((t, i) => {
      g.font = `900 ${sizes[i]}px "Arial Black", Impact, sans-serif`; g.textAlign = 'center';
      const y = ys[i] + Math.round(Math.sin(S.t * 2 + i) * 1.5);
      g.fillStyle = '#0a246a'; g.fillText(t, 163, y + 4);
      g.lineWidth = 5; g.strokeStyle = '#0a246a'; g.strokeText(t, 160, y);
      const grad = g.createLinearGradient(0, y - sizes[i] * .8, 0, y);
      grad.addColorStop(0, '#ffffff'); grad.addColorStop(.45, '#a9c8ff'); grad.addColorStop(.52, '#2f5fd0'); grad.addColorStop(1, '#e8f0ff');
      g.fillStyle = grad; g.fillText(t, 160, y);
    });
    for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#f4efe6' : '#d32626'; g.fillRect(64 + i * 12, 118, 12, 6); }
  }

  function hud() {
    const pill = (x, y, w, h) => { g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(x, y, w, h); };
    if (S.me) { pill(6, 6, 46, 20); flag(g, flagOf(S.me), 10, 9, 21, 14); badge(owner(S.me), 42, 16); }      // who is throwing
    if (Cam.on === true) {   // throw power: fill it to the top and the flag goes
      const px = W - 12, py = 60, ph = 90, f = Math.min(1, Cam.power);
      g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(px - 4, py, 8, ph);
      g.fillStyle = f >= 1 ? '#ffffff' : f > .7 ? '#ffe040' : '#7dff9a'; g.fillRect(px - 3, py + ph - f * ph, 6, f * ph);
      g.fillStyle = '#ff2bd6'; g.fillRect(px - 5, py, 10, 2);
    }
    if (S.sensShow > 0) { S.sensShow -= .02; number(CONFIG.flickSpeed.toFixed(2), W - 30, 52, '#fff'); }
    // flags left (bottom left) and points (bottom right)
    pill(6, H - 20, 50, 14);
    for (let i = 0; i < CONFIG.flags; i++) { if (i < S.left) flag(g, flagOf(S.me), 9 + i * 15, H - 17, 12, 8); else { g.fillStyle = 'rgba(255,255,255,.2)'; g.fillRect(9 + i * 15, H - 17, 12, 8); } }
    pill(W - 40, H - 20, 34, 14); number(S.influence, W - 23, H - 10);
    // ring sectors
    sectors().forEach((ok, i) => {
      const a0 = i / CONFIG.sectors * Math.PI * 2 + S.wheel, a1 = (i + 1) / CONFIG.sectors * Math.PI * 2 + S.wheel;
      g.strokeStyle = ok ? 'rgba(255,230,90,.95)' : 'rgba(255,255,255,.25)'; g.lineWidth = 3;
      g.beginPath(); g.arc(CX, CY, CONFIG.radius + 14, a0 + .06, a1 - .06); g.stroke();
    });
  }

  let prev = performance.now();
  (function loop(now) { const dt = Math.min(.05, ((now || prev) - prev) / 1000); prev = now || prev; update(dt); draw(); requestAnimationFrame(loop); })();
}

/* ============================================================
   PHONE · CONTROLLER
   ============================================================ */
function startPhone() {
  document.getElementById('stage').style.display = 'none';
  const pad = document.getElementById('pad'); pad.style.display = 'block';
  const cv = document.getElementById('padc'), g = cv.getContext('2d');
  let conn = null, connected = false, start = null, country = 0, trail = 0, player = Math.max(1, Math.min(4, Number(new URLSearchParams(location.search).get('p')) || 1)), pop = 0;
  const id = new URLSearchParams(location.search).get('id'), fromLink = new URLSearchParams(location.search).get('flag');
  if (COUNTRIES.includes(fromLink)) country = COUNTRIES.indexOf(fromLink);
  function size() { cv.width = Math.round(innerWidth * (devicePixelRatio || 1)); cv.height = Math.round(innerHeight * (devicePixelRatio || 1)); g.imageSmoothingEnabled = false; }
  size(); addEventListener('resize', size);
  const onData = d => { if (d.type === 'flag') { if (COUNTRIES.includes(d.id)) country = COUNTRIES.indexOf(d.id); if (d.player !== null && d.player !== undefined && d.player + 1 !== player) { player = d.player + 1; pop = 1; } } };
  let peer = null;
  function link() {   // connect to the laptop; try again every 3 s whenever the link is down
    try {
      if (!peer || peer.destroyed || peer.disconnected) { if (peer) peer.destroy(); peer = new Peer(); peer.on('open', open); }
      else open();
    } catch (e) {}
  }
  function open() { conn = peer.connect('greatthrow-' + id); conn.on('open', () => connected = true); conn.on('close', () => connected = false); conn.on('error', () => connected = false); conn.on('data', onData); }
  link(); setInterval(() => { if (!connected) link(); }, 3000);
  const send = d => { if (conn && connected) conn.send(d); };
  // touchpad: finger down/move = aim (shown on the laptop), finger up = throw
  let last = 0, pos = null;
  const rel = e => ({ x: Math.max(0, Math.min(1, e.clientX / innerWidth)), y: Math.max(0, Math.min(1, e.clientY / innerHeight)) });
  const aim = e => { pos = rel(e); const now = performance.now(); if (now - last > 40) { last = now; send({ type: 'aim', ...pos }); } };
  const release = e => { if (!pos) return; if (e && e.clientX !== undefined) pos = rel(e); send({ type: 'throw', ...pos }); pos = null; trail = 1; };
  cv.addEventListener('pointerdown', e => { e.preventDefault(); aim(e); });
  cv.addEventListener('pointermove', e => { if (pos) { e.preventDefault(); aim(e); } });
  cv.addEventListener('pointerup', e => { e.preventDefault(); release(e); });
  cv.addEventListener('pointercancel', () => release());
  ['touchstart', 'touchmove'].forEach(t => cv.addEventListener(t, e => e.preventDefault(), { passive: false })); // the page never scrolls
  (function draw() {
    const W = cv.width, H = cv.height;
    // pink screen (what the webcam tracks) with the flag in its real proportions, centred
    g.fillStyle = trail > 0 ? '#ffffff' : '#ff2bd6'; g.fillRect(0, 0, W, H);
    // whose turn it is: the player's number in their colour (1 pink, 2 cyan, 3 yellow, 4 green); pops when it changes
    const COL = ['#ff2bd6', '#3ad8ff', '#ffe040', '#7dff9a'], r = Math.round(Math.min(W, H) * .3 * (1 + pop * .25));
    g.fillStyle = '#fff'; g.beginPath(); g.arc(W / 2, H / 2, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = COL[player - 1]; g.beginPath(); g.arc(W / 2, H / 2, r * .86, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = `900 ${Math.round(r * 1.25)}px Impact, "Arial Black", sans-serif`;
    g.lineWidth = Math.round(r * .08); g.strokeStyle = '#0a246a'; g.strokeText(String(player), W / 2, H / 2 + r * .05); g.fillText(String(player), W / 2, H / 2 + r * .05);
    pop = Math.max(0, pop - .04);
    const dot = Math.round(W * .03); g.fillStyle = connected ? '#3c3' : '#c33'; g.fillRect(W - dot * 2, dot, dot, dot);
    trail = Math.max(0, trail - .08);
    requestAnimationFrame(draw);
  })();
}
