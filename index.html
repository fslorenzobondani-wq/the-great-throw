<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Great Throw</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; margin: auto; aspect-ratio: 4 / 3; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; border-radius: 2.5% / 3.3%; }
  #live { position: absolute; inset: -8%; width: 116%; height: 116%; border: 0; pointer-events: none; display: none;
          filter: saturate(1.5) contrast(1.2) brightness(.92); }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fx { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.7) 100%);
        box-shadow: inset 0 0 60px rgba(120,200,255,.12); z-index: 6; }
  #qr { position: absolute; right: 2%; bottom: 9%; width: 16%; background: #fff; padding: .8%; display: none; image-rendering: pixelated; z-index: 4; }
  #qr img { width: 100%; display: block; }

  #qr.pair { right: auto; bottom: auto; left: 50%; top: 50%; width: 30%; transform: translate(-50%, -46%); padding: 1.2%; }
  #pad { position: absolute; inset: 0; display: none; background: #111; }
  #pad canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="live" allow="autoplay; encrypted-media"></iframe>
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="qr"></div>
  <audio id="music" src="audio/soundtrack.mp3" loop preload="auto"></audio>
  <div id="fx"></div>
</div>
<div id="pad"><canvas id="padc"></canvas></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   THE GREAT THROW · v5
   Laptop = target screen (index.html) · Phone = controller (?role=phone&id=XXXX)
   ============================================================ */

// live: ID of a YouTube live stream of the square (the part after "watch?v=").
// Empty = fallback city synced to the capital's real time and weather.
const NATIONS = {
  italy:      { live: '', lat: 41.90, lon: 12.50,  tz: 'Europe/Rome' },
  spain:      { live: '', lat: 40.42, lon: -3.70,  tz: 'Europe/Madrid' },
  france:     { live: '', lat: 48.86, lon: 2.35,   tz: 'Europe/Paris' },
  germany:    { live: '', lat: 52.52, lon: 13.40,  tz: 'Europe/Berlin' },
  usa:        { live: '', lat: 38.89, lon: -77.03, tz: 'America/New_York' },
  russia:     { live: '', lat: 55.75, lon: 37.62,  tz: 'Europe/Moscow' },
  china:      { live: '', lat: 39.90, lon: 116.40, tz: 'Asia/Shanghai' },
  saudi:      { live: '', lat: 24.71, lon: 46.68,  tz: 'Asia/Riyadh' },
  northkorea: { live: '', lat: 39.02, lon: 125.75, tz: 'Asia/Pyongyang' },
};
const COUNTRIES = Object.keys(NATIONS);

// Beat X and these two react (see the brief)
const REACTIONS = {
  italy: ['france', 'spain'],      spain: ['italy', 'usa'],         france: ['germany', 'saudi'],
  germany: ['russia', 'china'],    usa: ['china', 'northkorea'],    russia: ['germany', 'china'],
  china: ['usa', 'northkorea'],    saudi: ['usa', 'france'],        northkorea: ['russia', 'china'],
};

const CONFIG = { flags: 7, sectors: 6, radius: 84 };

// Each nation's currency. The coin of the day = how much the currency moved against gold since yesterday.
const CURRENCY = {
  italy: 'eur', spain: 'eur', france: 'eur', germany: 'eur', usa: 'usd',
  russia: 'rub', china: 'cny', saudi: 'sar', northkorea: null, // North Korea: no free market rate → censored coin
};
const SYMBOL = { eur: '€', usd: '$', rub: '₽', cny: '¥', sar: '﷼' };
let GOLD = { eur: 0, usd: 0, rub: 0, cny: 0, sar: 0 }; // % change of gold priced in each currency (fallback: 0)

/* ============================================================
   MUSIC (audio/soundtrack.mp3 + Web Audio for a real visualiser and the tape-stop effect)
   ============================================================ */
const Music = (() => {
  const el = () => document.getElementById('music');
  let ctx = null, analyser = null, data = null, muted = false, stopping = null;
  function start() {
    const a = el(); if (!a) return;
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(a); analyser = ctx.createAnalyser(); analyser.fftSize = 64;
        src.connect(analyser); analyser.connect(ctx.destination); data = new Uint8Array(analyser.frequencyBinCount);
      }
      ctx.resume();
    } catch (e) {}
    clearInterval(stopping); a.playbackRate = 1; a.muted = muted;
    a.play().catch(() => {}); // no file yet: stay silent
  }
  // crash: the song slows down and dies, like a tape that jams
  function crash() {
    const a = el(); if (!a || a.paused) return;
    clearInterval(stopping);
    stopping = setInterval(() => { a.playbackRate = Math.max(.25, a.playbackRate - .08); if (a.playbackRate <= .25) { clearInterval(stopping); a.pause(); } }, 50);
  }
  function toggleMute() { muted = !muted; el().muted = muted; }
  // 5 bar levels (0..1) for the taskbar tray
  function levels() {
    if (!analyser || el().paused || muted) return [0, 0, 0, 0, 0];
    analyser.getByteFrequencyData(data);
    return [1, 3, 6, 10, 16].map(i => data[i] / 255);
  }
  return { start, crash, toggleMute, levels, get muted() { return muted; } };
})();

/* ============================================================
   MODEM: a synthesised dial-up connection (original sound, made with Web Audio)
   ============================================================ */
const Modem = (() => {
  let ctx = null, out = null;
  function unlock() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {} }
  function tone(f, t0, d, type, vol) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    gn.gain.setValueAtTime(vol || .08, t0); gn.gain.setValueAtTime(0, t0 + d);
    o.connect(gn); gn.connect(out); o.start(t0); o.stop(t0 + d + .02); return o;
  }
  function noise(t0, d, freq) {
    const len = Math.floor(ctx.sampleRate * d), buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), gn = ctx.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3; gn.gain.value = .12;
    src.connect(bp); bp.connect(gn); gn.connect(out); src.start(t0);
  }
  function play() {
    if (!ctx) return;
    try {
      out = ctx.createGain(); out.gain.value = .9; out.connect(ctx.destination);
      let t = ctx.currentTime + .05;
      const keys = [[697, 1209], [770, 1336], [852, 1477], [941, 1336], [697, 1336], [770, 1477], [852, 1209]];
      keys.forEach(([a, b]) => { tone(a, t, .08); tone(b, t, .08); t += .13; });             // dialling
      t += .25; tone(2100, t, .6, 'sine', .06); t += .65;                                    // answer tone
      for (let i = 0; i < 6; i++) { const o = tone(980 + i * 120, t, .14, 'square', .03); o.frequency.linearRampToValueAtTime(1650 + i * 90, t + .14); t += .16; } // handshake
      noise(t, .9, 1800); tone(1200, t, .9, 'sawtooth', .02); t += .95;
      noise(t, .6, 2400);
    } catch (e) {}
  }
  function stop() { try { if (out) { out.gain.setValueAtTime(0, ctx.currentTime); out.disconnect(); out = null; } } catch (e) {} }
  return { unlock, play, stop };
})();

const role = new URLSearchParams(location.search).get('role');
if (role === 'phone') startPhone(); else startTarget();

/* ============================================================
   FLAGS (pixel art, no text)
   ============================================================ */
function flag(g, id, x, y, w, h) {
  x = Math.round(x); y = Math.round(y); w = Math.max(3, Math.round(w)); h = Math.max(2, Math.round(h));
  const v = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x + Math.floor(i * w / c.length), y, Math.ceil(w / c.length), h); });
  const o = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x, y + Math.floor(i * h / c.length), w, Math.ceil(h / c.length)); });
  const px = (fx, fy, fw, fh, col) => { g.fillStyle = col; g.fillRect(x + Math.round(fx * w), y + Math.round(fy * h), Math.max(1, Math.round(fw * w)), Math.max(1, Math.round(fh * h))); };
  switch (id) {
    case 'italy': v(['#009246', '#f1f2f1', '#ce2b37']); break;
    case 'france': v(['#0055a4', '#f1f2f1', '#ef4135']); break;
    case 'germany': o(['#111', '#dd0000', '#ffce00']); break;
    case 'russia': o(['#f1f2f1', '#0039a6', '#d52b1e']); break;
    case 'spain': o(['#aa151b', '#f1bf00', '#f1bf00', '#aa151b']); break;
    case 'usa':
      for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? '#f1f2f1' : '#b22234'; g.fillRect(x, y + Math.floor(i * h / 7), w, Math.ceil(h / 7)); }
      px(0, 0, .42, .55, '#3c3b6e'); break;
    case 'china': g.fillStyle = '#de2910'; g.fillRect(x, y, w, h); px(.1, .15, .16, .24, '#ffde00'); break;
    case 'saudi': g.fillStyle = '#006c35'; g.fillRect(x, y, w, h); px(.2, .62, .6, .08, '#f1f2f1'); px(.25, .3, .5, .12, '#f1f2f1'); break;
    case 'northkorea': o(['#024fa2', '#f1f2f1', '#be0000', '#be0000', '#f1f2f1', '#024fa2']); px(.22, .3, .2, .4, '#f1f2f1'); px(.26, .37, .12, .26, '#be0000'); break;
  }
}

/* ============================================================
   LAPTOP · TARGET SCREEN
   ============================================================ */
function startTarget() {
  const cv = document.getElementById('screen'), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const W = 320, H = 240, CX = 160, CY = 116;
  const WIN = { x: 44, y: 8, w: 232, h: 212 };

  const S = {
    scene: 'off', t: 0, sel: 0, me: null, rival: null, loaded: 0, dataDone: 0,
    wheel: 0, speed: .7, flights: [], planted: [], left: 0, influence: 0,
    crash: null, weather: {}, phone: false, world: load(),
  };
  function load() { try { return JSON.parse(localStorage.getItem('gt-world')) || { conquests: {}, reacting: [] }; } catch (e) { return { conquests: {}, reacting: [] }; } }
  function save() { try { localStorage.setItem('gt-world', JSON.stringify(S.world)); } catch (e) {} }

  // --- sprites + collision masks
  const SPR = {};
  COUNTRIES.forEach(id => {
    const im = new Image(); SPR[id] = { im, ok: false, mask: null };
    im.onerror = () => S.loaded++;
    im.onload = () => {
      SPR[id].ok = true; S.loaded++;
      try { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const cg = c.getContext('2d'); cg.drawImage(im, 0, 0); SPR[id].mask = cg.getImageData(0, 0, im.width, im.height); }
      catch (e) { SPR[id].mask = null; } // opened as a local file: approximate collision
    };
    im.src = 'img/' + id + '.png';
  });

  // --- real-world data
  // gold today vs yesterday, priced in every currency (free currency-api on jsDelivr, no key)
  const iso = d => d.toISOString().slice(0, 10);
  const goldOn = date => fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/xau.json`).then(r => r.json()).then(d => d.xau);
  Promise.all([goldOn('latest'), goldOn(iso(new Date(Date.now() - 2 * 864e5)))]).then(([now, before]) => {
    Object.keys(GOLD).forEach(c => { if (now[c] && before[c]) GOLD[c] = (now[c] / before[c] - 1) * 100; });
  }).catch(() => {}).finally(() => S.dataDone++);
  { const a = document.getElementById('music'); let once = false; const ok = () => { if (!once) { once = true; S.loaded++; } }; a.addEventListener('canplaythrough', ok); a.addEventListener('error', ok); setTimeout(ok, 4000); }
  COUNTRIES.forEach(id => {
    const n = NATIONS[id];
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${n.lat}&longitude=${n.lon}&current=cloud_cover,precipitation`)
      .then(r => r.json()).then(d => { if (d.current) S.weather[id] = { clouds: d.current.cloud_cover, rain: d.current.precipitation }; }).catch(() => {}).finally(() => S.dataDone++);
  });
  // strength of a coin: if gold got more expensive in your currency, your coin got weaker
  const strength = id => CURRENCY[id] ? -GOLD[CURRENCY[id]] : null;
  // who gets the advantage: the weaker coin; same currency → toss a coin
  function decide() {
    const a = strength(S.me), b = strength(S.rival);
    S.toss = a !== null && b !== null && CURRENCY[S.me] === CURRENCY[S.rival];
    S.meFirst = S.toss ? Math.random() < .5 : (b === null ? true : (a === null ? false : a <= b));
  }
  const clock = (id, withMinutes) => {
    const f = new Intl.DateTimeFormat('en-GB', { timeZone: NATIONS[id].tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    return withMinutes ? f : Number(f.slice(0, 2)) % 24;
  };

  // --- live camera of the square
  let currentLive = null;
  function live(id) {
    const f = document.getElementById('live'), v = id && NATIONS[id].live;
    if (v === currentLive) return; currentLive = v;
    if (v) { f.src = `https://www.youtube.com/embed/${v}?autoplay=1&mute=1&controls=0&playsinline=1&loop=1`; f.style.display = 'block'; }
    else { f.src = 'about:blank'; f.style.display = 'none'; }
  }

  // --- phone controller (PeerJS)
  const code = String(Math.floor(1000 + Math.random() * 9000));
  try {
    const peer = new Peer('greatthrow-' + code);
    peer.on('open', () => {
      const url = location.origin + location.pathname + '?role=phone&id=' + code;
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      document.getElementById('qr').innerHTML = qr.createImgTag(4, 0); updateQR(); console.log('Phone:', url);
    });
    peer.on('connection', conn => {
      S.conn = conn;
      conn.on('open', () => { S.phone = true; updateQR(); sendFlag(); if (S.scene === 'pair') coins(); });
      conn.on('data', d => {
        if (d.type === 'tap') press();
        if (d.type === 'throw' && S.scene === 'duel') throwFlag(CX + d.ax * 100, CY + 95 - d.ay * 190);
        if (d.type === 'pick') move(d.dir);
      });
      conn.on('close', () => { S.phone = false; S.conn = null; updateQR(); });
    });
  } catch (e) { console.warn('PeerJS unavailable: single-player mode'); }
  function sendFlag() { try { if (S.conn && S.phone && S.me) S.conn.send({ type: 'flag', id: S.me }); } catch (e) {} }
  function updateQR() { const b = document.getElementById('qr'); const on = S.scene === 'pair' && !S.phone && b.innerHTML; b.style.display = on ? 'block' : 'none'; b.classList.toggle('pair', !!on); }

  // --- laptop input
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  cv.addEventListener('pointerdown', e => {
    const p = pos(e);
    if (p.y > 226 && p.x > 252 && p.x < 280) return Music.toggleMute();
    if (S.scene === 'duel') return throwFlag(p.x, p.y);
    if (S.scene === 'pickMe' || S.scene === 'pickRival') {
      const i = Math.floor((p.x - 8) / 34);
      if (i >= 0 && i < 9 && p.y > 60 && p.y < 200) { if (i === S.sel) press(); else S.sel = i; return; }
    }
    press();
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'Enter' || e.key === ' ') press();
  });
  function move(d) { if (S.scene === 'pickMe' || S.scene === 'pickRival') S.sel = (S.sel + d + 9) % 9; }

  function go(sc) { S.scene = sc; S.t = 0; updateQR(); if (sc === 'crash') Music.crash(); }
  function press() {
    const sc = S.scene;
    if (sc === 'off') { Modem.unlock(); go('splash'); }
    else if (sc === 'splash' || sc === 'dial') { Modem.stop(); Music.start(); go('title'); } // skip the intro
    else if (sc === 'title') { Music.start(); S.sel = 0; go('pickMe'); }
    else if (sc === 'pickMe') { S.me = COUNTRIES[S.sel]; S.sel = S.world.reacting.length ? COUNTRIES.indexOf(S.world.reacting[0]) : 0; go('pickRival'); }
    else if (sc === 'pickRival') { if (COUNTRIES[S.sel] === S.me) return; S.rival = COUNTRIES[S.sel]; S.phone ? coins() : go('pair'); sendFlag(); }
    else if (sc === 'pair') coins(); // no phone: play solo with the mouse
    else if (sc === 'coins' && S.t > 2.2) duel();
    else if (sc === 'crash' && S.t > 1.2) duel();
    else if (sc === 'win' && S.t > 1.2) go(Object.keys(S.world.conquests).length >= 8 ? 'ending' : 'pickRival');
    else if (sc === 'ending' && S.t > 2) { S.world = { conquests: {}, reacting: [] }; save(); go('title'); }
  }

  function coins() { decide(); go('coins'); }

  function duel() {
    go('duel'); Music.start();
    S.flights = []; S.planted = []; S.left = CONFIG.flags; S.influence = 0; S.wheel = 0;
    // the weaker coin gets the advantage: the wheel starts still
    S.hold = S.meFirst ? 1.5 : 0;
  }

  // --- throwing
  function throwFlag(tx, ty) {
    if (S.left <= 0) return;
    S.left--;
    S.flights.push({ tx: tx + (Math.random() - .5) * 5, ty: ty + (Math.random() - .5) * 5, t: 0 });
  }
  const leaderScale = () => { const s = SPR[S.rival]; return s && s.ok ? 118 / s.im.height : 1; };
  function toWheel(x, y) { const dx = x - CX, dy = y - CY, c = Math.cos(-S.wheel), s = Math.sin(-S.wheel); return { x: dx * c - dy * s, y: dx * s + dy * c }; }
  function toScreen(l) { const c = Math.cos(S.wheel), s = Math.sin(S.wheel); return { x: CX + l.x * c - l.y * s, y: CY + l.x * s + l.y * c }; }
  function hitsLeader(l) {
    const sp = SPR[S.rival]; if (!sp || !sp.ok) return Math.abs(l.x) < 25 && Math.abs(l.y) < 55;
    const k = leaderScale(), sx = Math.floor(l.x / k + sp.im.width / 2), sy = Math.floor(l.y / k + sp.im.height / 2);
    if (sx < 0 || sy < 0 || sx >= sp.im.width || sy >= sp.im.height) return false;
    if (!sp.mask) return true;
    // 2-pixel margin: grazing is skill, touching is a mistake
    for (let oy = -2; oy <= 2; oy += 2) for (let ox = -2; ox <= 2; ox += 2) {
      const xx = sx + Math.round(ox / k), yy = sy + Math.round(oy / k);
      if (xx >= 0 && yy >= 0 && xx < sp.im.width && yy < sp.im.height && sp.mask.data[(yy * sp.im.width + xx) * 4 + 3] > 40) return true;
    }
    return false;
  }
  function sectors() {
    const cov = new Array(CONFIG.sectors).fill(false);
    S.planted.forEach(p => { const a = (Math.atan2(p.l.y, p.l.x) + Math.PI * 2) % (Math.PI * 2); cov[Math.floor(a / (Math.PI * 2) * CONFIG.sectors)] = true; });
    return cov;
  }

  function update(dt) {
    S.t += dt;
    const sc = S.scene, prog = S.loaded / 10;
    if (sc === 'splash' && ((S.t > 2.2 && prog >= 1) || S.t > 6)) { Modem.play(); go('dial'); }
    else if (sc === 'dial' && ((S.t > 3 && S.dataDone >= 10) || S.t > 7)) { Modem.stop(); Music.start(); go('title'); }
    if (S.scene !== 'duel') return;
    if (S.hold > 0) S.hold -= dt;
    else { S.speed = .55 + Math.sin(S.t * .45) * .9; S.wheel += S.speed * dt; }
    for (const f of S.flights) {
      f.t += dt / .42;
      if (f.t < 1 || f.done) continue;
      f.done = true;
      const l = toWheel(f.tx, f.ty);
      if (hitsLeader(l)) {
        S.crash = { x: f.tx, y: f.ty, cracks: Array.from({ length: 14 }, () => ({ a: Math.random() * Math.PI * 2, r: 30 + Math.random() * 140, k: Math.random() })) };
        go('crash'); return;
      }
      const d = Math.hypot(l.x, l.y);
      if (d <= CONFIG.radius) { S.planted.push({ l, t: 0 }); S.influence += Math.max(0, Math.round(100 - d)); }
    }
    S.flights = S.flights.filter(f => !f.done);
    S.planted.forEach(p => p.t += dt);
    if (sectors().every(Boolean)) {
      S.world.conquests[S.rival] = S.me;
      S.world.reacting = REACTIONS[S.rival].filter(id => !S.world.conquests[id] && id !== S.me);
      save(); go('win');
    } else if (S.left === 0 && !S.flights.length) { S.crash = null; go('crash'); }
  }

  /* ---------------- drawing ---------------- */
  function background(id) {
    live(id);
    if (id && NATIONS[id].live) { g.clearRect(0, 0, W, H); return; }
    const h = clock(id || 'italy'), m = S.weather[id] || { clouds: 30, rain: 0 };
    const day = h >= 7 && h < 18, dusk = (h >= 17 && h < 20) || (h >= 6 && h < 8);
    const a = day ? [70, 130, 220] : dusk ? [210, 110, 90] : [12, 16, 48], b = day ? [170, 210, 240] : dusk ? [245, 180, 110] : [40, 32, 80];
    for (let y = 0; y < H; y += 3) { const k = y / H, d = ((y / 3) % 2) * .04; g.fillStyle = `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * Math.min(1, k + d))).join(',')})`; g.fillRect(0, y, W, 3); }
    g.fillStyle = day ? 'rgba(245,245,255,.85)' : 'rgba(90,90,120,.85)';
    for (let i = 0; i < Math.round(m.clouds / 12); i++) { const x = (i * 83 + S.t * 3) % (W + 80) - 40, y = 14 + (i * 29) % 70; g.fillRect(Math.round(x), y, 40, 9); g.fillRect(Math.round(x) + 10, y - 6, 22, 7); }
    // generic low-poly city
    g.fillStyle = day ? '#6d7f8f' : '#1c1a2e';

  function wheel() {

  }

  function pole(x, y, id, scale, t) {

  function number(n, x, y, col) { g.fillStyle = col || '#ffe680'; g.font = '8px monospace'; g.textAlign = 'center'; g.fillText(String(n), x, y); }

  // a big PS1-style coin: size follows today's move against gold
  function coin(x, y, id, r, lit, spin) {

    g.fillStyle = lit && Math.floor(S.t * 4) % 2 ? '#fff3a0' : '#c99a2e'; g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();

    g.restore();
  }

  function groupShot(rivalPick) {

    for (let y = 0; y < 226; y += 2) { const k = y / 226; g.fillStyle = `rgb(${Math.round(90 + 90 * k)},${Math.round(200 - 120 * k)},${Math.round(230 - 30 * k)})`; g.fillRect(0, y, W, 2); }
    g.fillStyle = '#7b2f6e'; g.beginPath(); g.moveTo(4, 150); g.lineTo(316, 150); g.lineTo(306, 186); g.lineTo(14, 186); g.fill();
    g.fillStyle = '#9a3f8a'; g.fillRect(10, 122, 300, 30);
    COUNTRIES.forEach((id, i) => {
      const sp = SPR[id], x = 8 + i * 34 + 17, sel = i === S.sel, cq = S.world.conquests[id];
      const h = sel ? 84 : 70, y = 170 - h + (sel ? Math.round(Math.sin(S.t * 8) * 2) : 0);
      const dim = rivalPick && id === S.me;

      if (rivalPick && S.world.reacting.includes(id) && Math.floor(S.t * 3) % 2) { g.strokeStyle = '#3a7bf0'; g.lineWidth = 2; g.strokeRect(x - 16, y - 3, 32, h + 6); }
      if (sp.ok) { const k = h / sp.im.height; g.globalAlpha = dim ? .3 : 1; g.drawImage(sp.im, x - sp.im.width * k / 2, y, sp.im.width * k, h); g.globalAlpha = 1; }
      flag(g, id, x - 7, 192, 14, 9);

  function crash() {
    if (S.crash && S.t < .7) {
      // the glass cracks
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
      S.crash.cracks.forEach(c => { const r = c.r * Math.min(1, S.t * 3); g.beginPath(); g.moveTo(S.crash.x, S.crash.y); g.lineTo(S.crash.x + Math.cos(c.a) * r * .5 + c.k * 6, S.crash.y + Math.sin(c.a) * r * .5); g.lineTo(S.crash.x + Math.cos(c.a) * r, S.crash.y + Math.sin(c.a) * r); g.stroke(); });

    number('0x' + (S.rival || '').length.toString(16).padStart(8, '0').toUpperCase(), 160, 180, '#fff');
    if (S.me) flag(g, S.me, 140, 196, 18, 12);

  function draw() {

      g.beginPath(); g.arc(160, 122, 22, -Math.PI / 2 + .6, Math.PI * 1.5 - .6); g.stroke();
      g.fillStyle = g.strokeStyle; g.fillRect(158, 92, 4, 28);

    }

      g.fillStyle = '#05103a'; g.fillRect(0, 0, W, H);

        pc(40); pc(258);
        for (let i = 0; i < 12; i++) if ((Math.floor(S.t * 10) - i) % 4 === 0) { g.fillStyle = '#ffe680'; g.fillRect(70 + i * 15, 194, 4, 3); }

      // phone icon showing your flag, with the pink tracking frame

      g.fillStyle = '#222'; g.fillRect(px, py, 30, 54); g.fillStyle = '#ff2bd6'; g.fillRect(px + 2, py + 4, 26, 44);
      flag(g, S.me, px + 5, py + 9, 20, 34);

      return;
    }
    if (sc === 'pickMe' || sc === 'pickRival') {

      else if (S.me) { flag(g, S.me, 120, 22, 28, 19); g.fillStyle = '#fff'; g.fillRect(156, 30, 8, 3); flag(g, COUNTRIES[S.sel], 172, 22, 28, 19); }
      return;
    }
    if (sc === 'coins') {
      desktop(S.rival); windowFrame(WIN.x, WIN.y, WIN.w, WIN.h, S.rival);
      g.fillStyle = 'rgba(10,20,60,.8)'; g.fillRect(WIN.x + 2, WIN.y + 12, WIN.w - 4, WIN.h - 14);
      flag(g, S.me, 95, 40, 30, 20); flag(g, S.rival, 195, 40, 30, 20);
      if (S.toss) {

        if (up >= 1) { g.fillStyle = '#ffe680'; g.fillRect(S.meFirst ? 93 : 193, 38, 34, 24); flag(g, S.meFirst ? S.me : S.rival, S.meFirst ? 95 : 195, 40, 30, 20); }
      } else {
        const a = strength(S.me), b = strength(S.rival), size = v => v === null ? 30 : Math.max(18, Math.min(42, 30 + v * 12 * Math.min(1, S.t)));
        coin(110, 120, S.me, size(a), S.meFirst); coin(210, 120, S.rival, size(b), !S.meFirst);
        if (a !== null) number((a >= 0 ? '+' : '') + a.toFixed(2) + '%', 110, 172); if (b !== null) number((b >= 0 ? '+' : '') + b.toFixed(2) + '%', 210, 172);
      }

    }

      wheel();
      S.planted.forEach(p => { const s = toScreen(p.l); pole(s.x, s.y, S.me, 1, p.t); });
      S.flights.forEach(f => { const t = Math.min(1, f.t), x = CX + (f.tx - CX) * t, y = 250 + (f.ty - 250) * t - Math.sin(t * Math.PI) * 40; pole(x, y, S.me, 2.2 - t * 1.2, S.t); });
      if (sc === 'duel') hud(); else crash();

    }

  }

  // wireframe globe, rotating, with a flag on each capital (real latitude and longitude)
  function globe() {
    const R = 86, cx = 160, cy = 120, rot = S.t * .35, tilt = .35;
    const proj = (lat, lon) => {
      const la = lat * Math.PI / 180, lo = lon * Math.PI / 180 + rot;
      let x = Math.cos(la) * Math.sin(lo), y = Math.sin(la), z = Math.cos(la) * Math.cos(lo);
      const y2 = y * Math.cos(tilt) - z * Math.sin(tilt), z2 = y * Math.sin(tilt) + z * Math.cos(tilt);
      return { x: cx + x * R, y: cy - y2 * R, front: z2 > 0 };
    };
    const grad = g.createRadialGradient(cx - 30, cy - 30, 10, cx, cy, R);
    grad.addColorStop(0, '#7fd0ff'); grad.addColorStop(.6, '#1f5fd0'); grad.addColorStop(1, '#0a246a');
    g.fillStyle = grad; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.fill();
    g.strokeStyle = 'rgba(160,230,255,.55)'; g.lineWidth = 1;
    for (let lon = 0; lon < 360; lon += 20) { g.beginPath(); let on = false; for (let lat = -90; lat <= 90; lat += 6) { const p = proj(lat, lon); if (p.front) { on ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); on = true; } else on = false; } g.stroke(); }
    for (let lat = -60; lat <= 60; lat += 20) { g.beginPath(); let on = false; for (let lon = 0; lon <= 360; lon += 6) { const p = proj(lat, lon); if (p.front) { on ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); on = true; } else on = false; } g.stroke(); }
    COUNTRIES.forEach(id => { const n = NATIONS[id], p = proj(n.lat, n.lon); if (p.front) pole(p.x, p.y, S.world.conquests[id] || id, 1.1, S.t); });
    g.strokeStyle = '#0a246a'; g.lineWidth = 2; g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
  }

  // the only words in the game: its title
  function logo() {
    const lines = ['THE GREAT', 'THROW'], sizes = [26, 42], ys = [64, 108];
    lines.forEach((t, i) => {
      g.font = `900 ${sizes[i]}px "Arial Black", Impact, sans-serif`; g.textAlign = 'center';
      const y = ys[i] + Math.round(Math.sin(S.t * 2 + i) * 1.5);
      g.fillStyle = '#0a246a'; g.fillText(t, 163, y + 4);
      g.lineWidth = 5; g.strokeStyle = '#0a246a'; g.strokeText(t, 160, y);
      const grad = g.createLinearGradient(0, y - sizes[i] * .8, 0, y);
      grad.addColorStop(0, '#ffffff'); grad.addColorStop(.45, '#a9c8ff'); grad.addColorStop(.52, '#2f5fd0'); grad.addColorStop(1, '#e8f0ff');
      g.fillStyle = grad; g.fillText(t, 160, y);
    });
    for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#f4efe6' : '#d32626'; g.fillRect(64 + i * 12, 118, 12, 6); }
  }

  function hud() {
    // flags left (bottom of the window)
    for (let i = 0; i < CONFIG.flags; i++) { if (i < S.left) flag(g, S.me, WIN.x + 6 + i * 15, WIN.y + WIN.h - 14, 12, 8); else { g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(WIN.x + 6 + i * 15, WIN.y + WIN.h - 14, 12, 8); } }
    // ring sectors
    sectors().forEach((ok, i) => {
      const a0 = i / CONFIG.sectors * Math.PI * 2 + S.wheel, a1 = (i + 1) / CONFIG.sectors * Math.PI * 2 + S.wheel;
      g.strokeStyle = ok ? 'rgba(255,230,90,.95)' : 'rgba(255,255,255,.25)'; g.lineWidth = 3;
      g.beginPath(); g.arc(CX, CY, CONFIG.radius + 14, a0 + .06, a1 - .06); g.stroke();
    });
    number(S.influence, WIN.x + WIN.w - 20, WIN.y + WIN.h - 7);
  }

  let prev = performance.now();
  (function loop(now) { const dt = Math.min(.05, ((now || prev) - prev) / 1000); prev = now || prev; update(dt); draw(); requestAnimationFrame(loop); })();
}

/* ============================================================
   PHONE · CONTROLLER
   ============================================================ */
function startPhone() {
  document.getElementById('stage').style.display = 'none';
  const pad = document.getElementById('pad'); pad.style.display = 'block';
  const cv = document.getElementById('padc'), g = cv.getContext('2d');
  let conn = null, connected = false, start = null, country = 0, trail = 0;
  const id = new URLSearchParams(location.search).get('id');
  function size() { cv.width = 160; cv.height = Math.round(160 * innerHeight / innerWidth); g.imageSmoothingEnabled = false; }
  size(); addEventListener('resize', size);
  try { const peer = new Peer(); peer.on('open', () => { conn = peer.connect('greatthrow-' + id); conn.on('open', () => connected = true); conn.on('close', () => connected = false); conn.on('data', d => { if (d.type === 'flag' && COUNTRIES.includes(d.id)) country = COUNTRIES.indexOf(d.id); }); }); } catch (e) {}
  const send = d => { if (conn && connected) conn.send(d); };
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; start = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchend', e => {
    if (!start) return;
    const t = e.changedTouches[0], dx = t.clientX - start.x, dy = t.clientY - start.y;
    if (dy < -40) { send({ type: 'throw', ax: Math.max(-1, Math.min(1, dx / (innerWidth * .5))), ay: Math.max(0, Math.min(1, -dy / (innerHeight * .75))) }); trail = 1; }
    else if (Math.abs(dx) > 40) { const dir = dx > 0 ? 1 : -1; country = (country + dir + 9) % 9; send({ type: 'pick', dir }); }
    else send({ type: 'tap' });
    start = null;
  });
  (function draw() {
    const W = cv.width, H = cv.height;
    // full-screen flag inside a thick pink frame: the laptop webcam will track the frame
    g.fillStyle = trail > 0 ? '#ffffff' : '#ff2bd6'; g.fillRect(0, 0, W, H);
    const m = Math.round(W * .1); g.fillStyle = '#000'; g.fillRect(m - 1, m - 1, W - 2 * m + 2, H - 2 * m + 2);
    flag(g, COUNTRIES[country], m, m, W - 2 * m, H - 2 * m);
    g.fillStyle = connected ? '#3c3' : '#c33'; g.fillRect(W - 9, 3, 5, 5);
    trail = Math.max(0, trail - .08);
    requestAnimationFrame(draw);
  })();
}

</script>
