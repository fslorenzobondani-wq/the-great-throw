<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>The Great Throw</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; margin: auto; aspect-ratio: 4 / 3; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; border-radius: 2.5% / 3.3%; }
  #live { position: absolute; inset: -8%; width: 116%; height: 116%; border: 0; pointer-events: none; display: none;
          filter: saturate(1.5) contrast(1.2) brightness(.92); }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fx { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.7) 100%);
        box-shadow: inset 0 0 60px rgba(120,200,255,.12); z-index: 6; }
  #qr { position: absolute; right: 2%; bottom: 9%; width: 16%; background: #fff; padding: .8%; display: none; image-rendering: pixelated; z-index: 4; }
  #qr img { width: 100%; display: block; }

  #qr.pair { right: auto; bottom: auto; left: 33%; top: 47%; width: 26%; transform: translate(-50%, -50%); padding: 1.2%; }
  #pad { position: absolute; inset: 0; display: none; background: #111; }
  #pad canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="live" allow="autoplay; encrypted-media"></iframe>
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="qr"></div>
  <audio id="music" src="audio/soundtrack.mp3" loop preload="auto"></audio>
  <div id="fx"></div>
</div>
<div id="pad"><canvas id="padc"></canvas></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   THE GREAT THROW · v5
   Laptop = target screen (index.html) · Phone = controller (?role=phone&id=XXXX)
   ============================================================ */

// live: ID of a YouTube live stream of the square (the part after "watch?v=").
// Empty = fallback city synced to the capital's real time and weather.
const NATIONS = {
  italy:      { live: '', lat: 41.90, lon: 12.50,  tz: 'Europe/Rome' },
  spain:      { live: '', lat: 40.42, lon: -3.70,  tz: 'Europe/Madrid' },
  france:     { live: '', lat: 48.86, lon: 2.35,   tz: 'Europe/Paris' },
  germany:    { live: '', lat: 52.52, lon: 13.40,  tz: 'Europe/Berlin' },
  usa:        { live: '', lat: 38.89, lon: -77.03, tz: 'America/New_York' },
  russia:     { live: '', lat: 55.75, lon: 37.62,  tz: 'Europe/Moscow' },
  china:      { live: '', lat: 39.90, lon: 116.40, tz: 'Asia/Shanghai' },
  saudi:      { live: '', lat: 24.71, lon: 46.68,  tz: 'Asia/Riyadh' },
  northkorea: { live: '', lat: 39.02, lon: 125.75, tz: 'Asia/Pyongyang' },
};
const COUNTRIES = Object.keys(NATIONS);

// Beat X and these two react (see the brief)
const REACTIONS = {
  italy: ['france', 'spain'],      spain: ['italy', 'usa'],         france: ['germany', 'saudi'],
  germany: ['russia', 'china'],    usa: ['china', 'northkorea'],    russia: ['germany', 'china'],
  china: ['usa', 'northkorea'],    saudi: ['usa', 'france'],        northkorea: ['russia', 'china'],
};

const CONFIG = { flags: 7, sectors: 6, radius: 84, camMinPixels: 10, flickSpeed: 2.6 }; // flickSpeed: screen-widths per second

// Each nation's currency. The coin of the day = how much the currency moved against gold since yesterday.
const CURRENCY = {
  italy: 'eur', spain: 'eur', france: 'eur', germany: 'eur', usa: 'usd',
  russia: 'rub', china: 'cny', saudi: 'sar', northkorea: null, // North Korea: no free market rate → censored coin
};
const SYMBOL = { eur: '€', usd: '$', rub: '₽', cny: '¥', sar: '﷼' };
let GOLD = { eur: 0, usd: 0, rub: 0, cny: 0, sar: 0 }; // % change of gold priced in each currency (fallback: 0)

/* ============================================================
   MUSIC (audio/soundtrack.mp3 + Web Audio for a real visualiser and the tape-stop effect)
   ============================================================ */
const Music = (() => {
  const el = () => document.getElementById('music');
  let ctx = null, analyser = null, data = null, muted = false, stopping = null;
  function start() {
    const a = el(); if (!a) return;
    try {
      if (!ctx) {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaElementSource(a); analyser = ctx.createAnalyser(); analyser.fftSize = 64;
        src.connect(analyser); analyser.connect(ctx.destination); data = new Uint8Array(analyser.frequencyBinCount);
      }
      ctx.resume();
    } catch (e) {}
    clearInterval(stopping); a.playbackRate = 1; a.muted = muted;
    a.play().catch(() => {}); // no file yet: stay silent
  }
  // crash: the song slows down and dies, like a tape that jams
  function crash() {
    const a = el(); if (!a || a.paused) return;
    clearInterval(stopping);
    stopping = setInterval(() => { a.playbackRate = Math.max(.25, a.playbackRate - .08); if (a.playbackRate <= .25) { clearInterval(stopping); a.pause(); } }, 50);
  }
  function toggleMute() { muted = !muted; el().muted = muted; }
  // 5 bar levels (0..1) for the taskbar tray
  function levels() {
    if (!analyser || el().paused || muted) return [0, 0, 0, 0, 0];
    analyser.getByteFrequencyData(data);
    return [1, 3, 6, 10, 16].map(i => data[i] / 255);
  }
  return { start, crash, toggleMute, levels, get muted() { return muted; } };
})();

/* ============================================================
   MODEM: a synthesised dial-up connection (original sound, made with Web Audio)
   ============================================================ */
const Modem = (() => {
  let ctx = null, out = null;
  function unlock() { try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {} }
  function tone(f, t0, d, type, vol) {
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
    gn.gain.setValueAtTime(vol || .08, t0); gn.gain.setValueAtTime(0, t0 + d);
    o.connect(gn); gn.connect(out); o.start(t0); o.stop(t0 + d + .02); return o;
  }
  function noise(t0, d, freq) {
    const len = Math.floor(ctx.sampleRate * d), buf = ctx.createBuffer(1, len, ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), gn = ctx.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 3; gn.gain.value = .12;
    src.connect(bp); bp.connect(gn); gn.connect(out); src.start(t0);
  }
  function play() {
    if (!ctx) return;
    try {
      out = ctx.createGain(); out.gain.value = .9; out.connect(ctx.destination);
      let t = ctx.currentTime + .05;
      const keys = [[697, 1209], [770, 1336], [852, 1477], [941, 1336], [697, 1336], [770, 1477], [852, 1209]];
      keys.forEach(([a, b]) => { tone(a, t, .08); tone(b, t, .08); t += .13; });             // dialling
      t += .25; tone(2100, t, .6, 'sine', .06); t += .65;                                    // answer tone
      for (let i = 0; i < 6; i++) { const o = tone(980 + i * 120, t, .14, 'square', .03); o.frequency.linearRampToValueAtTime(1650 + i * 90, t + .14); t += .16; } // handshake
      noise(t, .9, 1800); tone(1200, t, .9, 'sawtooth', .02); t += .95;
      noise(t, .6, 2400);
    } catch (e) {}
  }
  function stop() { try { if (out) { out.gain.setValueAtTime(0, ctx.currentTime); out.disconnect(); out = null; } } catch (e) {} }
  return { unlock, play, stop };
})();

const role = new URLSearchParams(location.search).get('role');
if (role === 'phone') startPhone(); else startTarget();

/* ============================================================
   FLAGS (pixel art, no text)
   ============================================================ */
function flag(g, id, x, y, w, h) {
  x = Math.round(x); y = Math.round(y); w = Math.max(3, Math.round(w)); h = Math.max(2, Math.round(h));
  const v = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x + Math.floor(i * w / c.length), y, Math.ceil(w / c.length), h); });
  const o = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x, y + Math.floor(i * h / c.length), w, Math.ceil(h / c.length)); });
  const px = (fx, fy, fw, fh, col) => { g.fillStyle = col; g.fillRect(x + Math.round(fx * w), y + Math.round(fy * h), Math.max(1, Math.round(fw * w)), Math.max(1, Math.round(fh * h))); };
  switch (id) {
    case 'italy': v(['#009246', '#f1f2f1', '#ce2b37']); break;
    case 'france': v(['#0055a4', '#f1f2f1', '#ef4135']); break;
    case 'germany': o(['#111', '#dd0000', '#ffce00']); break;
    case 'russia': o(['#f1f2f1', '#0039a6', '#d52b1e']); break;
    case 'spain': o(['#aa151b', '#f1bf00', '#f1bf00', '#aa151b']); break;
    case 'usa':
      for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? '#f1f2f1' : '#b22234'; g.fillRect(x, y + Math.floor(i * h / 7), w, Math.ceil(h / 7)); }
      px(0, 0, .42, .55, '#3c3b6e'); break;
    case 'china': g.fillStyle = '#de2910'; g.fillRect(x, y, w, h); px(.1, .15, .16, .24, '#ffde00'); break;
    case 'saudi': g.fillStyle = '#006c35'; g.fillRect(x, y, w, h); px(.2, .62, .6, .08, '#f1f2f1'); px(.25, .3, .5, .12, '#f1f2f1'); break;
    case 'northkorea': o(['#024fa2', '#f1f2f1', '#be0000', '#be0000', '#f1f2f1', '#024fa2']); px(.22, .3, .2, .4, '#f1f2f1'); px(.26, .37, .12, .26, '#be0000'); break;
  }
}

/* ============================================================
   LAPTOP · TARGET SCREEN
   ============================================================ */
function startTarget() {
  const cv = document.getElementById('screen'), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const W = 320, H = 240, CX = 160, CY = 116;
  const WIN = { x: 44, y: 8, w: 232, h: 212 };

  const S = {
    scene: 'off', t: 0, sel: 0, me: null, rival: null, loaded: 0, dataDone: 0,
    wheel: 0, speed: .7, flights: [], planted: [], left: 0, influence: 0,
    crash: null, weather: {}, phone: false, world: load(),
  };
  window.GT = S; // game state, handy in the browser console for testing
  function load() { try { return JSON.parse(localStorage.getItem('gt-world')) || { conquests: {}, open: [], cards: [] }; } catch (e) { return { conquests: {}, open: [], cards: [] }; } }
  function save() { try { localStorage.setItem('gt-world', JSON.stringify(S.world)); } catch (e) {} }

  // --- sprites + collision masks
  const SPR = {};
  COUNTRIES.forEach(id => {
    const im = new Image(); SPR[id] = { im, ok: false, mask: null };
    im.onerror = () => S.loaded++;
    im.onload = () => {
      SPR[id].ok = true; S.loaded++;
      try { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const cg = c.getContext('2d'); cg.drawImage(im, 0, 0); SPR[id].mask = cg.getImageData(0, 0, im.width, im.height); }
      catch (e) { SPR[id].mask = null; } // opened as a local file: approximate collision
    };
    im.src = 'img/' + id + '.png';
  });

  // --- real-world data
  // gold today vs yesterday, priced in every currency (free currency-api on jsDelivr, no key)
  const iso = d => d.toISOString().slice(0, 10);
  const goldOn = date => fetch(`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/xau.json`).then(r => r.json()).then(d => d.xau);
  Promise.all([goldOn('latest'), goldOn(iso(new Date(Date.now() - 2 * 864e5)))]).then(([now, before]) => {
    Object.keys(GOLD).forEach(c => { if (now[c] && before[c]) GOLD[c] = (now[c] / before[c] - 1) * 100; });
  }).catch(() => {}).finally(() => S.dataDone++);
  { const a = document.getElementById('music'); let once = false; const ok = () => { if (!once) { once = true; S.loaded++; } }; a.addEventListener('canplaythrough', ok); a.addEventListener('error', ok); setTimeout(ok, 4000); }
  COUNTRIES.forEach(id => {
    const n = NATIONS[id];
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${n.lat}&longitude=${n.lon}&current=cloud_cover,precipitation`)
      .then(r => r.json()).then(d => { if (d.current) S.weather[id] = { clouds: d.current.cloud_cover, rain: d.current.precipitation }; }).catch(() => {}).finally(() => S.dataDone++);
  });
  // strength of a coin: if gold got more expensive in your currency, your coin got weaker
  const strength = id => CURRENCY[id] ? -GOLD[CURRENCY[id]] : null;
  // who gets the advantage: the weaker coin; same currency → toss a coin
  function decide() {
    const a = strength(S.me), b = strength(S.rival);
    S.toss = a !== null && b !== null && CURRENCY[S.me] === CURRENCY[S.rival];
    S.meFirst = S.toss ? Math.random() < .5 : (b === null ? true : (a === null ? false : a <= b));
  }
  const clock = (id, withMinutes) => {
    const f = new Intl.DateTimeFormat('en-GB', { timeZone: NATIONS[id].tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    return withMinutes ? f : Number(f.slice(0, 2)) % 24;
  };

  // --- live camera of the square
  let currentLive = null;
  function live(id) {
    const f = document.getElementById('live'), v = id && NATIONS[id].live;
    if (v === currentLive) return; currentLive = v;
    if (v) { f.src = `https://www.youtube.com/embed/${v}?autoplay=1&mute=1&controls=0&playsinline=1&loop=1`; f.style.display = 'block'; }
    else { f.src = 'about:blank'; f.style.display = 'none'; }
  }

  // --- phone controller (PeerJS)
  const code = String(Math.floor(1000 + Math.random() * 9000));
  try {
    const peer = new Peer('greatthrow-' + code);
    peer.on('open', () => {
      S.peerOk = true; updateQR();
    });
    peer.on('connection', conn => {
      S.conn = conn;
      conn.on('open', () => { S.phone = true; updateQR(); sendFlag(); });
      conn.on('data', d => {
        S.signal = 1; // tray phone icon flashes: a message arrived
        if (d.type === 'tap') press();
        const r = CONFIG.radius * .95, ax = CX + (d.x - .5) * 2.2 * r, ay = CY + (d.y - .5) * 2.2 * r;
        if (d.type === 'aim') { S.aim = { x: ax, y: ay, t: 1 }; }
        if (d.type === 'throw') {
          if (S.scene !== 'duel') return press(); // lifting the finger also moves the game forward
          throwFlag(ax, ay); S.aim = null;
        }
      });
      conn.on('close', () => { S.phone = false; S.conn = null; updateQR(); });
    });
  } catch (e) { console.warn('PeerJS unavailable: single-player mode'); }
  function sendFlag() { try { if (S.conn && S.phone && S.me) S.conn.send({ type: 'flag', id: S.me }); } catch (e) {} }
  function makeQR() {
    const b = document.getElementById('qr'), url = location.origin + location.pathname + '?role=phone&flag=' + S.me + '&id=' + code;
    if (b.dataset.url === url || typeof qrcode === 'undefined') return;
    const qr = qrcode(0, 'M'); qr.addData(url); qr.make(); b.innerHTML = qr.createImgTag(4, 0); b.dataset.url = url; console.log('Phone:', url);
  }
  function updateQR() { const b = document.getElementById('qr'); if (S.scene === 'pair') makeQR(); const on = S.scene === 'pair' && b.innerHTML; b.style.display = on ? 'block' : 'none'; b.classList.toggle('pair', !!on); }

  // --- WEBCAM TRACKER: finds the pink phone screen, aims with it, throws on a sharp flick
  const Cam = (() => {
    const v = document.createElement('video'); v.muted = true; v.playsInline = true;
    const c = document.createElement('canvas'); c.width = 80; c.height = 60; const cg = c.getContext('2d', { willReadFrequently: true });
    const T = { on: false, found: false, x: .5, y: .5, n: 0, seen: 0, hist: [], lastThrow: 0, speed: 0, wasFast: 0 };
    T.video = v;
    T.start = () => {
      if (T.on || !navigator.mediaDevices) return;
      T.on = 'asking';
      navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240, facingMode: 'user' } })
        .then(st => { v.srcObject = st; v.play(); T.on = true; })
        .catch(() => { T.on = false; T.denied = true; });
    };
    T.tick = (dt, now) => {
      if (T.on !== true || v.readyState < 2) return;
      cg.drawImage(v, 0, 0, 80, 60);
      const d = cg.getImageData(0, 0, 80, 60).data;
      let sx = 0, sy = 0, n = 0;
      for (let i = 0, p = 0; i < d.length; i += 4, p++) {
        const r = d[i], gg = d[i + 1], b = d[i + 2];
        if (r > 130 && b > 100 && r - gg > 70 && b - gg > 40) { sx += p % 80; sy += (p / 80) | 0; n++; }   // pink
      }
      const was = T.found;
      T.found = n >= CONFIG.camMinPixels; T.n = n;
      if (T.found) {
        const nx = 1 - sx / n / 80, ny = sy / n / 60;                                    // mirrored, like a mirror
        const dx = nx - T.x, dy = ny - T.y; T.speed = Math.hypot(dx, dy) / Math.max(dt, .001);
        T.x += dx * .5; T.y += dy * .5; T.seen += dt;
        T.hist.push({ t: now, x: T.x, y: T.y }); while (T.hist.length && now - T.hist[0].t > .6) T.hist.shift();
        if (T.speed > CONFIG.flickSpeed) T.wasFast = now;
      } else T.seen = 0;
      // a throw = a sharp flick (or the phone vanishing right after a fast move, motion blur)
      const flick = (T.found && T.speed > CONFIG.flickSpeed) || (was && !T.found && now - T.wasFast < .15);
      if (flick && now - T.lastThrow > .7 && T.hist.length) {
        T.lastThrow = now;
        const aimAt = T.hist.find(h => now - h.t < .35) || T.hist[0];                    // where you were aiming just before the flick
        if (T.onThrow) T.onThrow(aimAt.x, aimAt.y);
      }
    };
    return T;
  })();
  const camAim = (x, y) => { const r = CONFIG.radius * .95, k = v => Math.max(0, Math.min(1, (v - .2) / .6)); return { x: CX + (k(x) - .5) * 2.2 * r, y: CY + (k(y) - .5) * 2.2 * r }; };
  Cam.onThrow = (x, y) => { S.signal = 1; if (S.scene === 'duel') { const a = camAim(x, y); throwFlag(a.x, a.y); } };
  function camPreview(x, y, w, h) {
    if (Cam.on !== true) return;
    g.save(); g.translate(x + w, y); g.scale(-1, 1); g.drawImage(Cam.video, 0, 0, w, h); g.restore();   // mirrored
    g.strokeStyle = Cam.found ? '#7dff9a' : '#ff5a4a'; g.lineWidth = 2; g.strokeRect(x, y, w, h);
    if (Cam.found) { g.fillStyle = '#ff2bd6'; g.fillRect(x + Cam.x * w - 2, y + Cam.y * h - 2, 4, 4); }
  }

  // --- SCENARIO CARDS: beat a country and it opens a real political dossier: the two countries that react are your only next rivals
  const CARDS = {
    italy: 'migration', spain: 'ballot', france: 'veto', germany: 'industry', usa: 'tariffs',
    russia: 'gas', china: 'surveillance', saudi: 'oil', northkorea: 'missile',
  };
  // pixel icons, drawn in a 16x16 box (no text)
  function cardIcon(kind, x, y, s) {
    const p = (px, py, w, h, c) => { g.fillStyle = c; g.fillRect(x + px * s, y + py * s, w * s, h * s); };
    switch (kind) {
      case 'migration': p(0, 12, 16, 2, '#3a7bf0'); p(2, 14, 12, 2, '#245edb'); p(3, 9, 10, 3, '#8a5a2b'); p(7, 3, 1, 6, '#ddd'); p(8, 4, 4, 4, '#f4efe6'); p(4, 7, 2, 2, '#f1c27d'); p(10, 7, 2, 2, '#f1c27d'); break; // boat on the waves
      case 'ballot': p(3, 6, 10, 8, '#245edb'); p(5, 6, 6, 1, '#0a246a'); p(6, 1, 4, 6, '#f4efe6'); p(7, 3, 2, 1, '#c0392b'); break;                            // ballot box
      case 'veto': p(5, 3, 2, 8, '#f1c27d'); p(7, 2, 2, 9, '#f1c27d'); p(9, 3, 2, 8, '#f1c27d'); p(11, 5, 2, 6, '#f1c27d'); p(4, 9, 9, 5, '#f1c27d'); p(3, 7, 2, 4, '#f1c27d'); break; // raised hand
      case 'industry': for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; p(7 + Math.round(Math.cos(a) * 5), 7 + Math.round(Math.sin(a) * 5), 2, 2, '#aab'); } p(4, 4, 8, 8, '#aab'); p(6, 6, 4, 4, '#334'); break; // gear
      case 'tariffs': p(1, 5, 14, 8, '#c0392b'); for (let i = 0; i < 6; i++) p(2 + i * 2, 6, 1, 6, '#8e2a20'); p(6, 1, 4, 4, '#ffd34a'); p(7, 2, 2, 2, '#c0392b'); break;     // container + padlock
      case 'gas': p(2, 7, 12, 3, '#888'); p(6, 3, 4, 10, '#666'); p(4, 1, 8, 2, '#c0392b'); break;                                                                // shut valve
      case 'surveillance': p(1, 6, 14, 5, '#f4efe6'); p(3, 5, 10, 1, '#f4efe6'); p(3, 11, 10, 1, '#f4efe6'); p(6, 6, 4, 5, '#245edb'); p(7, 7, 2, 3, '#000'); break;     // eye
      case 'oil': p(4, 2, 8, 12, '#d4a017'); p(4, 5, 8, 1, '#8a6418'); p(4, 10, 8, 1, '#8a6418'); p(6, 0, 4, 2, '#d4a017'); break;                            // gold barrel
      case 'arms': p(1, 8, 6, 6, '#6b5a2b'); p(9, 8, 6, 6, '#6b5a2b'); p(2, 10, 4, 1, '#3a2f15'); p(10, 10, 4, 1, '#3a2f15'); p(4, 3, 8, 2, '#888'); p(10, 2, 3, 4, '#888'); p(6, 5, 1, 3, '#888'); break;    // crates + rifle
      case 'sanctions': p(2, 6, 12, 9, '#c9a227'); p(4, 1, 2, 6, '#bbb'); p(10, 1, 2, 6, '#bbb'); p(4, 1, 8, 2, '#bbb'); p(7, 9, 2, 3, '#3a2f15'); break;                                   // padlock
      case 'summit': g.fillStyle = '#8a5a2b'; g.beginPath(); g.ellipse(x + 8 * s, y + 9 * s, 7 * s, 4 * s, 0, 0, Math.PI * 2); g.fill(); ['#ce2b37', '#0055a4', '#ffce00', '#009246', '#de2910', '#fff'].forEach((c, i) => { const a = i / 6 * Math.PI * 2; p(7 + Math.round(Math.cos(a) * 7), 8 + Math.round(Math.sin(a) * 5), 2, 2, c); }); break; // round table
      case 'alliance': p(1, 7, 6, 4, '#f1c27d'); p(9, 7, 6, 4, '#e0ac69'); p(6, 6, 4, 6, '#f1c27d'); p(0, 6, 2, 6, '#245edb'); p(14, 6, 2, 6, '#c0392b'); break;                       // handshake
      case 'roulette': for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#111' : '#c0392b'; g.beginPath(); g.moveTo(x + 8 * s, y + 8 * s); g.arc(x + 8 * s, y + 8 * s, 7 * s, i * Math.PI / 4 + S.t * 4, (i + 1) * Math.PI / 4 + S.t * 4); g.fill(); } p(7, 7, 2, 2, '#ffd34a'); break; // spinning wheel
      case 'debt': g.fillStyle = '#d4a017'; g.beginPath(); g.arc(x + 6 * s, y + 8 * s, 5 * s, 0, Math.PI * 2); g.fill(); p(4, 6, 4, 1, '#8a6418'); p(4, 9, 4, 1, '#8a6418'); p(12, 3, 2, 9, '#c0392b'); p(10, 10, 6, 2, '#c0392b'); p(11, 12, 4, 1, '#c0392b'); p(12, 13, 2, 1, '#c0392b'); break; // coin + falling arrow
      case 'car': p(2, 8, 12, 4, '#c0392b'); p(4, 5, 8, 3, '#c0392b'); p(5, 6, 6, 2, '#9fd0ff'); p(3, 12, 3, 3, '#111'); p(10, 12, 3, 3, '#111'); break;          // car (exports)
      case 'expo': p(7, 1, 2, 13, '#ccc'); p(4, 6, 8, 2, '#ccc'); p(2, 13, 12, 2, '#888'); p(6, 0, 4, 2, '#ffd34a'); break;                                       // expo tower
      case 'port': p(0, 12, 16, 4, '#245edb'); p(2, 8, 12, 4, '#c0392b'); p(4, 5, 3, 3, '#2f9e3a'); p(8, 5, 3, 3, '#ffd34a'); p(13, 1, 1, 8, '#888'); p(10, 1, 4, 1, '#888'); break; // port: ship + crane
      case 'base': p(1, 13, 14, 2, '#5a6b3a'); p(6, 4, 4, 8, '#888'); p(2, 7, 12, 2, '#888'); p(5, 11, 6, 1, '#888'); p(7, 1, 2, 3, '#888'); break;                // air base: jet
      case 'raid': p(4, 1, 8, 14, '#8a5a2b'); p(5, 2, 6, 12, '#6b4420'); p(9, 8, 1, 1, '#ffd34a'); p(1, 6, 3, 1, '#fff'); p(12, 6, 3, 1, '#fff'); p(0, 9, 3, 1, '#fff'); break; // door kicked in
      case 'missile': p(7, 1, 2, 2, '#c0392b'); p(6, 3, 4, 9, '#ccc'); p(4, 10, 2, 4, '#888'); p(10, 10, 2, 4, '#888'); p(7, 12, 2, 3, '#ffb000'); break;               // missile
    }
  }
  // a trading card: nation-coloured frame, icon in the middle
  function card(kind, from, x, y, w, h, flipX, blink, open) {
    g.save(); g.translate(x + w / 2, y + h / 2); g.scale(flipX === undefined ? 1 : Math.max(.05, Math.abs(flipX)), 1); g.translate(-w / 2, -h / 2);
    if (flipX !== undefined && flipX < 0) { // back of the card
      g.fillStyle = '#0a246a'; g.fillRect(0, 0, w, h); for (let i = 0; i < 6; i++) { g.fillStyle = i % 2 ? '#f4efe6' : '#d32626'; g.beginPath(); g.arc(w / 2, h / 2, (6 - i) * w / 14, 0, Math.PI * 2); g.fill(); }
    } else {
      g.fillStyle = '#ffe680'; g.fillRect(0, 0, w, h);
      flag(g, from, 2, 2, w - 4, Math.round(h * .22));
      g.fillStyle = '#1b1b3a'; g.fillRect(2, Math.round(h * .26), w - 4, h - Math.round(h * .26) - 2);
      const s = Math.max(1, Math.floor(Math.min(w - 8, h * .38) / 16)); cardIcon(kind, Math.round((w - 16 * s) / 2), Math.round(h * .31), s);
      const r = (open || []).slice(0, 4), n = Math.max(1, r.length), fw = Math.round((w - 6 - (n - 1) * 2) / Math.max(2, n)), fh = Math.round(fw * .66), fy = h - fh - 5, ox = Math.round((w - n * fw - (n - 1) * 2) / 2);
      if (h > 30) r.forEach((id, i) => { if (!(blink && Math.floor(S.t * 4) % 2)) flag(g, id, ox + i * (fw + 2), fy, fw, fh); });
      if (h > 30 && kind === 'alliance' && r.length === 2) { g.fillStyle = '#f1c27d'; g.fillRect(ox + fw - 2, fy + fh / 2 - 1, 6, 3); } // handshake between the two
    }
    g.restore();
  }

  // --- SCENARIO CARDS (like Monopoly's Chance cards): after every win a card appears on its own,
  // tells a small real-politics story and decides who you can challenge next.
  // STORIES: for every beaten country, real links towards every other country (1 country = forced, more = choice)
  const STORIES = {
    italy:      [{ kind: 'migration', opens: ['spain', 'france'] }, { kind: 'debt', opens: ['germany'] }, { kind: 'port', opens: ['china'] },
                 { kind: 'gas', opens: ['russia'] }, { kind: 'tariffs', opens: ['usa'] }, { kind: 'expo', opens: ['saudi'] }, { kind: 'summit', opens: ['northkorea'] }],
    spain:      [{ kind: 'migration', opens: ['italy', 'france'] }, { kind: 'base', opens: ['usa'] }, { kind: 'arms', opens: ['saudi'] },
                 { kind: 'car', opens: ['china'] }, { kind: 'debt', opens: ['germany'] }, { kind: 'raid', opens: ['northkorea'] }, { kind: 'sanctions', opens: ['russia'] }],
    france:     [{ kind: 'industry', opens: ['germany'] }, { kind: 'arms', opens: ['saudi'] }, { kind: 'veto', opens: ['usa', 'russia', 'china'] },
                 { kind: 'migration', opens: ['italy', 'spain'] }, { kind: 'missile', opens: ['northkorea'] }],
    germany:    [{ kind: 'gas', opens: ['russia'] }, { kind: 'car', opens: ['china'] }, { kind: 'debt', opens: ['italy', 'spain'] },
                 { kind: 'tariffs', opens: ['usa'] }, { kind: 'industry', opens: ['france'] }, { kind: 'arms', opens: ['saudi'] }, { kind: 'sanctions', opens: ['northkorea'] }],
    usa:        [{ kind: 'tariffs', opens: ['china'] }, { kind: 'oil', opens: ['saudi'] }, { kind: 'missile', opens: ['northkorea'] },
                 { kind: 'tariffs', opens: ['germany', 'france', 'italy', 'spain'] }, { kind: 'sanctions', opens: ['russia'] }],
    russia:     [{ kind: 'gas', opens: ['germany', 'italy', 'spain'] }, { kind: 'alliance', opens: ['china', 'northkorea'] }, { kind: 'oil', opens: ['saudi'] },
                 { kind: 'sanctions', opens: ['usa', 'france'] }],
    china:      [{ kind: 'tariffs', opens: ['usa'] }, { kind: 'alliance', opens: ['northkorea', 'russia'] }, { kind: 'car', opens: ['germany', 'spain', 'france'] },
                 { kind: 'port', opens: ['italy'] }, { kind: 'oil', opens: ['saudi'] }],
    saudi:      [{ kind: 'oil', opens: ['usa', 'russia'] }, { kind: 'arms', opens: ['france', 'spain'] }, { kind: 'expo', opens: ['italy'] },
                 { kind: 'oil', opens: ['china'] }, { kind: 'arms', opens: ['germany'] }, { kind: 'missile', opens: ['northkorea'] }],
    northkorea: [{ kind: 'alliance', opens: ['china', 'russia'] }, { kind: 'missile', opens: ['usa'] }, { kind: 'veto', opens: ['france'] },
                 { kind: 'raid', opens: ['spain'] }, { kind: 'sanctions', opens: ['germany', 'italy'] }, { kind: 'oil', opens: ['saudi'] }],
  };
  // the twists: can come after any win
  const TWISTS = [
    { kind: 'sanctions', rule: 'forced', pick: () => ['russia', 'northkorea'] },
    { kind: 'ballot', rule: 'election', likes: ['spain'] },
    { kind: 'summit', rule: 'free' },
    { kind: 'alliance', rule: 'alliance' },
    { kind: 'roulette', rule: 'roulette' },
  ];
  const ALLIES = [['russia', 'northkorea'], ['russia', 'china'], ['china', 'northkorea'], ['usa', 'saudi'], ['france', 'germany'], ['italy', 'spain'], ['usa', 'germany']];
  const left = () => COUNTRIES.filter(id => id !== S.me && !S.world.conquests[id]);
  function outcome(sc, beaten) {
    const free = left();
    if (sc.opens) return sc.opens.filter(id => free.includes(id));
    if (sc.rule === 'forced') return sc.pick(beaten).filter(id => free.includes(id)).slice(0, 1);
    if (sc.rule === 'free') return free;
    if (sc.rule === 'roulette') return free.length ? [free[Math.floor(Math.random() * free.length)]] : [];
    if (sc.rule === 'election') { const mine = Object.keys(S.world.conquests).filter(id => id !== beaten && id !== S.me); return mine.length ? [mine[Math.floor(Math.random() * mine.length)]] : []; }
    if (sc.rule === 'alliance') { const pairs = ALLIES.filter(([a, b]) => free.includes(a) && free.includes(b)); return pairs.length ? pairs[Math.floor(Math.random() * pairs.length)] : []; }
    return [];
  }
  function scenarioAfter(beaten) {
    const stories = (STORIES[beaten] || []).map(sc => ({ sc, o: outcome(sc, beaten) })).filter(x => x.o.length);
    const twists = TWISTS.flatMap(sc => (sc.likes && sc.likes.includes(beaten) ? [sc, sc, sc] : [sc])).map(sc => ({ sc, o: outcome(sc, beaten) })).filter(x => x.o.length);
    const pool = stories.length && Math.random() < .75 ? stories : twists.length ? twists : stories;
    if (!pool.length) return { kind: 'summit', rule: 'free', open: left() };
    const { sc, o } = pool[Math.floor(Math.random() * pool.length)];
    return { kind: sc.kind, rule: sc.rule || (o.length === 1 ? 'forced' : 'choice'), open: o };
  }
  // apply the card to the world
  function applyScenario(c) {
    S.world.open = c.open; S.world.alliance = null;
    if (c.rule === 'election') delete S.world.conquests[c.open[0]];          // the country you held votes you out: win it back
    if (c.rule === 'alliance') { S.world.alliance = c.open.slice(); S.world.open = [c.open[0]]; } // beat one, the ally falls too
  }

  // --- laptop input
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  cv.addEventListener('pointerdown', e => {
    const p = pos(e);
    if (p.y > 226 && p.x > 252 && p.x < 280) return Music.toggleMute();
    if (S.scene === 'duel') return throwFlag(p.x, p.y);
    if (S.scene === 'pickMe' || S.scene === 'pickRival') {
      const i = Math.floor((p.x - 8) / 34);
      if (i >= 0 && i < 9 && p.y > 60 && p.y < 200) { if (S.scene === 'pickRival' && !allowed(COUNTRIES[i])) return; if (i === S.sel) press(); else S.sel = i; return; }
    }
    press();
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') move(1);
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'Enter' || e.key === ' ') press();
  });
  function allowed(id) {
    if (id === S.me) return false;
    const open = (S.world.open || []).filter(r => !S.world.conquests[r] && r !== S.me);
    return open.length ? open.includes(id) : !S.world.conquests[id];
  }
  function move(d) { if (S.scene === 'pickMe') S.sel = (S.sel + d + 9) % 9; if (S.scene === 'pickRival') { for (let i = 0; i < 9; i++) { S.sel = (S.sel + d + 9) % 9; if (allowed(COUNTRIES[S.sel])) break; } } }

  function go(sc) { S.scene = sc; S.t = 0; if (sc === 'pair') Cam.start(); updateQR(); if (sc === 'crash') Music.crash(); }
  function press() {
    const sc = S.scene;
    if (sc === 'off') { Modem.unlock(); go('splash'); }
    else if (sc === 'splash' || sc === 'dial') { Modem.stop(); Music.start(); go('title'); } // skip the intro
    else if (sc === 'title') { Music.start(); S.sel = 0; go('pickMe'); }
    else if (sc === 'pickMe') { S.me = COUNTRIES[S.sel]; S.sel = 0; go('pickRival'); if (!allowed(COUNTRIES[S.sel])) move(1); }
    else if (sc === 'pickRival') { if (!allowed(COUNTRIES[S.sel])) return; S.rival = COUNTRIES[S.sel]; go('pair'); sendFlag(); }
    else if (sc === 'pair') coins(); // no phone: play solo with the mouse
    else if (sc === 'coins' && S.t > 2.2) duel();
    else if (sc === 'crash' && S.t > 1.2) duel();
    else if (sc === 'win' && S.t > 4) { go(Object.keys(S.world.conquests).length >= 8 ? 'ending' : 'pickRival'); if (S.scene === 'pickRival' && !allowed(COUNTRIES[S.sel])) move(1); }
    else if (sc === 'ending' && S.t > 2) { S.world = { conquests: {}, open: [], cards: [] }; save(); go('title'); }
  }

  function coins() { decide(); go('coins'); }

  function duel() {
    go('duel'); Music.start();
    S.flights = []; S.planted = []; S.left = CONFIG.flags; S.influence = 0; S.wheel = 0;
    // the weaker coin gets the advantage: the wheel starts still
    S.hold = S.meFirst ? 1.5 : 0;
    S.falling = [];
  }

  // --- throwing
  function throwFlag(tx, ty) {
    if (S.left <= 0) return;
    S.left--;
    S.flights.push({ tx: tx + (Math.random() - .5) * 5, ty: ty + (Math.random() - .5) * 5, t: 0 });
  }
  const leaderScale = () => { const s = SPR[S.rival]; return s && s.ok ? 118 / s.im.height : 1; };
  function toWheel(x, y) { const dx = x - CX, dy = y - CY, c = Math.cos(-S.wheel), s = Math.sin(-S.wheel); return { x: dx * c - dy * s, y: dx * s + dy * c }; }
  function toScreen(l) { const c = Math.cos(S.wheel), s = Math.sin(S.wheel); return { x: CX + l.x * c - l.y * s, y: CY + l.x * s + l.y * c }; }
  function hitsLeader(l) {
    const sp = SPR[S.rival]; if (!sp || !sp.ok) return Math.abs(l.x) < 25 && Math.abs(l.y) < 55;
    const k = leaderScale(), sx = Math.floor(l.x / k + sp.im.width / 2), sy = Math.floor(l.y / k + sp.im.height / 2);
    if (sx < 0 || sy < 0 || sx >= sp.im.width || sy >= sp.im.height) return false;
    if (!sp.mask) return true;
    // 2-pixel margin: grazing is skill, touching is a mistake
    for (let oy = -2; oy <= 2; oy += 2) for (let ox = -2; ox <= 2; ox += 2) {
      const xx = sx + Math.round(ox / k), yy = sy + Math.round(oy / k);
      if (xx >= 0 && yy >= 0 && xx < sp.im.width && yy < sp.im.height && sp.mask.data[(yy * sp.im.width + xx) * 4 + 3] > 40) return true;
    }
    return false;
  }
  function sectors() {
    const cov = new Array(CONFIG.sectors).fill(false);
    S.planted.forEach(p => { const a = (Math.atan2(p.l.y, p.l.x) + Math.PI * 2) % (Math.PI * 2); cov[Math.floor(a / (Math.PI * 2) * CONFIG.sectors)] = true; });
    return cov;
  }

  function update(dt) {
    S.t += dt; S.clock = (S.clock || 0) + dt;
    Cam.tick(dt, S.clock);
    if (S.scene === 'pair' && Cam.seen > 1) coins();
    const sc = S.scene, prog = S.loaded / 10;
    if (sc === 'splash' && ((S.t > 2.2 && prog >= 1) || S.t > 6)) { Modem.play(); go('dial'); }
    else if (sc === 'dial' && ((S.t > 3 && S.dataDone >= 10) || S.t > 7)) { Modem.stop(); Music.start(); go('title'); }
    if (S.scene !== 'duel') return;
    if (S.hold > 0) S.hold -= dt;
    else {
      S.speed = .55 + Math.sin(S.t * .45) * .9;
      S.wheel += S.speed * dt;
    }
    for (const f of S.flights) {
      f.t += dt / .42;
      if (f.t < 1 || f.done) continue;
      f.done = true;
      const l = toWheel(f.tx, f.ty);
      if (hitsLeader(l)) {
        S.crash = { x: f.tx, y: f.ty, cracks: Array.from({ length: 14 }, () => ({ a: Math.random() * Math.PI * 2, r: 30 + Math.random() * 140, k: Math.random() })) };
        go('crash'); return;
      }
      const d = Math.hypot(l.x, l.y);
      if (d <= CONFIG.radius) { S.planted.push({ l, t: 0 }); S.influence += Math.max(0, Math.round(100 - d)); }
      else { S.falling.push({ x: f.tx, y: f.ty, v: 0 }); }
    }
    S.flights = S.flights.filter(f => !f.done);
    S.planted.forEach(p => p.t += dt);
    if (sectors().every(Boolean)) {
      S.world.conquests[S.rival] = S.me;
      const al = S.world.alliance; if (al && al.includes(S.rival)) al.forEach(id => S.world.conquests[id] = S.me); // the alliance falls together
      S.scenario = scenarioAfter(S.rival); applyScenario(S.scenario);
      S.world.cards = (S.world.cards || []).concat({ kind: S.scenario.kind, from: S.rival, open: S.scenario.open });
      save(); go('win');
    } else if (S.left === 0 && !S.flights.length) { S.crash = null; go('crash'); }
  }

  /* ---------------- drawing ---------------- */
  function background(id) {
    live(id);
    if (id && NATIONS[id].live) { g.clearRect(0, 0, W, H); return; }
    const h = clock(id || 'italy'), m = S.weather[id] || { clouds: 30, rain: 0 };
    const day = h >= 7 && h < 18, dusk = (h >= 17 && h < 20) || (h >= 6 && h < 8);
    const a = day ? [70, 130, 220] : dusk ? [210, 110, 90] : [12, 16, 48], b = day ? [170, 210, 240] : dusk ? [245, 180, 110] : [40, 32, 80];
    for (let y = 0; y < H; y += 3) { const k = y / H, d = ((y / 3) % 2) * .04; g.fillStyle = `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * Math.min(1, k + d))).join(',')})`; g.fillRect(0, y, W, 3); }
    g.fillStyle = day ? 'rgba(245,245,255,.85)' : 'rgba(90,90,120,.85)';
    for (let i = 0; i < Math.round(m.clouds / 12); i++) { const x = (i * 83 + S.t * 3) % (W + 80) - 40, y = 14 + (i * 29) % 70; g.fillRect(Math.round(x), y, 40, 9); g.fillRect(Math.round(x) + 10, y - 6, 22, 7); }
    // generic low-poly city
    g.fillStyle = day ? '#6d7f8f' : '#1c1a2e';
    for (let i = 0; i < 18; i++) { const w = 12 + (i * 7) % 14, hh = 20 + (i * 37) % 46; g.fillRect(i * 19 - 4, 196 - hh, w, hh + 30); }
    g.fillStyle = day ? '#59705a' : '#151a18'; g.fillRect(0, 196, W, 44);
    if (!day) { g.fillStyle = '#ffd36b'; for (let i = 0; i < 40; i++) g.fillRect((i * 41) % W, 150 + (i * 17) % 44, 2, 2); }
    if (m.rain > 0) { g.fillStyle = 'rgba(190,210,255,.55)'; for (let i = 0; i < 90; i++) g.fillRect((i * 53 + S.t * 30) % W, (i * 31 + S.t * 230) % H, 1, 4); }
  }

  function desktop(bgOf) {
    background(bgOf);
    // one icon per nation
    COUNTRIES.forEach((id, i) => {
      const x = 6, y = 6 + i * 23, cq = S.world.conquests[id], re = (S.world.open || []).includes(id);
      if (re && Math.floor(S.t * 3) % 2) { g.fillStyle = 'rgba(80,140,255,.6)'; g.fillRect(x - 2, y - 2, 30, 22); }
      head(id, x + 4, y, 16);
      flag(g, cq || id, x + 14, y + 10, 14, 9);
      if (cq) { g.strokeStyle = '#ffe680'; g.lineWidth = 1; g.strokeRect(x + 13.5, y + 9.5, 15, 10); }
    });
    taskbar();
  }
  function taskbar() {
    (S.world.cards || []).slice(-9).forEach((c, i) => card(c.kind, c.from, 46 + i * 12, 227, 10, 12, undefined, false, c.open));
    // phone icon: green when connected, flashes white when a gesture arrives
    if (S.phone) { S.signal = Math.max(0, (S.signal || 0) - .05); g.fillStyle = S.signal > 0 ? '#ffffff' : '#7dff9a'; g.fillRect(232, 228, 6, 10); g.fillStyle = '#1f4fb8'; g.fillRect(233, 229, 4, 7); }
    g.fillStyle = '#1f4fb8'; g.fillRect(0, 226, W, 14);
    g.fillStyle = '#3c7be0'; g.fillRect(0, 226, W, 2);
    g.fillStyle = '#2f9e3a'; g.fillRect(0, 226, 42, 14); g.fillStyle = '#4ccf58'; g.fillRect(0, 226, 42, 2);
    if (S.me) flag(g, S.me, 8, 229, 13, 9); else { g.fillStyle = '#fff'; g.fillRect(10, 230, 4, 4); g.fillRect(15, 230, 4, 4); g.fillRect(10, 235, 4, 4); g.fillRect(15, 235, 4, 4); }
    g.fillStyle = '#1a8fd8'; g.fillRect(W - 70, 226, 70, 14);
    // tray: speaker + live bars from the real audio (click to mute)
    g.fillStyle = '#fff'; g.fillRect(W - 66, 231, 2, 4); g.beginPath(); g.moveTo(W - 64, 231); g.lineTo(W - 61, 228); g.lineTo(W - 61, 238); g.lineTo(W - 64, 235); g.fill();
    if (Music.muted) { g.fillStyle = '#ff5a4a'; g.fillRect(W - 59, 231, 4, 1); g.fillRect(W - 59, 234, 4, 1); }
    else Music.levels().forEach((v, i) => { const h = 1 + Math.round(v * 9); g.fillStyle = i > 3 ? '#ffe040' : '#7dff9a'; g.fillRect(W - 58 + i * 3, 237 - h, 2, h); });
    number(clock(S.rival || 'italy', true), W - 20, 236, '#fff');
  }

  function head(id, x, y, h) {
    const sp = SPR[id]; if (!sp.ok) return;
    const k = h * 2.6 / sp.im.height; // top of the sprite only: the head
    g.save(); g.beginPath(); g.rect(x - 8, y, 16, h); g.clip();
    g.drawImage(sp.im, x - sp.im.width * k / 2, y, sp.im.width * k, sp.im.height * k); g.restore();
  }

    flag(g, COUNTRIES[country], fx, fy, fw, fh);
    const dot = Math.round(W * .03); g.fillStyle = connected ? '#3c3' : '#c33'; g.fillRect(W - dot * 2, dot, dot, dot);
    trail = Math.max(0, trail - .08);
    requestAnimationFrame(draw);
  })();
}

</script>
