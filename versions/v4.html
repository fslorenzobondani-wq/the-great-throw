<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Il Grande Lancio</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; margin: auto; aspect-ratio: 4 / 3; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; border-radius: 2.5% / 3.3%; }
  #live { position: absolute; inset: -8%; width: 116%; height: 116%; border: 0; pointer-events: none; display: none;
          filter: saturate(1.5) contrast(1.2) brightness(.92); }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fx { position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,.25) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.7) 100%);
        box-shadow: inset 0 0 60px rgba(120,200,255,.12); }
  #qr { position: absolute; right: 2%; bottom: 9%; width: 16%; background: #fff; padding: .8%; display: none; image-rendering: pixelated; }
  #qr img { width: 100%; display: block; }
  /* ---- lettore multimediale anni 2000 ---- */
  #lettore { position: absolute; right: 2.2%; top: 4%; width: 25%; padding: .5% .6% .7%; border-radius: 10px 10px 14px 14px;
             background: linear-gradient(180deg, #e9eef6 0%, #b9c4d6 45%, #8e9bb3 100%);
             border: 1px solid #3a4a6a; box-shadow: 0 0 0 2px #0b1a3a, 4px 6px 0 rgba(0,0,0,.35); display: none; z-index: 5;
             transition: all .35s steps(6); }
  #lettore .barra { height: 9%; display: flex; align-items: center; gap: 4%; padding: 2% 3%; border-radius: 7px 7px 0 0;
                    background: linear-gradient(180deg, #4f8df5, #1f4fb8); }
  #lettore .barra i { display: block; width: 8%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #7ab0ff 40%, #1a3f9a); }
  #lettore .barra i.x { margin-left: auto; background: radial-gradient(circle at 35% 35%, #ffd0c0, #e0553a 45%, #8a1a0a); }
  #lettore .schermo { position: relative; margin-top: 4%; aspect-ratio: 16 / 10; background: #000; border: 2px inset #6b7894; overflow: hidden; }
  #lettore .schermo #yt, #lettore .schermo iframe { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #lettore canvas.vis { display: block; width: 100%; height: 14%; margin-top: 4%; background: #03140a; border: 2px inset #6b7894; image-rendering: pixelated; }
  #lettore .avanz { margin-top: 5%; height: 5px; background: #2a3550; border-radius: 3px; overflow: hidden; border: 1px solid #1a2238; }
  #lettore .avanz b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6cf06c, #1fae3a); }
  #lettore .tasti { display: flex; align-items: center; gap: 5%; margin-top: 5%; }
  #lettore button { flex: 0 0 auto; width: 17%; aspect-ratio: 1; border-radius: 50%; border: 1px solid #22305a; cursor: pointer; padding: 0;
                    background: radial-gradient(circle at 35% 30%, #ffffff, #b8c8e8 45%, #5d6f99); display: grid; place-items: center; }
  #lettore button.grande { width: 24%; background: radial-gradient(circle at 35% 30%, #e8fff0, #6fd68a 45%, #1d7a3a); }
  #lettore button svg { width: 55%; height: 55%; fill: #102040; }
  #lettore input[type=range] { flex: 1; accent-color: #2f6fe0; min-width: 0; }
  /* minimizzato nella barra delle applicazioni */
  #lettore.mini { top: auto; bottom: 0; right: 13%; width: 17%; height: 5.8%; padding: 0 .5%; border-radius: 0; box-shadow: none;
                  display: flex !important; align-items: center; gap: 4%; background: linear-gradient(180deg, #3c7be0, #1f4fb8); border: 0; border-left: 2px solid #0a246a; }
  #lettore.mini .barra, #lettore.mini .avanz, #lettore.mini input { display: none; }
  #lettore.mini .schermo { position: absolute; width: 1px; height: 1px; opacity: 0; margin: 0; border: 0; }
  #lettore.mini canvas.vis { width: 55%; height: 70%; margin: 0; border-width: 1px; order: 2; }
  #lettore.mini .tasti { margin: 0; width: 40%; gap: 6%; order: 1; }
  #lettore.mini button { width: 40%; }
  #lettore.mini button.stop { display: none; }
  #lettore.nascosto { display: none !important; }
  #pad { position: absolute; inset: 0; display: none; background: #111; }
  #pad canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="live" allow="autoplay; encrypted-media"></iframe>
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="fx"></div>
  <div id="qr"></div>
  <div id="lettore">
    <div class="barra"><i></i><i></i><i class="x"></i></div>
    <div class="schermo"><div id="yt"></div></div>
    <canvas class="vis" width="64" height="12"></canvas>
    <div class="avanz"><b></b></div>
    <div class="tasti">
      <button class="grande" data-az="play" aria-label="play/pausa"><svg viewBox="0 0 10 10"><path d="M2 1L9 5L2 9z"/></svg></button>
      <button class="stop" data-az="stop" aria-label="stop"><svg viewBox="0 0 10 10"><rect x="2" y="2" width="6" height="6"/></svg></button>
      <input type="range" min="0" max="100" value="70" aria-label="volume">
    </div>
  </div>
</div>
<div id="pad"><canvas id="padc"></canvas></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   IL GRANDE LANCIO · v3
   Laptop = bersaglio (index.html) · Telefono = controller (?ruolo=telefono&id=XXXX)
   ============================================================ */

// live: ID di un video YouTube in diretta della piazza (la parte dopo "watch?v=").
// Vuoto = sfondo sincronizzato su ora e meteo reali della capitale.
const NAZ = {
  italia:   { live: '', lat: 41.90, lon: 12.50,  tz: 'Europe/Rome' },
  spagna:   { live: '', lat: 40.42, lon: -3.70,  tz: 'Europe/Madrid' },
  francia:  { live: '', lat: 48.86, lon: 2.35,   tz: 'Europe/Paris' },
  germania: { live: '', lat: 52.52, lon: 13.40,  tz: 'Europe/Berlin' },
  usa:      { live: '', lat: 38.89, lon: -77.03, tz: 'America/New_York' },
  russia:   { live: '', lat: 55.75, lon: 37.62,  tz: 'Europe/Moscow' },
  cina:     { live: '', lat: 39.90, lon: 116.40, tz: 'Asia/Shanghai' },
  arabia:   { live: '', lat: 24.71, lon: 46.68,  tz: 'Asia/Riyadh' },
  corea:    { live: '', lat: 39.02, lon: 125.75, tz: 'Asia/Pyongyang' },
};
const PAESI = Object.keys(NAZ);

// Se batti X, reagiscono questi due (vedi brief)
const REAZIONI = {
  italia: ['francia', 'spagna'],   spagna: ['italia', 'usa'],     francia: ['germania', 'arabia'],
  germania: ['russia', 'cina'],    usa: ['cina', 'corea'],        russia: ['germania', 'cina'],
  cina: ['usa', 'corea'],          arabia: ['usa', 'francia'],    corea: ['russia', 'cina'],
};

const CONFIG = { litriPieno: 50, bandiere: 7, settori: 6, raggio: 84 };

let PREZZI = { brent_usd: 65, paesi: {
  italia: { valuta: 'EUR', litro: 1.75 }, spagna: { valuta: 'EUR', litro: 1.55 }, francia: { valuta: 'EUR', litro: 1.80 },
  germania: { valuta: 'EUR', litro: 1.75 }, usa: { valuta: 'USD', litro: 0.85 }, russia: { valuta: 'RUB', litro: 62 },
  cina: { valuta: 'CNY', litro: 7.6 }, arabia: { valuta: 'SAR', litro: 2.33 }, corea: null } };
let CAMBI = { EUR: 1, USD: 1.08, RUB: 100, CNY: 7.8, SAR: 4.05 };

/* ============================================================
   LETTORE MULTIMEDIALE (YouTube IFrame API, nessun file audio nel repository)
   ============================================================ */
const CANZONE = 'ayH9DmSloTs';
const Lettore = (() => {
  const box = () => document.getElementById('lettore');
  let yt = null, pronto = false, vuolePartire = false, suona = false, avviato = false;
  const ICONA_PLAY = '<path d="M2 1L9 5L2 9z"/>', ICONA_PAUSA = '<rect x="2" y="1.5" width="2.2" height="7"/><rect x="5.8" y="1.5" width="2.2" height="7"/>';
  function icona() { box().querySelector('[data-az=play] svg').innerHTML = suona ? ICONA_PAUSA : ICONA_PLAY; }
  function init() {
    const b = box(); b.style.display = 'block';
    window.onYouTubeIframeAPIReady = () => {
      yt = new YT.Player('yt', {
        videoId: CANZONE,
        playerVars: { controls: 0, disablekb: 1, playsinline: 1, loop: 1, playlist: CANZONE, rel: 0, modestbranding: 1, iv_load_policy: 3 },
        events: {
          onReady: () => { pronto = true; yt.setVolume(70); if (vuolePartire) yt.playVideo(); },
          onStateChange: e => { suona = e.data === 1; icona(); },
          onError: e => console.warn('Il video non si può incorporare (codice ' + e.data + ')'),
        },
      });
    };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.querySelector('[data-az=play]').onclick = () => suona ? pausa() : play();
    b.querySelector('[data-az=stop]').onclick = () => { if (pronto) { yt.stopVideo(); suona = false; icona(); } };
    b.querySelector('input').oninput = e => { if (pronto) yt.setVolume(+e.target.value); };
    // visualizzatore a barre + avanzamento
    const vc = b.querySelector('canvas.vis'), vg = vc.getContext('2d'), bar = b.querySelector('.avanz b');
    const alt = new Array(16).fill(0);
    (function anima(t) {
      vg.fillStyle = '#03140a'; vg.fillRect(0, 0, 64, 12);
      for (let i = 0; i < 16; i++) {
        const target = suona ? (Math.abs(Math.sin(t / 180 + i * 1.7) * Math.sin(t / 430 + i * .6)) * 11 + Math.random() * 2) : 0;
        alt[i] += (target - alt[i]) * .35;
        for (let y = 0; y < Math.round(alt[i]); y++) { vg.fillStyle = y > 8 ? '#ff4040' : y > 5 ? '#ffe040' : '#40ff70'; vg.fillRect(i * 4, 11 - y, 3, 1); }
      }
      if (pronto && yt.getDuration) { const d = yt.getDuration() || 1; bar.style.width = (100 * (yt.getCurrentTime() || 0) / d) + '%'; }
      requestAnimationFrame(anima);
    })(0);
  }
  function play() { avviato = true; if (pronto) yt.playVideo(); else vuolePartire = true; }
  function pausa() { if (pronto) yt.pauseVideo(); vuolePartire = false; }
  // finestra grande nelle schermate "desktop", minimizzata nella barra durante il gioco
  function modo(scena) {
    const b = box(); if (!b) return;
    b.classList.toggle('nascosto', scena === 'crash');
    b.classList.toggle('mini', !['titolo', 'vittoria'].includes(scena));
  }
  return { init, play, pausa, modo, get avviato() { return avviato; } };
})();

const ruolo = new URLSearchParams(location.search).get('ruolo');
if (ruolo === 'telefono') avviaTelefono(); else avviaBersaglio();

/* ============================================================
   BANDIERE (pixel, nessun testo)
   ============================================================ */
function bandiera(g, id, x, y, w, h) {
  x = Math.round(x); y = Math.round(y); w = Math.max(3, Math.round(w)); h = Math.max(2, Math.round(h));
  const v = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x + Math.floor(i * w / c.length), y, Math.ceil(w / c.length), h); });
  const o = c => c.forEach((col, i) => { g.fillStyle = col; g.fillRect(x, y + Math.floor(i * h / c.length), w, Math.ceil(h / c.length)); });
  const px = (fx, fy, fw, fh, col) => { g.fillStyle = col; g.fillRect(x + Math.round(fx * w), y + Math.round(fy * h), Math.max(1, Math.round(fw * w)), Math.max(1, Math.round(fh * h))); };
  switch (id) {
    case 'italia': v(['#009246', '#f1f2f1', '#ce2b37']); break;
    case 'francia': v(['#0055a4', '#f1f2f1', '#ef4135']); break;
    case 'germania': o(['#111', '#dd0000', '#ffce00']); break;
    case 'russia': o(['#f1f2f1', '#0039a6', '#d52b1e']); break;
    case 'spagna': o(['#aa151b', '#f1bf00', '#f1bf00', '#aa151b']); break;
    case 'usa':
      for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? '#f1f2f1' : '#b22234'; g.fillRect(x, y + Math.floor(i * h / 7), w, Math.ceil(h / 7)); }
      px(0, 0, .42, .55, '#3c3b6e'); break;
    case 'cina': g.fillStyle = '#de2910'; g.fillRect(x, y, w, h); px(.1, .15, .16, .24, '#ffde00'); break;
    case 'arabia': g.fillStyle = '#006c35'; g.fillRect(x, y, w, h); px(.2, .62, .6, .08, '#f1f2f1'); px(.25, .3, .5, .12, '#f1f2f1'); break;
    case 'corea': o(['#024fa2', '#f1f2f1', '#be0000', '#be0000', '#f1f2f1', '#024fa2']); px(.22, .3, .2, .4, '#f1f2f1'); px(.26, .37, .12, .26, '#be0000'); break;
  }
}

/* ============================================================
   LAPTOP · BERSAGLIO
   ============================================================ */
function avviaBersaglio() {
  const cv = document.getElementById('screen'), g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const W = 320, H = 240, CX = 160, CY = 116;
  const WIN = { x: 44, y: 8, w: 232, h: 212 };

  Lettore.init();
  const S = {
    scena: 'titolo', t: 0, sel: 0, mio: null, avv: null,
    ruota: 0, vel: .7, voli: [], piantate: [], restanti: 0, influenza: 0,
    crash: null, meteo: {}, telefono: false, mondo: carica(),
  };
  function carica() { try { return JSON.parse(localStorage.getItem('gl-mondo')) || { conquiste: {}, reagenti: [] }; } catch (e) { return { conquiste: {}, reagenti: [] }; } }
  function salva() { try { localStorage.setItem('gl-mondo', JSON.stringify(S.mondo)); } catch (e) {} }

  // --- sprite + maschere di collisione
  const SPR = {};
  PAESI.forEach(id => {
    const im = new Image(); SPR[id] = { im, ok: false, mask: null };
    im.onload = () => {
      SPR[id].ok = true;
      try { const c = document.createElement('canvas'); c.width = im.width; c.height = im.height; const cg = c.getContext('2d'); cg.drawImage(im, 0, 0); SPR[id].mask = cg.getImageData(0, 0, im.width, im.height); }
      catch (e) { SPR[id].mask = null; } // file aperto in locale: collisione approssimata
    };
    im.src = 'img/' + id + '.png';
  });

  // --- dati reali
  fetch('data/prezzi.json').then(r => r.json()).then(d => PREZZI = d).catch(() => {});
  fetch('https://open.er-api.com/v6/latest/EUR').then(r => r.json()).then(d => { if (d && d.rates) CAMBI = d.rates; }).catch(() => {});
  PAESI.forEach(id => {
    const n = NAZ[id];
    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${n.lat}&longitude=${n.lon}&current=cloud_cover,precipitation`)
      .then(r => r.json()).then(d => { if (d.current) S.meteo[id] = { nuvole: d.current.cloud_cover, pioggia: d.current.precipitation }; }).catch(() => {});
  });
  const costo = id => { const p = PREZZI.paesi[id]; if (!p) return null; return p.litro * CONFIG.litriPieno / (CAMBI[p.valuta] || 1); };
  const ora = (id, conMinuti) => {
    const f = new Intl.DateTimeFormat('it-IT', { timeZone: NAZ[id].tz, hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
    return conMinuti ? f : Number(f.slice(0, 2)) % 24;
  };

  // --- live della piazza
  let liveAttuale = null;
  function live(id) {
    const f = document.getElementById('live'), v = id && NAZ[id].live;
    if (v === liveAttuale) return; liveAttuale = v;
    if (v) { f.src = `https://www.youtube.com/embed/${v}?autoplay=1&mute=1&controls=0&playsinline=1&loop=1`; f.style.display = 'block'; }
    else { f.src = 'about:blank'; f.style.display = 'none'; }
  }

  // --- telefono (PeerJS)
  const codice = String(Math.floor(1000 + Math.random() * 9000));
  try {
    const peer = new Peer('grandelancio-' + codice);
    peer.on('open', () => {
      const url = location.origin + location.pathname + '?ruolo=telefono&id=' + codice;
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      document.getElementById('qr').innerHTML = qr.createImgTag(4, 0); aggiornaQR(); console.log('Telefono:', url);
    });
    peer.on('connection', conn => {
      conn.on('open', () => { S.telefono = true; aggiornaQR(); });
      conn.on('data', d => {
        if (d.tipo === 'tocco') premi();
        if (d.tipo === 'lancio' && S.scena === 'duello') lancia(CX + d.ax * 100, CY + 95 - d.ay * 190);
        if (d.tipo === 'scelta') sposta(d.dir);
      });
      conn.on('close', () => { S.telefono = false; aggiornaQR(); });
    });
  } catch (e) { console.warn('PeerJS non disponibile: modalità solitaria'); }
  function aggiornaQR() { const b = document.getElementById('qr'); b.style.display = (S.scena === 'titolo' && !S.telefono && b.innerHTML) ? 'block' : 'none'; }

  // --- input laptop
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
  cv.addEventListener('pointerdown', e => {
    const p = pos(e);
    if (S.scena === 'duello') return lancia(p.x, p.y);
    if (S.scena === 'paese' || S.scena === 'sfidante') {
      const i = Math.floor((p.x - 8) / 34);
      if (i >= 0 && i < 9 && p.y > 60 && p.y < 200) { if (i === S.sel) premi(); else S.sel = i; return; }
    }
    premi();
  });
  addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') sposta(1);
    if (e.key === 'ArrowLeft') sposta(-1);
    if (e.key === 'Enter' || e.key === ' ') premi();
  });
  function sposta(d) { if (S.scena === 'paese' || S.scena === 'sfidante') S.sel = (S.sel + d + 9) % 9; }

  function vai(sc) { S.scena = sc; S.t = 0; aggiornaQR(); Lettore.modo(sc); if (sc === 'crash') Lettore.pausa(); }
  function premi() {
    const sc = S.scena;
    if (sc === 'titolo') { Lettore.play(); S.sel = 0; vai('paese'); }
    else if (sc === 'paese') { S.mio = PAESI[S.sel]; S.sel = S.mondo.reagenti.length ? PAESI.indexOf(S.mondo.reagenti[0]) : 0; vai('sfidante'); }
    else if (sc === 'sfidante') { if (PAESI[S.sel] === S.mio) return; S.avv = PAESI[S.sel]; vai('pompe'); }
    else if (sc === 'pompe' && S.t > 1) duello();
    else if (sc === 'crash' && S.t > 1.2) duello();
    else if (sc === 'vittoria' && S.t > 1.2) vai(Object.keys(S.mondo.conquiste).length >= 8 ? 'finale' : 'sfidante');
    else if (sc === 'finale' && S.t > 2) { S.mondo = { conquiste: {}, reagenti: [] }; salva(); vai('titolo'); }
  }

  function duello() {
    vai('duello'); if (Lettore.avviato) Lettore.play();
    S.voli = []; S.piantate = []; S.restanti = CONFIG.bandiere; S.influenza = 0; S.ruota = 0;
    const cm = costo(S.mio), ca = costo(S.avv);
    S.vantaggio = ca === null || (cm !== null && cm >= ca); // chi paga di più il pieno parte avvantaggiato: la ruota parte ferma
    S.attesa = S.vantaggio ? 1.5 : 0;
  }

  // --- fisica del lancio
  function lancia(tx, ty) {
    if (S.restanti <= 0) return;
    S.restanti--;
    const peso = (PREZZI.brent_usd - 60) * .35;
    S.voli.push({ tx: tx + (Math.random() - .5) * 5, ty: ty + peso + (Math.random() - .5) * 5, t: 0 });
  }
  const scalaLeader = () => { const s = SPR[S.avv]; return s && s.ok ? 118 / s.im.height : 1; };
  function locale(x, y) { const dx = x - CX, dy = y - CY, c = Math.cos(-S.ruota), s = Math.sin(-S.ruota); return { x: dx * c - dy * s, y: dx * s + dy * c }; }
  function schermo(l) { const c = Math.cos(S.ruota), s = Math.sin(S.ruota); return { x: CX + l.x * c - l.y * s, y: CY + l.x * s + l.y * c }; }
  function toccaLeader(l) {
    const sp = SPR[S.avv]; if (!sp || !sp.ok) return Math.abs(l.x) < 25 && Math.abs(l.y) < 55;
    const k = scalaLeader(), sx = Math.floor(l.x / k + sp.im.width / 2), sy = Math.floor(l.y / k + sp.im.height / 2);
    if (sx < 0 || sy < 0 || sx >= sp.im.width || sy >= sp.im.height) return false;
    if (!sp.mask) return true;
    // margine di 2 pixel: sfiorare è bravura, toccare è errore
    for (let oy = -2; oy <= 2; oy += 2) for (let ox = -2; ox <= 2; ox += 2) {
      const xx = sx + Math.round(ox / k), yy = sy + Math.round(oy / k);
      if (xx >= 0 && yy >= 0 && xx < sp.im.width && yy < sp.im.height && sp.mask.data[(yy * sp.im.width + xx) * 4 + 3] > 40) return true;
    }
    return false;
  }
  function settori() {
    const cop = new Array(CONFIG.settori).fill(false);
    S.piantate.forEach(p => { const a = (Math.atan2(p.l.y, p.l.x) + Math.PI * 2) % (Math.PI * 2); cop[Math.floor(a / (Math.PI * 2) * CONFIG.settori)] = true; });
    return cop;
  }

  function aggiorna(dt) {
    S.t += dt;
    if (S.scena !== 'duello') return;
    if (S.attesa > 0) S.attesa -= dt;
    else { S.vel = .55 + Math.sin(S.t * .45) * .9; S.ruota += S.vel * dt; }
    for (const v of S.voli) {
      v.t += dt / .42;
      if (v.t < 1 || v.fatto) continue;
      v.fatto = true;
      const l = locale(v.tx, v.ty);
      if (toccaLeader(l)) {
        S.crash = { x: v.tx, y: v.ty, crepe: Array.from({ length: 14 }, () => ({ a: Math.random() * Math.PI * 2, r: 30 + Math.random() * 140, k: Math.random() })) };
        vai('crash'); return;
      }
      const d = Math.hypot(l.x, l.y);
      if (d <= CONFIG.raggio) { S.piantate.push({ l, t: 0 }); S.influenza += Math.max(0, Math.round(100 - d)); }
    }
    S.voli = S.voli.filter(v => !v.fatto);
    S.piantate.forEach(p => p.t += dt);
    if (settori().every(Boolean)) {
      S.mondo.conquiste[S.avv] = S.mio;
      S.mondo.reagenti = REAZIONI[S.avv].filter(id => !S.mondo.conquiste[id] && id !== S.mio);
      salva(); vai('vittoria');
    } else if (S.restanti === 0 && !S.voli.length) { S.crash = null; vai('crash'); }
  }

  /* ---------------- disegno ---------------- */
  function sfondo(id) {
    live(id);
    if (id && NAZ[id].live) { g.clearRect(0, 0, W, H); return; }
    const h = ora(id || 'italia'), m = S.meteo[id] || { nuvole: 30, pioggia: 0 };
    const giorno = h >= 7 && h < 18, tram = (h >= 17 && h < 20) || (h >= 6 && h < 8);
    const a = giorno ? [70, 130, 220] : tram ? [210, 110, 90] : [12, 16, 48], b = giorno ? [170, 210, 240] : tram ? [245, 180, 110] : [40, 32, 80];
    for (let y = 0; y < H; y += 3) { const k = y / H, d = ((y / 3) % 2) * .04; g.fillStyle = `rgb(${a.map((c, i) => Math.round(c + (b[i] - c) * Math.min(1, k + d))).join(',')})`; g.fillRect(0, y, W, 3); }
    g.fillStyle = giorno ? 'rgba(245,245,255,.85)' : 'rgba(90,90,120,.85)';
    for (let i = 0; i < Math.round(m.nuvole / 12); i++) { const x = (i * 83 + S.t * 3) % (W + 80) - 40, y = 14 + (i * 29) % 70; g.fillRect(Math.round(x), y, 40, 9); g.fillRect(Math.round(x) + 10, y - 6, 22, 7); }
    // città generica low-poly
    g.fillStyle = giorno ? '#6d7f8f' : '#1c1a2e';
    for (let i = 0; i < 18; i++) { const w = 12 + (i * 7) % 14, hh = 20 + (i * 37) % 46; g.fillRect(i * 19 - 4, 196 - hh, w, hh + 30); }
    g.fillStyle = giorno ? '#59705a' : '#151a18'; g.fillRect(0, 196, W, 44);
    if (!giorno) { g.fillStyle = '#ffd36b'; for (let i = 0; i < 40; i++) g.fillRect((i * 41) % W, 150 + (i * 17) % 44, 2, 2); }
    if (m.pioggia > 0) { g.fillStyle = 'rgba(190,210,255,.55)'; for (let i = 0; i < 90; i++) g.fillRect((i * 53 + S.t * 30) % W, (i * 31 + S.t * 230) % H, 1, 4); }
  }

  function desktop(sfondoDi) {
    sfondo(sfondoDi);
    // icone delle nazioni
    PAESI.forEach((id, i) => {
      const x = 6, y = 6 + i * 23, cq = S.mondo.conquiste[id], re = S.mondo.reagenti.includes(id);
      if (re && Math.floor(S.t * 3) % 2) { g.fillStyle = 'rgba(80,140,255,.6)'; g.fillRect(x - 2, y - 2, 30, 22); }
      testina(id, x + 4, y, 16);
      bandiera(g, cq || id, x + 14, y + 10, 14, 9);
      if (cq) { g.strokeStyle = '#ffe680'; g.lineWidth = 1; g.strokeRect(x + 13.5, y + 9.5, 15, 10); }
    });
    // barra delle applicazioni
    g.fillStyle = '#1f4fb8'; g.fillRect(0, 226, W, 14);
    g.fillStyle = '#3c7be0'; g.fillRect(0, 226, W, 2);
    g.fillStyle = '#2f9e3a'; g.fillRect(0, 226, 42, 14); g.fillStyle = '#4ccf58'; g.fillRect(0, 226, 42, 2);
    if (S.mio) bandiera(g, S.mio, 8, 229, 13, 9); else { g.fillStyle = '#fff'; g.fillRect(10, 230, 4, 4); g.fillRect(15, 230, 4, 4); g.fillRect(10, 235, 4, 4); g.fillRect(15, 235, 4, 4); }
    g.fillStyle = '#1a8fd8'; g.fillRect(W - 40, 226, 40, 14);
    numero(ora(S.avv || 'italia', true), W - 20, 236, '#fff');
  }

  function testina(id, x, y, h) {
    const sp = SPR[id]; if (!sp.ok) return;
    const k = h * 2.6 / sp.im.height; // solo la parte alta: la testa
    g.save(); g.beginPath(); g.rect(x - 8, y, 16, h); g.clip();
    g.drawImage(sp.im, x - sp.im.width * k / 2, y, sp.im.width * k, sp.im.height * k); g.restore();
  }

  function finestra(x, y, w, h, flagId) {
    g.fillStyle = '#0a246a'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
    g.fillStyle = '#245edb'; g.fillRect(x, y, w, 12); g.fillStyle = '#3a7bf0'; g.fillRect(x, y, w, 3);
    if (flagId) bandiera(g, flagId, x + 4, y + 2, 12, 8);
    g.fillStyle = '#d9472b'; g.fillRect(x + w - 12, y + 2, 9, 8);
    g.fillStyle = '#fff'; g.fillRect(x + w - 10, y + 4, 1, 1); g.fillRect(x + w - 9, y + 5, 3, 2); g.fillRect(x + w - 6, y + 4, 1, 1); g.fillRect(x + w - 10, y + 7, 1, 1); g.fillRect(x + w - 6, y + 7, 1, 1);
    g.fillStyle = '#245edb'; g.fillRect(x, y + 12, 2, h - 12); g.fillRect(x + w - 2, y + 12, 2, h - 12); g.fillRect(x, y + h - 2, w, 2);
  }

  function ruota() {
    const R = CONFIG.raggio + 6;
    g.save(); g.translate(CX, CY); g.rotate(S.ruota);
    // cerchi concentrici bianchi e rossi
    for (let i = 7; i >= 0; i--) { g.fillStyle = i % 2 ? '#f4efe6' : '#d32626'; g.beginPath(); g.arc(0, 0, R * (i + 1) / 8, 0, Math.PI * 2); g.fill(); }
    // spicchi a raggiera per vedere la rotazione
    g.fillStyle = 'rgba(0,0,0,.08)';
    for (let i = 0; i < 12; i += 2) { g.beginPath(); g.moveTo(0, 0); g.arc(0, 0, R, i * Math.PI / 6, (i + 1) * Math.PI / 6); g.fill(); }
    // bordo con lampadine
    g.strokeStyle = '#c8a14a'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, R, 0, Math.PI * 2); g.stroke();
    for (let i = 0; i < 20; i++) { const a = i / 20 * Math.PI * 2; g.fillStyle = (Math.floor(S.t * 5) + i) % 2 ? '#fff3a0' : '#8a6a20'; g.fillRect(Math.round(Math.cos(a) * R) - 1, Math.round(Math.sin(a) * R) - 1, 3, 3); }
    // leader legato alla ruota
    const sp = SPR[S.avv];
    if (sp && sp.ok) { const k = scalaLeader(), jx = (Math.random() - .5) * .6; g.drawImage(sp.im, -sp.im.width * k / 2 + jx, -sp.im.height * k / 2, sp.im.width * k, sp.im.height * k); }
    g.restore();
    // perno
    g.fillStyle = '#4a3a20'; g.fillRect(CX - 3, CY + R - 2, 6, 34);
  }

  function asta(x, y, id, scala, t) {
    const s = scala || 1;
    g.fillStyle = '#e8e0c8'; g.fillRect(Math.round(x), Math.round(y - 11 * s), 1, Math.round(12 * s));
    bandiera(g, id, x + 1, y - 11 * s + Math.round(Math.sin((t || 0) * 6 + x) * 1), 12 * s, 8 * s);
  }

  function numero(n, x, y, col) { g.fillStyle = col || '#ffe680'; g.font = '8px monospace'; g.textAlign = 'center'; g.fillText(String(n), x, y); }

  function barile(x, y, liv) {
    g.fillStyle = '#222'; g.fillRect(x - 8, y - 22, 16, 24);
    g.fillStyle = '#1a1208'; g.fillRect(x - 6, y - 20 + Math.round(20 * (1 - liv)), 12, Math.round(20 * liv));
    g.fillStyle = '#c8a14a'; g.fillRect(x - 8, y - 16, 16, 1); g.fillRect(x - 8, y - 6, 16, 1);
  }

  function pompa(x, id, val, accesa) {
    g.fillStyle = accesa && Math.floor(S.t * 4) % 2 ? '#ffe680' : '#c0392b'; g.fillRect(x - 22, 70, 44, 110);
    g.fillStyle = '#111'; g.fillRect(x - 16, 80, 32, 22);
    if (val === null) { g.fillStyle = '#000'; g.fillRect(x - 20, 86, 40, 10); } // dato censurato
    else numero(Math.round(val), x, 94);
    g.fillStyle = '#333'; g.fillRect(x - 16, 110, 32, 60);
    const h = val === null ? 0 : Math.min(58, Math.round(val / 160 * 58 * Math.min(1, S.t)));
    g.fillStyle = '#d9a31f'; g.fillRect(x - 15, 169 - h, 30, h);
    g.fillStyle = '#222'; g.fillRect(x + 22, 90, 6, 4); g.fillRect(x + 26, 90, 2, 50);
    bandiera(g, id, x - 14, 48, 28, 18);
  }

  function gruppo(evidenzia) {
    // foto di gruppo: gradiente ciano-viola, divano low-poly
    for (let y = 0; y < 226; y += 2) { const k = y / 226; g.fillStyle = `rgb(${Math.round(90 + 90 * k)},${Math.round(200 - 120 * k)},${Math.round(230 - 30 * k)})`; g.fillRect(0, y, W, 2); }
    g.fillStyle = '#7b2f6e'; g.beginPath(); g.moveTo(4, 150); g.lineTo(316, 150); g.lineTo(306, 186); g.lineTo(14, 186); g.fill();
    g.fillStyle = '#9a3f8a'; g.fillRect(10, 122, 300, 30);
    PAESI.forEach((id, i) => {
      const sp = SPR[id], x = 8 + i * 34 + 17, sel = i === S.sel, cq = S.mondo.conquiste[id];
      const h = sel ? 84 : 70, y = 170 - h + (sel ? Math.round(Math.sin(S.t * 8) * 2) : 0);
      const spento = evidenzia && (id === S.mio);
      if (sel) { g.fillStyle = 'rgba(255,240,140,.5)'; g.fillRect(x - 17, y - 4, 34, h + 8); }
      if (evidenzia && S.mondo.reagenti.includes(id) && Math.floor(S.t * 3) % 2) { g.strokeStyle = '#3a7bf0'; g.lineWidth = 2; g.strokeRect(x - 16, y - 3, 32, h + 6); }
      if (sp.ok) { const k = h / sp.im.height, w = Math.min(34, sp.im.width * k); g.globalAlpha = spento ? .3 : 1; g.drawImage(sp.im, x - sp.im.width * k / 2, y, sp.im.width * k, h); g.globalAlpha = 1; }
      bandiera(g, id, x - 7, 192, 14, 9);
      if (cq) bandiera(g, cq, x - 6, y - 12, 12, 8);
    });
  }

  function crash() {
    if (S.crash && S.t < .7) {
      // vetro che si crepa
      g.strokeStyle = 'rgba(255,255,255,.9)'; g.lineWidth = 1;
      S.crash.crepe.forEach(c => { const r = c.r * Math.min(1, S.t * 3); g.beginPath(); g.moveTo(S.crash.x, S.crash.y); g.lineTo(S.crash.x + Math.cos(c.a) * r * .5 + c.k * 6, S.crash.y + Math.sin(c.a) * r * .5); g.lineTo(S.crash.x + Math.cos(c.a) * r, S.crash.y + Math.sin(c.a) * r); g.stroke(); });
      g.fillStyle = '#0000aa'; g.beginPath(); g.arc(S.crash.x, S.crash.y, 6 + S.t * 30, 0, Math.PI * 2); g.fill();
      return;
    }
    // schermata blu: solo numeri e blocchi, nessun testo
    g.fillStyle = '#0000aa'; g.fillRect(0, 0, W, H);
    g.fillStyle = '#aaaaaa'; g.fillRect(132, 40, 56, 9);
    g.fillStyle = '#0000aa'; g.fillRect(138, 42, 44, 5);
    for (let i = 0; i < 6; i++) { g.fillStyle = '#fff'; g.fillRect(40, 70 + i * 14, 120 + ((i * 53) % 110), 4); }
    numero('0x' + (S.avv || '').length.toString(16).padStart(8, '0').toUpperCase(), 160, 180, '#fff');
    if (S.mio) bandiera(g, S.mio, 140, 196, 18, 12);
    if (S.avv) bandiera(g, S.avv, 162, 196, 18, 12);
    if (S.t > 1.2 && Math.floor(S.t * 2) % 2) { g.fillStyle = '#fff'; g.fillRect(156, 216, 8, 8); }
  }

  function disegna() {
    const sc = S.scena;
    if (sc === 'titolo') {
      desktop('italia');
      finestra(58, 40, 170, 150, null);
      g.fillStyle = 'rgba(244,239,230,.95)'; g.fillRect(60, 52, 166, 136);
      for (let i = 4; i >= 0; i--) { g.fillStyle = i % 2 ? '#f4efe6' : '#d32626'; g.beginPath(); g.arc(143, 118, 12 + i * 11, 0, Math.PI * 2); g.fill(); }
      asta(133, 112, 'italia', 1.4, S.t); asta(155, 128, 'usa', 1.4, S.t); asta(131, 140, 'cina', 1.4, S.t);
      if (Math.floor(S.t * 2) % 2) { g.fillStyle = '#245edb'; g.beginPath(); g.moveTo(136, 172); g.lineTo(136, 186); g.lineTo(150, 179); g.fill(); }
      return;
    }
    if (sc === 'paese' || sc === 'sfidante') { gruppo(sc === 'sfidante'); desktopBarra(); if (sc === 'paese') { const b = PAESI[S.sel]; bandiera(g, b, 140, 18, 40, 27); } else if (S.mio) { bandiera(g, S.mio, 120, 22, 28, 19); g.fillStyle = '#fff'; g.fillRect(156, 30, 8, 3); bandiera(g, PAESI[S.sel], 172, 22, 28, 19); } return; }
    if (sc === 'pompe') {
      desktop(S.avv); finestra(WIN.x, WIN.y, WIN.w, WIN.h, S.avv);
      g.fillStyle = 'rgba(10,20,60,.75)'; g.fillRect(WIN.x + 2, WIN.y + 12, WIN.w - 4, WIN.h - 14);
      const a = costo(S.mio), b = costo(S.avv);
      pompa(115, S.mio, a, b === null || (a !== null && a >= b)); pompa(205, S.avv, b, b !== null && (a === null || b > a));
      barile(160, 200, Math.min(1, PREZZI.brent_usd / 120));
      if (S.t > 1 && Math.floor(S.t * 2) % 2) { g.fillStyle = '#ffe680'; g.beginPath(); g.moveTo(154, 206); g.lineTo(154, 218); g.lineTo(166, 212); g.fill(); }
      return;
    }
    if (sc === 'duello' || (sc === 'crash' && S.crash && S.t < .7)) {
      desktop(S.avv);
      finestra(WIN.x, WIN.y, WIN.w, WIN.h, S.avv);
      ruota();
      S.piantate.forEach(p => { const s = schermo(p.l); asta(s.x, s.y, S.mio, 1, p.t); });
      S.voli.forEach(v => { const t = Math.min(1, v.t), x = CX + (v.tx - CX) * t, y = 250 + (v.ty - 250) * t - Math.sin(t * Math.PI) * 40; asta(x, y, S.mio, 2.2 - t * 1.2, S.t); });
      if (sc === 'duello') hud(); else crash();
      return;
    }
    if (sc === 'crash') { crash(); return; }
    if (sc === 'vittoria') { desktop(S.avv); const s = Math.min(1, S.t * 1.5); bandiera(g, S.mio, 160 - 60 * s, 118 - 40 * s, 120 * s, 80 * s); return; }
    if (sc === 'finale') { live(null); for (let y = 0; y < 226; y += 20) for (let x = 0; x < W; x += 30) bandiera(g, S.mio, x + ((y / 20) % 2) * 15 - 15, y, 28, 18); desktopBarra(); }
  }
  function desktopBarra() { live(null); g.fillStyle = '#1f4fb8'; g.fillRect(0, 226, W, 14); g.fillStyle = '#2f9e3a'; g.fillRect(0, 226, 42, 14); if (S.mio) bandiera(g, S.mio, 8, 229, 13, 9); }

  function hud() {
    // bandiere rimaste (in basso, dentro la finestra)
    for (let i = 0; i < CONFIG.bandiere; i++) { if (i < S.restanti) bandiera(g, S.mio, WIN.x + 6 + i * 15, WIN.y + WIN.h - 14, 12, 8); else { g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(WIN.x + 6 + i * 15, WIN.y + WIN.h - 14, 12, 8); } }
    // spicchi del cerchio
    settori().forEach((ok, i) => {
      const a0 = i / CONFIG.settori * Math.PI * 2 + S.ruota, a1 = (i + 1) / CONFIG.settori * Math.PI * 2 + S.ruota;
      g.strokeStyle = ok ? 'rgba(255,230,90,.95)' : 'rgba(255,255,255,.25)'; g.lineWidth = 3;
      g.beginPath(); g.arc(CX, CY, CONFIG.raggio + 14, a0 + .06, a1 - .06); g.stroke();
    });
    numero(S.influenza, WIN.x + WIN.w - 20, WIN.y + WIN.h - 7);
    barile(WIN.x + WIN.w - 12, WIN.y + 40, Math.min(1, PREZZI.brent_usd / 120));
  }

  let prima = performance.now();
  (function ciclo(ora) { const dt = Math.min(.05, ((ora || prima) - prima) / 1000); prima = ora || prima; aggiorna(dt); disegna(); requestAnimationFrame(ciclo); })();
}

/* ============================================================
   TELEFONO · CONTROLLER
   ============================================================ */
function avviaTelefono() {
  document.getElementById('stage').style.display = 'none';
  const pad = document.getElementById('pad'); pad.style.display = 'block';
  const cv = document.getElementById('padc'), g = cv.getContext('2d');
  let conn = null, connesso = false, inizio = null, paese = 0, scia = 0;
  const id = new URLSearchParams(location.search).get('id');
  function dim() { cv.width = 160; cv.height = Math.round(160 * innerHeight / innerWidth); g.imageSmoothingEnabled = false; }
  dim(); addEventListener('resize', dim);
  try { const peer = new Peer(); peer.on('open', () => { conn = peer.connect('grandelancio-' + id); conn.on('open', () => connesso = true); conn.on('close', () => connesso = false); }); } catch (e) {}
  const invia = d => { if (conn && connesso) conn.send(d); };
  cv.addEventListener('touchstart', e => { const t = e.touches[0]; inizio = { x: t.clientX, y: t.clientY }; e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchend', e => {
    if (!inizio) return;
    const t = e.changedTouches[0], dx = t.clientX - inizio.x, dy = t.clientY - inizio.y;
    if (dy < -40) { invia({ tipo: 'lancio', ax: Math.max(-1, Math.min(1, dx / (innerWidth * .5))), ay: Math.max(0, Math.min(1, -dy / (innerHeight * .75))) }); scia = 1; }
    else if (Math.abs(dx) > 40) { const dir = dx > 0 ? 1 : -1; paese = (paese + dir + 9) % 9; invia({ tipo: 'scelta', dir }); }
    else invia({ tipo: 'tocco' });
    inizio = null;
  });
  (function disegna() {
    const W = cv.width, H = cv.height;
    g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
    g.fillStyle = connesso ? '#3c3' : '#c33'; g.fillRect(W - 10, 6, 5, 5);
    const y = H * .45 - scia * H * .4;
    g.fillStyle = '#e8e0c8'; g.fillRect(W / 2 - 1, y, 2, 60);
    bandiera(g, PAESI[paese], W / 2 + 1, y, 44, 30);
    g.fillStyle = 'rgba(255,230,128,.5)'; g.beginPath(); g.moveTo(W / 2, H - 40); g.lineTo(W / 2 - 12, H - 24); g.lineTo(W / 2 + 12, H - 24); g.fill();
    scia = Math.max(0, scia - .06);
    requestAnimationFrame(disegna);
  })();
}
</script>
