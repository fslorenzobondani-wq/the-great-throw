<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Il Grande Lancio</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  #stage { position: absolute; inset: 0; margin: auto; aspect-ratio: 4 / 3; max-width: 100vw; max-height: 100vh; overflow: hidden; background: #000; }
  #live { position: absolute; inset: -6%; width: 112%; height: 112%; border: 0; pointer-events: none;
          filter: saturate(1.6) contrast(1.25) brightness(0.9); }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
  #fx { position: absolute; inset: 0; pointer-events: none;
        background:
          repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 1px, transparent 1px 3px),
          radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%); }
  #qr { position: absolute; right: 2%; bottom: 3%; width: 18%; background: #fff; padding: 1%; display: none; image-rendering: pixelated; }
  #qr img { width: 100%; display: block; }
  /* telefono */
  #pad { position: absolute; inset: 0; display: none; background: #111; }
  #pad canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <iframe id="live" allow="autoplay; encrypted-media" style="display:none"></iframe>
  <canvas id="screen" width="320" height="240"></canvas>
  <div id="fx"></div>
  <div id="qr"></div>
</div>
<div id="pad"><canvas id="padc"></canvas></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ============================================================
   IL GRANDE LANCIO · v2
   Laptop = bersaglio (index.html)
   Telefono = controller (index.html?ruolo=telefono&id=XXXX)
   ============================================================ */

const CONFIG = {
  // ID di un video YouTube in diretta della piazza (la parte dopo "watch?v=").
  // Vuoto = sfondo PS1 sincronizzato su ora e meteo reali di Roma.
  live: { roma: '' },
  litriPieno: 50,
  bandierePerDuello: 7,
  settori: 6,          // spicchi da coprire per chiudere il cerchio
  raggioCerchio: 58,   // pixel (su 320x240)
};

// Prezzi di riserva se data/prezzi.json non si carica (es. file aperto in locale)
let PREZZI = {
  aggiornato: '2026-11-17', brent_usd: 65,
  paesi: {
    italia: { valuta: 'EUR', litro: 1.75 }, ue: { valuta: 'EUR', litro: 1.70 },
    usa: { valuta: 'USD', litro: 0.85 }, ungheria: { valuta: 'HUF', litro: 620 },
    russia: { valuta: 'RUB', litro: 62 }, cina: { valuta: 'CNY', litro: 7.6 },
    arabia: { valuta: 'SAR', litro: 2.33 },
  }
};
// Cambi di riserva (1 EUR = x valuta)
let CAMBI = { EUR: 1, USD: 1.08, HUF: 395, RUB: 100, CNY: 7.8, SAR: 4.05 };

const PAESI = ['italia', 'ue', 'usa', 'ungheria', 'russia', 'cina', 'arabia'];

// Personaggi: sprite = PNG del character sheet (vista frontale). Vuoto = segnaposto.
const LEADER = {
  italia: { sprite: 'img/italia.png', capelli: '#3a2a1c', abito: '#1d2440', piazza: 'roma' },
};

const ruolo = new URLSearchParams(location.search).get('ruolo');
if (ruolo === 'telefono') avviaTelefono(); else avviaBersaglio();

/* ============================================================
   BANDIERE (disegnate a pixel, senza testo)
   ============================================================ */
function bandiera(g, id, x, y, w, h) {
  x = Math.round(x); y = Math.round(y);
  const v = (cols) => cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(x + Math.floor(i * w / cols.length), y, Math.ceil(w / cols.length), h); });
  const o = (cols) => cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(x, y + Math.floor(i * h / cols.length), w, Math.ceil(h / cols.length)); });
  if (id === 'italia') v(['#009246', '#f1f2f1', '#ce2b37']);
  else if (id === 'ungheria') o(['#ce2939', '#f1f2f1', '#477050']);
  else if (id === 'russia') o(['#f1f2f1', '#0039a6', '#d52b1e']);
  else if (id === 'ue') {
    g.fillStyle = '#003399'; g.fillRect(x, y, w, h);
    g.fillStyle = '#ffcc00';
    for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; g.fillRect(Math.round(x + w / 2 + Math.cos(a) * h * .32) - 1, Math.round(y + h / 2 + Math.sin(a) * h * .32) - 1, 2, 2); }
  } else if (id === 'usa') {
    for (let i = 0; i < 7; i++) { g.fillStyle = i % 2 ? '#f1f2f1' : '#b22234'; g.fillRect(x, y + Math.floor(i * h / 7), w, Math.ceil(h / 7)); }
    g.fillStyle = '#3c3b6e'; g.fillRect(x, y, Math.round(w * .42), Math.round(h * .55));
  } else if (id === 'cina') {
    g.fillStyle = '#de2910'; g.fillRect(x, y, w, h);
    g.fillStyle = '#ffde00'; g.fillRect(x + Math.round(w * .12), y + Math.round(h * .18), Math.max(2, Math.round(w * .14)), Math.max(2, Math.round(h * .22)));
  } else if (id === 'arabia') {
    g.fillStyle = '#006c35'; g.fillRect(x, y, w, h);
    g.fillStyle = '#f1f2f1'; g.fillRect(x + Math.round(w * .2), y + Math.round(h * .62), Math.round(w * .6), Math.max(1, Math.round(h * .08)));
    g.fillRect(x + Math.round(w * .25), y + Math.round(h * .3), Math.round(w * .5), Math.max(1, Math.round(h * .12)));
  }
}

/* ============================================================
   LAPTOP · BERSAGLIO
   ============================================================ */
function avviaBersaglio() {
  const cv = document.getElementById('screen');
  const g = cv.getContext('2d');
  g.imageSmoothingEnabled = false;
  const W = 320, H = 240;

  // --- stato
  const S = {
    scena: 'titolo', t: 0, sel: 0, paese: null,
    leader: { x: 160, vx: 0, fase: 0, attesa: 0 },
    voli: [], piantate: [], restanti: 0, influenza: 0, flash: 0, fineT: 0,
    meteo: { nuvole: 30, pioggia: 0 }, telefono: false, sblocchi: carica(),
  };
  const BOARD = { x: 64, y: 22, w: 192, h: 186 };

  function carica() { try { return JSON.parse(localStorage.getItem('gl-sblocchi') || '{}'); } catch (e) { return {}; } }
  function salva() { try { localStorage.setItem('gl-sblocchi', JSON.stringify(S.sblocchi)); } catch (e) {} }

  // --- dati reali
  fetch('data/prezzi.json').then(r => r.json()).then(d => { PREZZI = d; }).catch(() => {});
  fetch('https://open.er-api.com/v6/latest/EUR').then(r => r.json()).then(d => { if (d && d.rates) CAMBI = d.rates; }).catch(() => {});
  fetch('https://api.open-meteo.com/v1/forecast?latitude=41.9&longitude=12.5&current=cloud_cover,precipitation')
    .then(r => r.json()).then(d => { if (d.current) { S.meteo.nuvole = d.current.cloud_cover; S.meteo.pioggia = d.current.precipitation; } }).catch(() => {});

  // sprite del leader (se l'immagine esiste)
  const sprite = new Image(); let spriteOk = false;
  sprite.onload = () => spriteOk = true;
  sprite.src = LEADER.italia.sprite;

  // live YouTube
  if (CONFIG.live.roma) {
    const f = document.getElementById('live');
    f.src = `https://www.youtube.com/embed/${CONFIG.live.roma}?autoplay=1&mute=1&controls=0&playsinline=1`;
    f.style.display = 'block';
  }

  function costoPieno(id) {
    const p = PREZZI.paesi[id]; const r = CAMBI[p.valuta] || 1;
    return p.litro * CONFIG.litriPieno / r; // in EUR
  }
  function oraRoma() { return Number(new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: 'numeric', hour12: false }).format(new Date())) % 24; }

  // --- collegamento telefono (PeerJS)
  const codice = String(Math.floor(1000 + Math.random() * 9000));
  try {
    const peer = new Peer('grandelancio-' + codice);
    peer.on('open', () => {
      const url = location.origin + location.pathname + '?ruolo=telefono&id=' + codice;
      const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
      const box = document.getElementById('qr'); box.innerHTML = qr.createImgTag(4, 0); box.dataset.url = url;
      aggiornaQR();
      console.log('Telefono:', url);
    });
    peer.on('connection', conn => {
      conn.on('open', () => { S.telefono = true; aggiornaQR(); });
      conn.on('data', d => {
        if (d.tipo === 'tocco') premi();
        if (d.tipo === 'lancio' && S.scena === 'duello') lancia(160 + d.ax * 92, 200 - d.ay * 175);
        if (d.tipo === 'scelta' && S.scena === 'scelta') S.sel = (S.sel + d.dir + PAESI.length) % PAESI.length;
      });
      conn.on('close', () => { S.telefono = false; aggiornaQR(); });
    });
  } catch (e) { console.warn('PeerJS non disponibile: modalità solitaria', e); }
  function aggiornaQR() {
    const box = document.getElementById('qr');
    box.style.display = (S.scena === 'titolo' && !S.telefono && box.innerHTML) ? 'block' : 'none';
  }

  // --- input laptop (modalità solitaria / demo)
  function pos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
  cv.addEventListener('pointerdown', e => {
    const p = pos(e);
    if (S.scena === 'duello') lancia(p.x, p.y);
    else if (S.scena === 'scelta') {
      const i = Math.floor((p.x - 20) / 40);
      if (p.y > 90 && p.y < 150 && i >= 0 && i < PAESI.length) { if (i === S.sel) premi(); else S.sel = i; }
    } else premi();
  });
  addEventListener('keydown', e => {
    if (S.scena === 'scelta' && e.key === 'ArrowRight') S.sel = (S.sel + 1) % PAESI.length;
    if (S.scena === 'scelta' && e.key === 'ArrowLeft') S.sel = (S.sel - 1 + PAESI.length) % PAESI.length;
    if (e.key === 'Enter' || e.key === ' ') premi();
  });

  function premi() {
    if (S.scena === 'titolo') vai('scelta');
    else if (S.scena === 'scelta') { S.paese = PAESI[S.sel]; vai('pompe'); }
    else if (S.scena === 'pompe' && S.t > 1.2) iniziaDuello();
    else if (S.scena === 'mappa' && S.t > 1) vai('titolo');
    else if (S.scena === 'sconfitta' && S.t > 1.5) iniziaDuello();
  }
  function vai(sc) { S.scena = sc; S.t = 0; aggiornaQR(); }

  function iniziaDuello() {
    vai('duello');
    S.voli = []; S.piantate = []; S.restanti = CONFIG.bandierePerDuello; S.influenza = 0; S.flash = 0;
    S.leader = { x: 160, vx: 0, fase: Math.random() * 6, attesa: costoPieno(S.paese) >= costoPieno('italia') ? 2 : 0 };
  }

  // --- lancio
  function lancia(tx, ty) {
    if (S.restanti <= 0) return;
    S.restanti--;
    const peso = (PREZZI.brent_usd - 60) * 0.35; // Brent alto = bandiere più pesanti
    S.voli.push({ x0: 160, y0: 250, tx: tx + (Math.random() - .5) * 6, ty: ty + peso + (Math.random() - .5) * 6, t: 0 });
  }

  // sagoma del leader (per collisione)
  function tocca(x, y) {
    const L = S.leader.x;
    const testa = ((x - L) / 12) ** 2 + ((y - 62) / 15) ** 2 <= 1;
    const capelli = ((x - L) / 15) ** 2 + ((y - 46) / 11) ** 2 <= 1;
    const busto = x > L - 20 && x < L + 20 && y > 76 && y < 150;
    const gambe = x > L - 14 && x < L + 14 && y >= 150 && y < 204;
    return testa || capelli || busto || gambe;
  }
  const centro = () => ({ x: S.leader.x, y: 118 });

  function settoriCoperti() {
    const c = centro(), cop = new Array(CONFIG.settori).fill(false);
    S.piantate.forEach(p => {
      const dx = p.x - c.x, dy = p.y - c.y, d = Math.hypot(dx, dy);
      if (d < CONFIG.raggioCerchio + 30) {
        const a = (Math.atan2(dy, dx) + Math.PI * 2) % (Math.PI * 2);
        cop[Math.floor(a / (Math.PI * 2) * CONFIG.settori)] = true;
      }
    });
    return cop;
  }

  // --- aggiornamento
  function aggiorna(dt) {
    S.t += dt;
    if (S.scena !== 'duello') return;
    const L = S.leader;
    if (L.attesa > 0) L.attesa -= dt;
    else { L.fase += dt; L.x = 160 + Math.sin(L.fase * 0.9) * 46 + Math.sin(L.fase * 2.3) * 10; }

    S.voli.forEach(v => {
      v.t += dt / 0.45;
      if (v.t >= 1 && !v.fatto) {
        v.fatto = true;
        const dentro = v.tx > BOARD.x && v.tx < BOARD.x + BOARD.w && v.ty > BOARD.y && v.ty < BOARD.y + BOARD.h;
        if (tocca(v.tx, v.ty)) { S.flash = 1; vai('sconfitta'); return; }
        if (dentro) {
          S.piantate.push({ x: v.tx, y: v.ty, id: S.paese, t: 0 });
          const d = Math.hypot(v.tx - centro().x, v.ty - centro().y);
          S.influenza += Math.max(0, Math.round(70 - d));
        }
      }
    });
    S.voli = S.voli.filter(v => !v.fatto);
    S.piantate.forEach(p => p.t += dt);

    if (settoriCoperti().every(Boolean)) {
      S.sblocchi.roma = S.paese; S.sblocchi.bruxelles = 'aperto'; S.sblocchi.washington = 'aperto'; salva();
      vai('mappa');
    } else if (S.restanti === 0 && S.voli.length === 0) vai('sconfitta');
  }

  /* ---------------- disegno ---------------- */
  function sfondo() {
    if (CONFIG.live.roma) { g.clearRect(0, 0, W, H); return; }
    const h = oraRoma();
    const giorno = h >= 7 && h < 18, tram = (h >= 17 && h < 20) || (h >= 6 && h < 8);
    const cieloA = giorno ? '#5d8fd0' : tram ? '#d0705a' : '#0d1030';
    const cieloB = giorno ? '#a9cbe8' : tram ? '#f0b070' : '#2a2050';
    for (let y = 0; y < H; y += 4) { g.fillStyle = y / H < .5 ? cieloA : cieloB; if ((y / 4) % 2 && y / H > .4 && y / H < .6) g.fillStyle = cieloB; g.fillRect(0, y, W, 4); }
    // nuvole dal meteo reale
    g.fillStyle = giorno ? 'rgba(240,240,250,.8)' : 'rgba(80,80,110,.8)';
    const n = Math.round(S.meteo.nuvole / 15);
    for (let i = 0; i < n; i++) { const x = (i * 71 + S.t * 4) % (W + 60) - 30; g.fillRect(Math.round(x), 18 + (i * 23) % 50, 34, 8); g.fillRect(Math.round(x) + 8, 12 + (i * 23) % 50, 18, 8); }
    // skyline di Roma low-poly: cupola, colonne, scalinata
    g.fillStyle = giorno ? '#c99a6a' : '#3b2a35';
    g.fillRect(0, 170, W, 70);
    g.beginPath(); g.moveTo(20, 170); g.lineTo(34, 132); g.lineTo(48, 132); g.lineTo(62, 170); g.fill();
    g.beginPath(); g.arc(41, 130, 12, Math.PI, 0); g.fill(); g.fillRect(39, 112, 4, 8);
    for (let i = 0; i < 5; i++) g.fillRect(262 + i * 10, 140, 5, 30);
    g.fillRect(258, 134, 52, 6);
    g.fillStyle = giorno ? '#a77a52' : '#2a1d26';
    for (let i = 0; i < 6; i++) g.fillRect(i * 6, 214 + i * 4, W - i * 12, 4);
    // finestre accese di notte
    if (!giorno) { g.fillStyle = '#ffd36b'; for (let i = 0; i < 20; i++) g.fillRect((i * 37) % W, 178 + (i * 13) % 26, 2, 2); }
    // pioggia reale
    if (S.meteo.pioggia > 0) { g.fillStyle = 'rgba(180,200,255,.6)'; for (let i = 0; i < 80; i++) g.fillRect((i * 53 + S.t * 40) % W, (i * 31 + S.t * 220) % H, 1, 4); }
  }

  function parete() {
    g.fillStyle = '#6b3f22'; g.fillRect(BOARD.x, BOARD.y, BOARD.w, BOARD.h);
    g.fillStyle = '#7d4b2a'; for (let y = BOARD.y; y < BOARD.y + BOARD.h; y += 12) g.fillRect(BOARD.x, y, BOARD.w, 6);
    g.fillStyle = '#c8a14a'; g.fillRect(BOARD.x - 3, BOARD.y - 3, BOARD.w + 6, 3); g.fillRect(BOARD.x - 3, BOARD.y + BOARD.h, BOARD.w + 6, 3);
    g.fillRect(BOARD.x - 3, BOARD.y, 3, BOARD.h); g.fillRect(BOARD.x + BOARD.w, BOARD.y, 3, BOARD.h);
    // luci da circo
    for (let i = 0; i < 12; i++) { g.fillStyle = (Math.floor(S.t * 4) + i) % 2 ? '#ffe680' : '#a8742a'; g.fillRect(BOARD.x + 6 + i * 16, BOARD.y - 2, 3, 3); }
  }

  function leader(x) {
    x = Math.round(x + (Math.random() - .5) * .8); // tremolio PS1
    if (spriteOk) { g.drawImage(sprite, x - 32, 30, 64, 176); return; }
    const L = LEADER.italia;
    bandiera(g, 'italia', x - 36, 30, 72, 44); // bandiera alle spalle
    g.fillStyle = '#c9a98a'; g.fillRect(x - 4, 74, 8, 6);                    // collo
    g.fillStyle = '#d7b897';                                                  // testa liscia, senza volto
    g.beginPath(); g.ellipse(x, 62, 12, 15, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#efd4b6'; g.fillRect(x - 6, 54, 4, 10);                    // luce
    g.fillStyle = L.capelli;                                                  // capelli scultorei
    g.beginPath(); g.ellipse(x, 46, 15, 10, 0, Math.PI, 0); g.fill();
    g.beginPath(); g.ellipse(x + 8, 44, 9, 9, .4, 0, Math.PI * 2); g.fill();
    g.fillRect(x - 15, 46, 4, 12);
    g.fillStyle = L.abito; g.fillRect(x - 20, 80, 40, 70);                   // abito
    g.fillStyle = '#f1f2f1'; g.beginPath(); g.moveTo(x - 6, 80); g.lineTo(x, 96); g.lineTo(x + 6, 80); g.fill();
    g.fillStyle = '#009246'; g.fillRect(x - 1, 84, 2, 18);                    // cravatta tricolore
    g.fillStyle = L.abito; g.fillRect(x - 28, 82, 8, 50); g.fillRect(x + 20, 82, 8, 50); // braccia
    g.fillStyle = '#d7b897'; g.fillRect(x - 28, 132, 8, 6); g.fillRect(x + 20, 132, 8, 6);
    g.fillStyle = '#20202a'; g.fillRect(x + 22, 120, 4, 14); g.fillRect(x + 20, 116, 8, 6); // microfono
    g.fillStyle = '#151a2e'; g.fillRect(x - 14, 150, 12, 52); g.fillRect(x + 2, 150, 12, 52); // gambe
    g.fillStyle = '#0c0c0c'; g.fillRect(x - 16, 200, 14, 4); g.fillRect(x + 2, 200, 14, 4);
  }

  function asta(p, scala) {
    const s = scala || 1;
    g.fillStyle = '#d8d0b8'; g.fillRect(Math.round(p.x), Math.round(p.y - 12 * s), 1, Math.round(13 * s));
    const onda = Math.round(Math.sin((p.t || 0) * 6 + p.x) * 1);
    bandiera(g, p.id, p.x + 1, p.y - 12 * s + onda, Math.round(12 * s), Math.round(8 * s));
  }

  function hud() {
    // bandiere rimaste
    for (let i = 0; i < CONFIG.bandierePerDuello; i++) {
      if (i < S.restanti) bandiera(g, S.paese, 8 + i * 0 , 30 + i * 13, 12, 8);
      else { g.fillStyle = '#333'; g.fillRect(8, 30 + i * 13, 12, 8); }
    }
    // cerchio: spicchi coperti
    const cop = settoriCoperti(), c = centro();
    cop.forEach((ok, i) => {
      const a0 = i / CONFIG.settori * Math.PI * 2, a1 = (i + 1) / CONFIG.settori * Math.PI * 2;
      g.strokeStyle = ok ? 'rgba(255,230,90,.9)' : 'rgba(255,255,255,.18)'; g.lineWidth = 2;
      g.beginPath(); g.arc(c.x, c.y, CONFIG.raggioCerchio + 24, a0 + .08, a1 - .08); g.stroke();
    });
    // influenza (numero)
    numero(S.influenza, 290, 30);
    // barile Brent
    barile(292, 190, Math.min(1, PREZZI.brent_usd / 120));
  }

  function numero(n, x, y) { g.fillStyle = '#ffe680'; g.font = '10px monospace'; g.textAlign = 'center'; g.fillText(String(n), x, y); }

  function barile(x, y, liv) {
    g.fillStyle = '#222'; g.fillRect(x - 8, y - 22, 16, 24);
    g.fillStyle = '#1a1208'; g.fillRect(x - 6, y - 20 + Math.round(20 * (1 - liv)), 12, Math.round(20 * liv));
    g.fillStyle = '#c8a14a'; g.fillRect(x - 8, y - 16, 16, 1); g.fillRect(x - 8, y - 6, 16, 1);
  }

  function pompa(x, id, livello, accesa) {
    g.fillStyle = accesa && Math.floor(S.t * 4) % 2 ? '#ffe680' : '#c0392b'; g.fillRect(x - 22, 70, 44, 110);
    g.fillStyle = '#111'; g.fillRect(x - 16, 80, 32, 22);
    numero(Math.round(livello), x, 95);
    g.fillStyle = '#333'; g.fillRect(x - 16, 110, 32, 60);
    const h = Math.min(58, Math.round(livello / 160 * 58 * Math.min(1, S.t)));
    g.fillStyle = '#d9a31f'; g.fillRect(x - 15, 169 - h, 30, h);
    g.fillStyle = '#222'; g.fillRect(x + 22, 90, 6, 4); g.fillRect(x + 26, 90, 2, 50);
    bandiera(g, id, x - 14, 48, 28, 18);
  }

  function disegna() {
    sfondo();
    const sc = S.scena;
    if (sc === 'titolo') {
      parete(); leader(160);
      // icona start lampeggiante (nessun testo)
      if (Math.floor(S.t * 2) % 2) { g.fillStyle = '#ffe680'; g.beginPath(); g.moveTo(150, 214); g.lineTo(150, 234); g.lineTo(168, 224); g.fill(); }
      PAESI.forEach((id, i) => asta({ x: 72 + i * 28, y: 20, id, t: S.t }, 1));
    }
    if (sc === 'scelta') {
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, H);
      PAESI.forEach((id, i) => {
        const sel = i === S.sel, x = 20 + i * 40, y = sel ? 100 + Math.round(Math.sin(S.t * 8) * 3) : 108;
        if (sel) { g.fillStyle = '#ffe680'; g.fillRect(x - 2, y - 2, 36, 26); }
        bandiera(g, id, x, y, 32, 22);
      });
    }
    if (sc === 'pompe') {
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, 0, W, H);
      const a = costoPieno(S.paese), b = costoPieno('italia');
      pompa(105, S.paese, a, a >= b); pompa(215, 'italia', b, b > a);
      barile(160, 200, Math.min(1, PREZZI.brent_usd / 120));
      if (S.t > 1.2 && Math.floor(S.t * 2) % 2) { g.fillStyle = '#ffe680'; g.beginPath(); g.moveTo(152, 216); g.lineTo(152, 234); g.lineTo(168, 225); g.fill(); }
    }
    if (sc === 'duello' || sc === 'sconfitta') {
      parete();
      S.piantate.forEach(p => { if (sc === 'sconfitta') p.y = Math.min(236, p.y + S.t * 6); asta(p); });
      leader(S.leader.x);
      S.voli.forEach(v => {
        const t = Math.min(1, v.t), x = v.x0 + (v.tx - v.x0) * t, y = v.y0 + (v.ty - v.y0) * t - Math.sin(t * Math.PI) * 40;
        asta({ x, y, id: S.paese, t: S.t }, 2.2 - t * 1.2);
      });
      if (sc === 'duello') hud();
      if (sc === 'sconfitta') { g.fillStyle = `rgba(200,0,0,${Math.max(0, .5 - S.t * .3)})`; g.fillRect(0, 0, W, H); }
    }
    if (sc === 'mappa') mappa();
  }

  function mappa() {
    g.fillStyle = 'rgba(0,0,20,.8)'; g.fillRect(0, 0, W, H);
    const nodi = {
      roma: [160, 40], bruxelles: [96, 100], washington: [224, 100],
      budapest: [56, 160], mosca: [132, 160], pechino: [188, 160], riad: [264, 160], vertice: [160, 215],
    };
    const archi = [['roma', 'bruxelles'], ['roma', 'washington'], ['bruxelles', 'budapest'], ['bruxelles', 'mosca'], ['washington', 'pechino'], ['washington', 'riad'],
      ['budapest', 'vertice'], ['mosca', 'vertice'], ['pechino', 'vertice'], ['riad', 'vertice']];
    g.strokeStyle = '#555'; g.lineWidth = 1;
    archi.forEach(([a, b]) => { g.beginPath(); g.moveTo(nodi[a][0], nodi[a][1]); g.lineTo(nodi[b][0], nodi[b][1]); g.stroke(); });
    Object.entries(nodi).forEach(([k, [x, y]]) => {
      const st = S.sblocchi[k];
      if (k === 'roma' && st) bandiera(g, st, x - 14, y - 9, 28, 18);
      else if (st === 'aperto') { g.fillStyle = Math.floor(S.t * 3) % 2 ? '#ffe680' : '#7a6420'; g.fillRect(x - 10, y - 7, 20, 14); }
      else { g.fillStyle = '#333'; g.fillRect(x - 10, y - 7, 20, 14); }
    });
  }

  let prima = performance.now();
  function ciclo(ora) {
    const dt = Math.min(.05, (ora - prima) / 1000); prima = ora;
    aggiorna(dt); disegna();
    requestAnimationFrame(ciclo);
  }
  requestAnimationFrame(ciclo);
}

/* ============================================================
   TELEFONO · CONTROLLER
   ============================================================ */
function avviaTelefono() {
  document.getElementById('stage').style.display = 'none';
  const pad = document.getElementById('pad'); pad.style.display = 'block';
  const cv = document.getElementById('padc'), g = cv.getContext('2d');
  let conn = null, connesso = false, inizio = null, paese = 0, scia = 0;
  const id = new URLSearchParams(location.search).get('id');

  function ridimensiona() { cv.width = 160; cv.height = Math.round(160 * innerHeight / innerWidth); g.imageSmoothingEnabled = false; }
  ridimensiona(); addEventListener('resize', ridimensiona);

  try {
    const peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect('grandelancio-' + id);
      conn.on('open', () => connesso = true);
      conn.on('close', () => connesso = false);
    });
  } catch (e) { console.warn(e); }
  const invia = d => { if (conn && connesso) conn.send(d); };

  cv.addEventListener('touchstart', e => { const t = e.touches[0]; inizio = { x: t.clientX, y: t.clientY, t: performance.now() }; e.preventDefault(); }, { passive: false });
  cv.addEventListener('touchend', e => {
    if (!inizio) return;
    const t = e.changedTouches[0], dx = t.clientX - inizio.x, dy = t.clientY - inizio.y;
    if (dy < -40) { // swipe verso l'alto = lancio
      const ax = Math.max(-1, Math.min(1, dx / (innerWidth * .5)));
      const ay = Math.max(0, Math.min(1, -dy / (innerHeight * .75)));
      invia({ tipo: 'lancio', ax, ay }); scia = 1;
    } else if (Math.abs(dx) > 40) { const dir = dx > 0 ? 1 : -1; paese = (paese + dir + PAESI.length) % PAESI.length; invia({ tipo: 'scelta', dir }); }
    else invia({ tipo: 'tocco' });
    inizio = null;
  });

  function disegna() {
    const W = cv.width, H = cv.height;
    g.fillStyle = '#111'; g.fillRect(0, 0, W, H);
    g.fillStyle = connesso ? '#3c3' : '#c33'; g.fillRect(W - 10, 6, 5, 5);  // stato collegamento
    const y = H * .45 - scia * H * .4;
    g.fillStyle = '#d8d0b8'; g.fillRect(W / 2 - 1, y, 2, 60);
    bandiera(g, PAESI[paese], W / 2 + 1, y, 44, 30);
    g.fillStyle = 'rgba(255,230,128,.5)';                       // freccia: swipe in su
    g.beginPath(); g.moveTo(W / 2, H - 40); g.lineTo(W / 2 - 12, H - 24); g.lineTo(W / 2 + 12, H - 24); g.fill();
    scia = Math.max(0, scia - .06);
    requestAnimationFrame(disegna);
  }
  disegna();
}
